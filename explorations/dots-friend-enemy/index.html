<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Friends &amp; Enemies — dot simulation</title>
<style>
  :root {
    --bg: #0a0b0f;
    --panel: rgba(20,22,30,.82);
    --line: rgba(255,255,255,.10);
    --text: #e6e8ef;
    --dim: #8e93a6;
    --accent: #7dd3fc;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  body {
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    overflow: hidden;
  }
  canvas { display: block; width: 100vw; height: 100vh; }

  #ui {
    position: fixed; top: 14px; right: 14px; width: 268px;
    max-height: calc(100vh - 28px); overflow-y: auto;
    background: var(--panel); backdrop-filter: blur(12px);
    border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px 14px;
  }
  #ui.collapsed .body { display: none; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  h1 { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; margin: 0; color: var(--dim); }
  #toggle { background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 6px;
            cursor: pointer; font-size: 11px; padding: 2px 7px; }
  #toggle:hover { color: var(--text); }

  .group { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .group:first-of-type { border-top: 0; }
  .glabel { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }

  .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 8px; margin-bottom: 9px; }
  .row label { font-size: 12px; color: var(--text); }
  .row .val { font-variant-numeric: tabular-nums; font-size: 11px; color: var(--accent); }
  .row input[type=range] { grid-column: 1 / -1; width: 100%; height: 3px; -webkit-appearance: none;
                           appearance: none; background: rgba(255,255,255,.14); border-radius: 2px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px;
    border-radius: 50%; background: var(--accent); cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%;
    background: var(--accent); cursor: pointer; }

  .check { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; cursor: pointer; }
  .check input { accent-color: var(--accent); }

  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  button.act { flex: 1 1 auto; background: rgba(255,255,255,.06); border: 1px solid var(--line);
               color: var(--text); border-radius: 7px; padding: 6px 8px; cursor: pointer; font-size: 12px; }
  button.act:hover { background: rgba(255,255,255,.12); }
  button.act.on { background: var(--accent); border-color: var(--accent); color: #06121a; }

  select { width: 100%; background: rgba(255,255,255,.06); color: var(--text);
           border: 1px solid var(--line); border-radius: 7px; padding: 5px 7px; font-size: 12px; }

  .regime { font-size: 11px; line-height: 1.4; padding: 6px 8px; border-radius: 6px;
            margin: -2px 0 9px; background: rgba(251,191,36,.10); color: #fcd34d;
            border: 1px solid rgba(251,191,36,.22); }

  #stats { position: fixed; left: 14px; bottom: 12px; color: var(--dim); font-size: 11px;
           font-variant-numeric: tabular-nums; }
  .hint { color: var(--dim); font-size: 11px; margin-top: 8px; }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="stats"></div>

<aside id="ui">
  <header>
    <h1>Friends &amp; Enemies</h1>
    <button id="toggle">hide</button>
  </header>

  <div class="body">
    <div class="group">
      <div class="glabel">Presets</div>
      <div class="btns" id="presets"></div>
    </div>

    <div class="group">
      <div class="glabel">Rules</div>
      <div class="row">
        <label>Step model</label><span></span>
        <select id="model">
          <option value="fixed">Fixed — constant step size</option>
          <option value="prop">Proportional — % of the gap</option>
        </select>
      </div>
      <div class="row" data-model="fixed">
        <label>Step toward friend</label><span class="val" id="v_ff"></span>
        <input type="range" id="ff" min="0" max="9" step="0.05">
      </div>
      <div class="row" data-model="fixed">
        <label>Step away from enemy</label><span class="val" id="v_ef"></span>
        <input type="range" id="ef" min="0" max="9" step="0.05">
      </div>
      <div class="row" data-model="prop">
        <label>Toward friend</label><span class="val" id="v_fp"></span>
        <input type="range" id="fp" min="0" max="0.2" step="0.001">
      </div>
      <div class="row" data-model="prop">
        <label>Away from enemy</label><span class="val" id="v_ep"></span>
        <input type="range" id="ep" min="0" max="0.2" step="0.001">
      </div>
      <div class="regime" data-model="prop" id="regime"></div>
      <div class="row">
        <label>Pull to centre</label><span class="val" id="v_cp"></span>
        <input type="range" id="cp" min="0" max="0.05" step="0.0005">
      </div>
      <div class="row">
        <label>Re-choices / sec</label><span class="val" id="v_rc"></span>
        <input type="range" id="rc" min="0" max="60" step="0.5">
      </div>
    </div>

    <div class="group">
      <div class="glabel">World</div>
      <div class="row">
        <label>Dots</label><span class="val" id="v_n"></span>
        <input type="range" id="n" min="3" max="2000" step="1">
      </div>
      <div class="row">
        <label>Steps / frame</label><span class="val" id="v_sf"></span>
        <input type="range" id="sf" min="1" max="20" step="1">
      </div>
    </div>

    <div class="group">
      <div class="glabel">Look</div>
      <div class="row">
        <label>Trail length</label><span class="val" id="v_fade"></span>
        <input type="range" id="fade" min="0" max="100" step="1">
      </div>
      <div class="row">
        <label>Dot size</label><span class="val" id="v_ds"></span>
        <input type="range" id="ds" min="0.5" max="6" step="0.1">
      </div>
      <label class="check"><input type="checkbox" id="links"> Show friend / enemy links</label>
      <label class="check"><input type="checkbox" id="floor"> Show floor + centre</label>
    </div>

    <div class="group">
      <div class="btns">
        <button class="act" id="pause">pause</button>
        <button class="act" id="scatter">scatter</button>
        <button class="act" id="reroll">reroll ties</button>
      </div>
      <div class="hint">space = pause · r = scatter · t = reroll ties · l = links</div>
    </div>
  </div>
</aside>

<script>
"use strict";

/* ---------------------------------------------------------------------------
   THE RULES (from the tweet)

   Every dot picks one friend and one enemy at random. Then, each step, every
   dot simultaneously:
     1. moves 0.5% of the way toward the centre of the floor,
     2. takes a LARGE step toward its friend,
     3. takes a SMALL step away from its enemy.
   At random intervals, one dot re-rolls its friend and enemy.

   "Large step" / "small step" is ambiguous, so both readings are here:

     fixed — a constant distance per step (a stride). Bounded by construction:
             the repulsion can never outrun the centre pull, which grows with
             distance. This is where all the interesting structure lives.

     prop  — a fraction of the current gap. Measured, this reading is a dead
             end, and it's worth knowing why. Each dot's update is linear:
               p' = (1 - c - kF + kE)·p + c·C + kF·friend - kE·enemy
             so the whole system is one matrix, and it has exactly two fates.
             Repulsion is destabilising (the -kE·enemy term feeds outward), the
             centre pull is stabilising. Roughly, when 2·kE > c it inflates
             until everything jams against the floor edge; otherwise it's a
             contraction and every dot collapses onto the centre point. There
             is no bounded, structured middle — just a knife edge between the
             two. That's strong evidence the original uses fixed-size steps.
             Kept as a mode because watching it fail is instructive; the panel
             tells you which of the two regimes you're in.

   Everything below is just that, plus rendering.
--------------------------------------------------------------------------- */

const P = {
  n: 400,
  model: "fixed",
  friendFixed: 4.00,   // px per step, on an 800px-tall floor
  enemyFixed: 1.50,    // px per step, on an 800px-tall floor
  friendProp: 0.030,   // fraction of gap
  enemyProp: 0.010,    // fraction of gap
  centerPull: 0.005,   // the 0.5%
  rechoosePerSec: 2,
  stepsPerFrame: 1,
  fade: 12,            // 0 = infinite trails, 100 = none
  dotSize: 2.0,
  links: false,
  floor: false,
  paused: false,
};

// Measured, not guessed — each of these was swept for "stays on the floor,
// stays in motion, doesn't collapse to a dot".
const PRESETS = {
  "tweet": { model:"fixed", friendFixed:4.00, enemyFixed:1.50, centerPull:0.005,
             rechoosePerSec:2, n:400, fade:12, dotSize:2.0, stepsPerFrame:1 },
  "orbits": { model:"fixed", friendFixed:4.00, enemyFixed:2.60, centerPull:0.005,
              rechoosePerSec:2, n:500, fade:6, dotSize:1.6, stepsPerFrame:1 },
  "swarm": { model:"fixed", friendFixed:2.50, enemyFixed:1.90, centerPull:0.005,
             rechoosePerSec:25, n:800, fade:20, dotSize:1.4, stepsPerFrame:1 },
  "knot": { model:"fixed", friendFixed:1.30, enemyFixed:0.90, centerPull:0.005,
            rechoosePerSec:0, n:600, fade:4, dotSize:1.5, stepsPerFrame:1 },
  "linear": { model:"prop", friendProp:0.030, enemyProp:0.010, centerPull:0.005,
              rechoosePerSec:2, n:400, fade:25, dotSize:2.0, stepsPerFrame:1 },
};

// ---- state -----------------------------------------------------------------
let x, y, px, py, friend, enemy;   // typed arrays, length P.n
let W = 0, H = 0, cx = 0, cy = 0, maxR = 0, dpr = 1;

const cv = document.getElementById("c");
const ctx = cv.getContext("2d", { alpha: false });

const rnd = (a, b) => a + Math.random() * (b - a);
const randInt = (m) => (Math.random() * m) | 0;

function resize() {
  const hadFloor = maxR > 0;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth || 1; H = cv.clientHeight || 1;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = W / 2; cy = H / 2;
  maxR = Math.min(W, H) * 0.75;          // soft edge of the floor
  ctx.fillStyle = "#0a0b0f";
  ctx.fillRect(0, 0, W, H);
  // If we booted into a zero-size canvas (hidden tab, collapsed pane), every
  // dot got clamped onto a single point. Give them a floor to spread out on.
  if (!hadFloor && maxR > 1 && x) scatter();
}

// One dot re-rolls its friend and its enemy. Never itself, never the same dot
// for both — a dot chasing and fleeing the same target just cancels out.
function assign(i) {
  const n = P.n;
  if (n < 3) { friend[i] = i; enemy[i] = i; return; }
  let f = randInt(n); while (f === i) f = randInt(n);
  let e = randInt(n); while (e === i || e === f) e = randInt(n);
  friend[i] = f; enemy[i] = e;
}

function scatter() {
  const r0 = Math.min(W, H) * 0.35;
  for (let i = 0; i < P.n; i++) {
    const a = rnd(0, Math.PI * 2), r = r0 * Math.sqrt(Math.random());
    x[i] = cx + Math.cos(a) * r;
    y[i] = cy + Math.sin(a) * r;
  }
}

function rebuild(keepTies) {
  const n = P.n;
  const oldF = friend, oldE = enemy, oldN = x ? x.length : 0;
  x = new Float64Array(n); y = new Float64Array(n);
  px = new Float64Array(n); py = new Float64Array(n);
  friend = new Int32Array(n); enemy = new Int32Array(n);
  scatter();
  for (let i = 0; i < n; i++) {
    if (keepTies && i < oldN && oldF[i] < n && oldE[i] < n) {
      friend[i] = oldF[i]; enemy[i] = oldE[i];
    } else assign(i);
  }
}

// ---- the simulation --------------------------------------------------------
let rechooseAcc = 0;

function step() {
  const n = P.n;

  // "At random intervals one dot re-chooses friend and enemy."
  rechooseAcc += P.rechoosePerSec / 60;
  while (rechooseAcc >= 1) { rechooseAcc -= 1; assign(randInt(n)); }

  // Snapshot: every dot reacts to where everyone was, not to half-updated
  // neighbours. "At each step EVERY dot moves" — simultaneous, not sequential.
  px.set(x); py.set(y);

  const fixed = P.model === "fixed";
  // Fixed strides are in px, but the centre pull is a *fraction* of distance,
  // so the equilibrium radius is roughly stride/pull — which would shrink to a
  // speck on a big monitor. Scale the stride with the floor so the picture
  // looks the same everywhere. Slider values are px on an 800px-tall floor.
  const unit = Math.min(W, H) / 800;
  const kFf = P.friendFixed * unit, kEf = P.enemyFixed * unit;
  const kFp = P.friendProp, kEp = P.enemyProp;
  const cp = P.centerPull;

  for (let i = 0; i < n; i++) {
    const xi = px[i], yi = py[i];
    let X = xi, Y = yi;

    // 1. 0.5% of the way to the centre of the floor
    X += cp * (cx - xi);
    Y += cp * (cy - yi);

    // 2. toward the friend
    const fdx = px[friend[i]] - xi, fdy = py[friend[i]] - yi;
    // 3. away from the enemy
    const edx = xi - px[enemy[i]], edy = yi - py[enemy[i]];

    if (fixed) {
      const fd = Math.hypot(fdx, fdy);
      if (fd > 1e-9) { X += kFf * fdx / fd; Y += kFf * fdy / fd; }
      const ed = Math.hypot(edx, edy);
      if (ed > 1e-9) { X += kEf * edx / ed; Y += kEf * edy / ed; }
    } else {
      X += kFp * fdx; Y += kFp * fdy;
      X += kEp * edx; Y += kEp * edy;
    }

    // Keep everyone on the floor. With proportional steps the enemy term can
    // out-pull the centre term and slowly inflate, so this is the backstop.
    const dx = X - cx, dy = Y - cy, d = Math.hypot(dx, dy);
    if (d > maxR) { X = cx + dx / d * maxR; Y = cy + dy / d * maxR; }

    x[i] = X; y[i] = Y;
  }
}

// ---- rendering -------------------------------------------------------------
function draw() {
  // Trails: instead of clearing, paint a translucent veil over the last frame.
  ctx.fillStyle = "rgba(10,11,15," + (P.fade / 100) + ")";
  ctx.fillRect(0, 0, W, H);

  if (P.floor) {
    ctx.strokeStyle = "rgba(255,255,255,.09)";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, maxR, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.fill();
  }

  const n = P.n;

  if (P.links) {
    ctx.lineWidth = 0.6;
    ctx.strokeStyle = "rgba(125,211,252,.16)";       // friend
    ctx.beginPath();
    for (let i = 0; i < n; i++) { ctx.moveTo(x[i], y[i]); ctx.lineTo(x[friend[i]], y[friend[i]]); }
    ctx.stroke();
    ctx.strokeStyle = "rgba(248,113,113,.10)";       // enemy
    ctx.beginPath();
    for (let i = 0; i < n; i++) { ctx.moveTo(x[i], y[i]); ctx.lineTo(x[enemy[i]], y[enemy[i]]); }
    ctx.stroke();
  }

  // Hue by index, so you can see which dots ended up travelling together.
  const r = P.dotSize;
  for (let i = 0; i < n; i++) {
    ctx.fillStyle = "hsl(" + ((i * 360 / n) | 0) + " 85% 62%)";
    ctx.beginPath();
    ctx.arc(x[i], y[i], r, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ---- loop ------------------------------------------------------------------
let lastT = performance.now(), fps = 0;

function frame(t) {
  const dt = t - lastT; lastT = t;
  fps += ((1000 / Math.max(dt, 1)) - fps) * 0.1;

  if (!P.paused) for (let s = 0; s < P.stepsPerFrame; s++) step();
  draw();

  document.getElementById("stats").textContent =
    P.n + " dots · " + P.stepsPerFrame + "×/frame · " + fps.toFixed(0) + " fps" +
    (P.paused ? " · paused" : "");

  requestAnimationFrame(frame);
}

// ---- controls --------------------------------------------------------------
const $ = (id) => document.getElementById(id);

const SLIDERS = [
  ["ff", "friendFixed",     (v) => v.toFixed(2) + " px"],
  ["ef", "enemyFixed",      (v) => v.toFixed(2) + " px"],
  ["fp", "friendProp",      (v) => (v * 100).toFixed(1) + "%"],
  ["ep", "enemyProp",       (v) => (v * 100).toFixed(1) + "%"],
  ["cp", "centerPull",      (v) => (v * 100).toFixed(2) + "%"],
  ["rc", "rechoosePerSec",  (v) => v.toFixed(1)],
  ["n",  "n",               (v) => String(v)],
  ["sf", "stepsPerFrame",   (v) => String(v)],
  ["fade", "fade",          (v) => v === 0 ? "infinite" : String(100 - v)],
  ["ds", "dotSize",         (v) => v.toFixed(1)],
];

// The proportional model is a linear system with only two fates. Say which.
function updateRegime() {
  const el = $("regime");
  const margin = P.centerPull - 2 * P.enemyProp;
  if (Math.abs(margin) < 0.002) {
    el.textContent = "Knife edge — barely bounded. Nudge either slider and it "
      + "tips into inflating or collapsing.";
  } else if (margin < 0) {
    el.textContent = "Inflating: 2 × enemy (" + (2 * P.enemyProp * 100).toFixed(1)
      + "%) beats the centre pull (" + (P.centerPull * 100).toFixed(2)
      + "%). Everything drifts out and jams against the floor edge.";
  } else {
    el.textContent = "Collapsing: the centre pull wins, so every dot converges "
      + "onto the centre point. Structure dies out.";
  }
}

function syncUI() {
  for (const [id, key, fmt] of SLIDERS) {
    $(id).value = P[key];
    $("v_" + id).textContent = fmt(P[key]);
  }
  $("model").value = P.model;
  $("links").checked = P.links;
  $("floor").checked = P.floor;
  $("pause").classList.toggle("on", P.paused);
  $("pause").textContent = P.paused ? "resume" : "pause";
  document.querySelectorAll("[data-model]").forEach((el) => {
    el.style.display = (el.dataset.model === (P.model === "fixed" ? "fixed" : "prop")) ? "" : "none";
  });
  updateRegime();
}

for (const [id, key, fmt] of SLIDERS) {
  $(id).addEventListener("input", (e) => {
    const v = parseFloat(e.target.value);
    if (key === "n") { P.n = v | 0; rebuild(false); }
    else P[key] = v;
    $("v_" + id).textContent = fmt(P[key]);
    if (key === "enemyProp" || key === "centerPull") updateRegime();
  });
}

$("model").addEventListener("change", (e) => { P.model = e.target.value; syncUI(); });
$("links").addEventListener("change", (e) => { P.links = e.target.checked; });
$("floor").addEventListener("change", (e) => { P.floor = e.target.checked; });
$("pause").addEventListener("click", () => { P.paused = !P.paused; syncUI(); });
$("scatter").addEventListener("click", () => scatter());
$("reroll").addEventListener("click", () => { for (let i = 0; i < P.n; i++) assign(i); });
$("toggle").addEventListener("click", () => {
  const ui = $("ui"); ui.classList.toggle("collapsed");
  $("toggle").textContent = ui.classList.contains("collapsed") ? "show" : "hide";
});

const presetBar = $("presets");
for (const name of Object.keys(PRESETS)) {
  const b = document.createElement("button");
  b.className = "act"; b.textContent = name;
  b.addEventListener("click", () => {
    Object.assign(P, PRESETS[name]);
    rebuild(false); syncUI();
    ctx.fillStyle = "#0a0b0f"; ctx.fillRect(0, 0, W, H);
  });
  presetBar.appendChild(b);
}

addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (e.code === "Space") { e.preventDefault(); P.paused = !P.paused; syncUI(); }
  else if (e.key === "r") scatter();
  else if (e.key === "t") { for (let i = 0; i < P.n; i++) assign(i); }
  else if (e.key === "l") { P.links = !P.links; syncUI(); }
});

addEventListener("resize", resize);

// ---- go --------------------------------------------------------------------
resize();
rebuild(false);
syncUI();
requestAnimationFrame(frame);
</script>
</body>
</html>
