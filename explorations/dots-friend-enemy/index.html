<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Friends &amp; Enemies — dot simulation</title>
<style>
  :root {
    --panel: rgba(18,20,27,.80);
    --line: rgba(255,255,255,.11);
    --text: #e6e8ef;
    --dim: #8e93a6;
    --accent: #7dd3fc;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #05070a; }
  body {
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text); overflow: hidden;
  }
  canvas { display: block; width: 100vw; height: 100vh; }

  #ui {
    position: fixed; top: 14px; right: 14px; width: 274px;
    max-height: calc(100vh - 28px); overflow-y: auto;
    background: var(--panel); backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px 14px;
  }
  #ui.collapsed .body { display: none; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  h1 { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
       margin: 0; color: var(--dim); }
  #toggle { background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 6px;
            cursor: pointer; font-size: 11px; padding: 2px 7px; }
  #toggle:hover { color: var(--text); }

  .group { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .group:first-of-type { border-top: 0; margin-top: 10px; padding-top: 0; }
  .glabel { font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: var(--dim);
            margin-bottom: 8px; }

  .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 8px;
         margin-bottom: 9px; }
  .row label { font-size: 12px; }
  .row .val { font-variant-numeric: tabular-nums; font-size: 11px; color: var(--accent); }
  .row input[type=range] { grid-column: 1 / -1; width: 100%; height: 3px; -webkit-appearance: none;
                           appearance: none; background: rgba(255,255,255,.14); border-radius: 2px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px;
    border-radius: 50%; background: var(--accent); cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%;
    background: var(--accent); cursor: pointer; }

  .check { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; cursor: pointer;
           font-size: 12px; }
  .check input { accent-color: var(--accent); }

  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  button.act { flex: 1 1 auto; background: rgba(255,255,255,.06); border: 1px solid var(--line);
               color: var(--text); border-radius: 7px; padding: 6px 8px; cursor: pointer;
               font-size: 12px; }
  button.act:hover { background: rgba(255,255,255,.13); }
  button.act.on { background: var(--accent); border-color: var(--accent); color: #06121a;
                  font-weight: 600; }

  /* look swatches */
  #looks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  button.look { display: flex; align-items: center; gap: 8px; text-align: left;
                background: rgba(255,255,255,.05); border: 1px solid var(--line); color: var(--text);
                border-radius: 8px; padding: 7px 8px; cursor: pointer; font-size: 12px; }
  button.look:hover { background: rgba(255,255,255,.12); }
  button.look.on { border-color: var(--accent); background: rgba(125,211,252,.13); }
  button.look .sw { width: 15px; height: 15px; border-radius: 4px; flex: 0 0 auto;
                    border: 1px solid rgba(255,255,255,.22); }

  select { width: 100%; background: rgba(255,255,255,.06); color: var(--text);
           border: 1px solid var(--line); border-radius: 7px; padding: 5px 7px; font-size: 12px; }

  .regime { font-size: 11px; line-height: 1.4; padding: 6px 8px; border-radius: 6px;
            margin: -2px 0 9px; background: rgba(251,191,36,.10); color: #fcd34d;
            border: 1px solid rgba(251,191,36,.22); }
  .note { font-size: 11px; line-height: 1.4; color: var(--dim); margin-top: 7px; }

  #stats { position: fixed; left: 14px; bottom: 12px; font-size: 11px;
           font-variant-numeric: tabular-nums; pointer-events: none; }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="stats"></div>

<aside id="ui">
  <header>
    <h1>Friends &amp; Enemies</h1>
    <button id="toggle">hide</button>
  </header>

  <div class="body">
    <div class="group">
      <div class="glabel">Look</div>
      <div id="looks"></div>
      <label class="check" style="margin-top:9px"><input type="checkbox" id="skeleton">
        Emphasise the skeleton</label>
      <label class="check" data-trail="bloom"><input type="checkbox" id="streaks">
        Draw motion as streaks</label>
      <!-- NOT data-look: the look buttons already own dataset.look -->
      <div class="row" data-needslook="basins">
        <label>Hue drift</label><span class="val" id="v_hd"></span>
        <input type="range" id="hd" min="0" max="0.5" step="0.005">
      </div>
      <div class="note" id="looknote"></div>
    </div>

    <div class="group">
      <div class="glabel">Motion</div>
      <div class="btns" id="trails" style="margin-bottom:10px"></div>
      <div class="row" data-trail="ribbons">
        <label>Trail length</label><span class="val" id="v_tf"></span>
        <input type="range" id="tf" min="1" max="128" step="1">
      </div>
      <div class="row" data-trail="bloom">
        <label>Trail length</label><span class="val" id="v_fade"></span>
        <input type="range" id="fade" min="0" max="100" step="1">
      </div>
      <div class="note" data-trail="bloom" id="bloomnote"></div>
      <div class="row">
        <label>Stroke weight</label><span class="val" id="v_wt"></span>
        <input type="range" id="wt" min="0.3" max="4" step="0.1">
      </div>
      <div class="row">
        <label>Speed → brightness</label><span class="val" id="v_sr"></span>
        <input type="range" id="sr" min="0" max="1" step="0.05">
      </div>
      <div class="row">
        <label>Pulse depth</label><span class="val" id="v_pd"></span>
        <input type="range" id="pd" min="0" max="1" step="0.02">
      </div>
      <div class="row">
        <label>Pulse period</label><span class="val" id="v_pp"></span>
        <input type="range" id="pp" min="2" max="240" step="1">
      </div>
    </div>

    <div class="group">
      <div class="glabel">Influences</div>
      <label class="check"><input type="checkbox" id="attractorOn"> Wandering attractor</label>
      <div class="row" data-needs="attractorOn">
        <label>Attractor pull</label><span class="val" id="v_ak"></span>
        <input type="range" id="ak" min="0" max="0.06" step="0.001">
      </div>
      <div class="row" data-needs="attractorOn">
        <label>Attractor speed</label><span class="val" id="v_as"></span>
        <input type="range" id="as" min="0.1" max="4" step="0.05">
      </div>

      <label class="check"><input type="checkbox" id="predatorOn"> Predator</label>
      <div class="row" data-needs="predatorOn">
        <label>Predator push</label><span class="val" id="v_pk"></span>
        <input type="range" id="pk" min="0" max="20" step="0.25">
      </div>
      <div class="row" data-needs="predatorOn">
        <label>Predator reach</label><span class="val" id="v_pr"></span>
        <input type="range" id="pr" min="0.04" max="0.6" step="0.01">
      </div>
      <div class="row" data-needs="predatorOn">
        <label>Predator speed</label><span class="val" id="v_ps"></span>
        <input type="range" id="ps" min="0.2" max="10" step="0.1">
      </div>
      <label class="check" data-needs="predatorOn"><input type="checkbox" id="predatorHunts">
        It hunts (else it orbits)</label>

      <div class="regime" id="leashnote"></div>
      <div class="glabel" style="margin-top:10px">Their appearance</div>
      <div class="btns" id="agentstyle"></div>
      <div class="note">Hidden is the purist setting — you read them from what the dots do.</div>
    </div>

    <div class="group">
      <div class="glabel">Presets</div>
      <div class="btns" id="presets"></div>
    </div>

    <div class="group">
      <div class="glabel">Rules</div>
      <div class="row">
        <label>Step model</label><span></span>
        <select id="model">
          <option value="fixed">Fixed — constant step size</option>
          <option value="prop">Proportional — % of the gap</option>
        </select>
      </div>
      <div class="row" data-model="fixed">
        <label>Step toward friend</label><span class="val" id="v_ff"></span>
        <input type="range" id="ff" min="0" max="9" step="0.05">
      </div>
      <div class="row" data-model="fixed">
        <label>Step away from enemy</label><span class="val" id="v_ef"></span>
        <input type="range" id="ef" min="0" max="9" step="0.05">
      </div>
      <div class="row" data-model="prop">
        <label>Toward friend</label><span class="val" id="v_fp"></span>
        <input type="range" id="fp" min="0" max="0.2" step="0.001">
      </div>
      <div class="row" data-model="prop">
        <label>Away from enemy</label><span class="val" id="v_ep"></span>
        <input type="range" id="ep" min="0" max="0.2" step="0.001">
      </div>
      <div class="regime" data-model="prop" id="regime"></div>
      <div class="row">
        <label>Pull to centre</label><span class="val" id="v_cp"></span>
        <input type="range" id="cp" min="0" max="0.05" step="0.0005">
      </div>
      <div class="row">
        <label>Re-choices / sec</label><span class="val" id="v_rc"></span>
        <input type="range" id="rc" min="0" max="60" step="0.5">
      </div>
    </div>

    <div class="group">
      <div class="glabel">World</div>
      <div class="row">
        <label>Dots</label><span class="val" id="v_n"></span>
        <input type="range" id="n" min="3" max="2000" step="1">
      </div>
      <div class="row">
        <label>Steps / frame</label><span class="val" id="v_sf"></span>
        <input type="range" id="sf" min="0.05" max="8" step="0.05">
      </div>
      <label class="check"><input type="checkbox" id="links"> Show friend / enemy links</label>
      <label class="check"><input type="checkbox" id="floor"> Show floor + centre</label>
    </div>

    <div class="group">
      <div class="btns">
        <button class="act" id="pause">pause</button>
        <button class="act" id="scatter">scatter</button>
        <button class="act" id="reroll">reroll ties</button>
      </div>
      <div class="note">space pause · r scatter · t reroll · l links · 1–5 looks</div>
    </div>
  </div>
</aside>

<script>
"use strict";

/* ---------------------------------------------------------------------------
   THE RULES (from the tweet)

   Every dot picks one friend and one enemy at random. Then, each step, every
   dot simultaneously:
     1. moves 0.5% of the way toward the centre of the floor,
     2. takes a LARGE step toward its friend,
     3. takes a SMALL step away from its enemy.
   At random intervals, one dot re-rolls its friend and enemy.

   Two readings of "large step / small step":

     fixed — a constant distance per step. Bounded by construction: repulsion is
             capped while the centre pull grows with distance. All the structure
             lives here.

     prop  — a fraction of the current gap. Measured, a dead end. The update is
             linear, so the whole system is one matrix with exactly two fates:
             when 2·kE > c it inflates until everything jams on the floor edge,
             otherwise it contracts to a single point. No bounded middle. Kept
             because watching it fail explains why fixed is the right reading.

   V2 is a rendering rewrite. The physics below is unchanged from V1.
--------------------------------------------------------------------------- */

const P = {
  n: 500,
  model: "fixed",
  friendFixed: 4.00,   // px per step, on an 800px-tall floor
  enemyFixed: 2.60,    // px per step, on an 800px-tall floor
  friendProp: 0.030,   // fraction of gap
  enemyProp: 0.010,    // fraction of gap
  centerPull: 0.005,   // the 0.5%
  rechoosePerSec: 2,
  stepsPerFrame: 1,    // fractional: <1 runs a step every 1/n frames

  look: "phosphor",
  trail: "ribbons",    // "ribbons" (geometry) | "bloom" (accumulate + fade)
  trailFrames: 45,     // ribbons: exact trail length, in frames
  fade: 8,             // bloom: 0 = never fades, 100 = no trails
  weight: 1.0,         // stroke weight multiplier
  speedResponse: 0.7,  // how much speed drives brightness/width
  skeleton: true,      // emphasise dots sitting on a friend-graph cycle
  streaks: true,       // draw was→is segments instead of dots
  pulseDepth: 0,       // 0 = off — deliberate brightness pulse
  pulsePeriod: 24,     // steps per pulse cycle
  hueDrift: 0,         // degrees per step, 0 = fixed basin hues

  /* Influences — point fields, the same slot in the rule the centre pull
     occupies. The centre is the leash that makes the system bounded (repulsion
     is capped, the centre term grows with distance), so these are additions to
     it rather than replacements. */
  attractorOn: false,
  attractorPull: 0.012,   // fraction of the gap per step, like the centre
  attractorSpeed: 1.0,    // how fast it travels its path
  predatorOn: false,
  predatorPush: 7.0,      // px/step at point blank, on an 800px floor
  predatorRadius: 0.22,   // fraction of the floor it reaches
  predatorSpeed: 2.4,     // px/step
  predatorHunts: true,    // stalk clusters (prowl → windup → lunge), else orbit
  agentStyle: "hidden",   // hidden | glow | comet | void — how the agents appear
  links: false,
  floor: false,
  paused: false,
};

const PRESETS = {
  "tweet":  { model:"fixed", friendFixed:4.00, enemyFixed:1.50, centerPull:0.005, rechoosePerSec:2,  n:400, stepsPerFrame:1 },
  "orbits": { model:"fixed", friendFixed:4.00, enemyFixed:2.60, centerPull:0.005, rechoosePerSec:2,  n:500, stepsPerFrame:1 },
  "swarm":  { model:"fixed", friendFixed:2.50, enemyFixed:1.90, centerPull:0.005, rechoosePerSec:25, n:800, stepsPerFrame:1 },
  "knot":   { model:"fixed", friendFixed:1.30, enemyFixed:0.90, centerPull:0.005, rechoosePerSec:0,  n:600, stepsPerFrame:1 },
  "linear": { model:"prop",  friendProp:0.030, enemyProp:0.010, centerPull:0.005, rechoosePerSec:2,  n:400, stepsPerFrame:1 },
};

/* ---------------------------------------------------------------------------
   LOOKS

   Colour in V1 was hue = index/n, which encoded nothing — index has no relation
   to anything in the system, so it was a uniform smear of noise. Every look here
   either drops colour entirely or spends it on something real: how fast a dot is
   moving, or which basin of the friend graph it drains into.

   Each look gets (t, cyc, basin) where t is normalised speed 0..1, cyc is 1 if
   the dot sits on a cycle, and basin is its component id.
--------------------------------------------------------------------------- */

/* Basin colour is a hue angle rather than a fixed swatch, which is what lets
   it be both eased and drifted. Ordered so the FIRST entries contrast hardest,
   not so the wheel runs in order — a random functional graph usually yields
   only 2–3 basins, and hue-wheel order handed those to red-orange and amber,
   which read as one colour. Cyan/amber/violet separate at a glance. */
const BASIN_HUES = [187, 38, 279, 105, 5, 222, 330, 55];

/* Every colour/width function takes a final argument u ∈ [-1, 1]: the dot's
   disturbance. +1 = overwhelmed by the predator, -1 = settled on the attractor,
   0 = untouched — and u = 0 is the exact identity, so with no agents on nothing
   changes. Each look decides what disturbance MEANS in its own vocabulary,
   because hue is already spoken for in `basins` (same colour = shared destiny)
   and doesn't exist in the monochromes:
     graphite/noir — ink pressure: hot presses harder, settled lightens
     phosphor      — hot flares through pink to white, cold sinks into blue
     ember         — hot burns white, cold banks down to deep red
     basins        — hue NEVER changes; hot blows out toward white (desaturate,
                     lighten), cold deepens. Shock without lying about identity.
   `glow` = [predator tint, attractor tint] for the diagnostic overlay. */
const LOOKS = {
  graphite: {
    label: "graphite", swatch: "#e9e5dc", bg: "#f4f1ea", blend: "multiply", fade: 6,
    note: "Ink on paper. Multiply blending, so overlapping strokes darken the way ink pools.",
    link: ["rgba(30,26,22,.16)", "rgba(30,26,22,.09)"], floor: "rgba(30,26,22,.14)",
    glow: ["120,70,50", "60,95,135"], corona: "90,60,140",
    color: (t, cyc, _, u) => {
      let a = 0.07 + 0.34*t + (cyc ? 0.16 : 0);
      a *= u > 0 ? 1 + 1.1*u : 1 + 0.45*u;
      return "rgba(26,23,20," + Math.min(a, 1).toFixed(3) + ")";
    },
    width: (t, cyc, u) => (0.45 + 1.5*t + (cyc ? 0.5 : 0)) * (1 + 0.35 * Math.max(u, 0)),
  },
  noir: {
    label: "noir", swatch: "#ffffff", bg: "#000000", blend: "lighter", fade: 7,
    note: "Pure white on pure black, additive. Where strokes cross, light accumulates.",
    link: ["rgba(255,255,255,.10)", "rgba(255,255,255,.06)"], floor: "rgba(255,255,255,.13)",
    glow: ["255,120,90", "110,200,255"], corona: "185,130,255",
    color: (t, cyc, _, u) => {
      let a = 0.06 + 0.34*t + (cyc ? 0.16 : 0);
      a *= u > 0 ? 1 + 1.1*u : 1 + 0.45*u;
      return "rgba(255,255,255," + Math.min(a, 1).toFixed(3) + ")";
    },
    width: (t, cyc, u) => (0.4 + 1.4*t + (cyc ? 0.5 : 0)) * (1 + 0.35 * Math.max(u, 0)),
  },
  phosphor: {
    label: "phosphor", swatch: "#4fd0e0", bg: "#04070b", blend: "lighter", fade: 8,
    note: "Oscilloscope. Fast dots run hot toward white; slow ones sink into deep cyan.",
    link: ["rgba(120,210,240,.13)", "rgba(240,120,120,.09)"], floor: "rgba(150,220,240,.12)",
    glow: ["255,120,90", "110,200,255"], corona: "185,130,255",
    color: (t, cyc, _, u) => {
      let r = 50 + 205*t*t, g = 170 + 85*t, a = 0.09 + 0.36*t + (cyc ? 0.14 : 0);
      if (u > 0) { r += (255 - r) * u; g -= 45 * u; a *= 1 + 0.5*u; }
      else if (u < 0) { r *= 1 + 0.6*u; a *= 1 + 0.3*u; }
      return "rgba(" + Math.round(r) + "," + Math.round(g) + ",255," + Math.min(a, 1).toFixed(3) + ")";
    },
    width: (t, cyc, u) => (0.4 + 1.5*t + (cyc ? 0.55 : 0)) * (1 + 0.35 * Math.max(u, 0)),
  },
  ember: {
    label: "ember", swatch: "#ffb03a", bg: "#0a0603", blend: "lighter", fade: 9,
    note: "Same idea, warm. Amber core burning to pale yellow at speed.",
    link: ["rgba(255,190,110,.12)", "rgba(255,110,90,.09)"], floor: "rgba(255,200,140,.12)",
    glow: ["255,140,90", "120,190,255"], corona: "200,130,255",
    color: (t, cyc, _, u) => {
      let g = 120 + 125*t, b = 30 + 165*t*t, a = 0.09 + 0.36*t + (cyc ? 0.14 : 0);
      if (u > 0) { g += (255 - g) * 0.85*u; b += (255 - b) * 0.85*u; a *= 1 + 0.5*u; }
      else if (u < 0) { g *= 1 + 0.5*u; b *= 1 + 0.5*u; a *= 1 + 0.25*u; }
      return "rgba(255," + Math.round(g) + "," + Math.round(b) + "," + Math.min(a, 1).toFixed(3) + ")";
    },
    width: (t, cyc, u) => (0.4 + 1.5*t + (cyc ? 0.55 : 0)) * (1 + 0.35 * Math.max(u, 0)),
  },
  basins: {
    label: "basins", swatch: "#c07af0", bg: "#06070c", blend: "lighter", fade: 11,
    usesBasin: true,
    note: "The one look where colour earns its place: hue = which friend-graph cycle a dot " +
          "eventually drains into. Same colour means shared destiny.",
    link: ["rgba(255,255,255,.09)", "rgba(255,120,120,.07)"], floor: "rgba(255,255,255,.11)",
    glow: ["255,120,90", "110,200,255"], corona: "185,130,255",
    // third argument is a hue angle here, not a palette index
    color: (t, cyc, hue, u) => {
      let s = 85, l = 48 + 22*t, a = 0.10 + 0.34*t + (cyc ? 0.16 : 0);
      if (u > 0) { s -= 60*u; l += (90 - l) * u; a *= 1 + 0.4*u; }
      else if (u < 0) { s = Math.min(95, s - 12*u); l *= 1 + 0.3*u; a *= 1 + 0.2*u; }
      return "hsla(" + hue.toFixed(0) + "," + s.toFixed(0) + "%," + l.toFixed(0)
           + "%," + Math.min(a, 1).toFixed(3) + ")";
    },
    width: (t, cyc, u) => (0.45 + 1.4*t + (cyc ? 0.55 : 0)) * (1 + 0.35 * Math.max(u, 0)),
  },
};

const LOOK_KEYS = Object.keys(LOOKS);
const hexToRgb = (h) => { const v = parseInt(h.slice(1), 16); return [v>>16 & 255, v>>8 & 255, v & 255]; };
for (const k of LOOK_KEYS) LOOKS[k].bgRGB = hexToRgb(LOOKS[k].bg);

// ---- state -----------------------------------------------------------------
const HIST = 130;                          // ring capacity for ribbon history
let hx, hy, hs, hHead = 0, hFilled = 0;    // [slot][dot] layout, stride = P.n
let x, y, px, py, rx, ry, sx, sy, friend, enemy;   // rx/ry = last draw, sx/sy = last speed sample
let basin, onCycle, basinRep, basinSlot, basinCount = 0, graphDirty = true;
let dst = null;                            // per-dot disturbance, -1 cold … +1 hot
let dotHue = null, hueOffset = 0;          // per-dot eased hue, and global drift
const HUE_EASE = 0.035;                    // per step — a change lands in ~1s at 60fps
let W = 0, H = 0, cx = 0, cy = 0, maxR = 0, dpr = 1;
let atX = 0, atY = 0, atPhase = 0;         // attractor
let prX = 0, prY = 0, prPhase = 0;         // predator

/* The hunt is a state machine, not a steering law. The old hunt steered at the
   soft centroid of ALL dots — and with the attractor on, that centroid IS the
   attractor's pile, which is why the two agents glued together. Now the
   predator commits to one cluster at a time, approaches it with variable speed
   and wander, coils, lunges past where it was, and recovers before choosing
   another — biased away from the attractor when one is on. */
const PRED = { state: "prowl", tx: 0, ty: 0, timer: 0, phase: 0, refresh: 0, calm: 0,
               vx: 0, vy: 0, lockAng: 0 };
const LUNGE_MULT = 4.5, WINDUP_STEPS = 14, LUNGE_STEPS = 22, RECOVER_STEPS = 50;

/* Agent path history, for the comet style. One ring each, far smaller than the
   dots' buffer. */
const AH = 110;
const pTrail = { x: new Float32Array(AH), y: new Float32Array(AH), head: 0, filled: 0 };
const aTrail = { x: new Float32Array(AH), y: new Float32Array(AH), head: 0, filled: 0 };

function pushAgentTrail(tr, X, Y) {
  tr.x[tr.head] = X; tr.y[tr.head] = Y;
  tr.head = (tr.head + 1) % AH;
  if (tr.filled < AH) tr.filled++;
}
function resetAgentTrails() {
  pTrail.head = 0; pTrail.filled = 0;
  aTrail.head = 0; aTrail.filled = 0;
}
let speedRef = 1;                          // adaptive normaliser for "fast"

const cv = document.getElementById("c");
const ctx = cv.getContext("2d", { alpha: false });

const rnd = (a, b) => a + Math.random() * (b - a);
const randInt = (m) => (Math.random() * m) | 0;
const look = () => LOOKS[P.look];

function resize() {
  const hadFloor = maxR > 0;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth || 1; H = cv.clientHeight || 1;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = W / 2; cy = H / 2;
  maxR = Math.min(W, H) * 0.75;
  wipe();
  if (atX === 0 && atY === 0) {            // first real layout — place the agents
    atX = cx + Math.min(W, H) * 0.28; atY = cy;
    prX = cx - Math.min(W, H) * 0.25; prY = cy;
  }
  // Booting into a zero-size canvas (hidden tab, collapsed pane) clamps every
  // dot onto one point. Give them a floor to spread out on.
  if (!hadFloor && maxR > 1 && x) scatter();
}

/* Move the point fields. Runs per step, like everything else derived from
   simulation time, so slowing the sim slows them with it. */
function updateAgents() {
  const unit = Math.min(W, H) / 800;

  if (P.attractorOn) {
    atPhase += P.attractorSpeed * 0.006;
    const R = Math.min(W, H) * 0.28;
    atX = cx + Math.cos(atPhase) * R;
    atY = cy + Math.sin(atPhase * 1.37) * R * 0.72;   // open path, not a circle
  }

  if (P.predatorOn) {
    const base = P.predatorSpeed * unit;

    if (P.predatorHunts) {
      PRED.phase += 0.013;

      // Keep the aim on the committed cluster as it drifts; if it has
      // evaporated (fled, been eaten through), pick another. O(n), every 12
      // steps — strictly cheaper than the old every-step global centroid.
      if (PRED.state !== "lunge" && --PRED.refresh <= 0) {
        PRED.refresh = 12;
        if (!refineTarget()) retarget();
      }

      const dx = PRED.tx - prX, dy = PRED.ty - prY, d = Math.hypot(dx, dy) || 1e-6;
      const lungeRange = Math.min(W, H) * (P.predatorRadius * 0.7 + 0.04);
      let sp = 0, ang = Math.atan2(dy, dx);

      switch (PRED.state) {
        case "prowl":
          // variable pace + lateral wander: a route, not a beeline. The calm
          // counter is a minimum stalking time — without it the whole cycle
          // collapsed into windup/lunge/recover and it lunged every 1.6s.
          sp = Math.min(base * (0.35 + 0.3 * (1 + Math.sin(PRED.phase * 1.7))), d);
          ang += 0.6 * Math.sin(PRED.phase * 2.3);
          if (--PRED.calm <= 0 && d < lungeRange) { PRED.state = "windup"; PRED.timer = WINDUP_STEPS; }
          break;
        case "windup":                      // the coil — nearly still
          sp = Math.min(base * 0.12, d);
          if (--PRED.timer <= 0) {
            PRED.state = "lunge"; PRED.timer = LUNGE_STEPS;
            PRED.lockAng = ang;             // commit: no re-aiming mid-flight
          }
          break;
        case "lunge":                       // straight through where they were
          sp = base * LUNGE_MULT;
          ang = PRED.lockAng;               // locked heading also kills the
                                            // atan2 flip when passing the mark
          if (--PRED.timer <= 0) { PRED.state = "recover"; PRED.timer = RECOVER_STEPS; }
          break;
        case "recover":                     // spent — drift, then choose anew
          sp = base * 0.4;
          ang += 0.9 * Math.sin(PRED.phase * 1.1);
          if (--PRED.timer <= 0) retarget();
          break;
      }
      // Velocity is eased, not set: the lunge was a 0.12× → 4.5× step change,
      // which read as a jerk. ~4 steps to 90% keeps it explosive but embodied.
      PRED.vx += (sp * Math.cos(ang) - PRED.vx) * 0.4;
      PRED.vy += (sp * Math.sin(ang) - PRED.vy) * 0.4;
      prX += PRED.vx;
      prY += PRED.vy;
    } else {
      prPhase += 0.004;
      const R2 = Math.min(W, H) * 0.30;
      const tx = cx + Math.cos(-prPhase) * R2;
      const ty = cy + Math.sin(-prPhase * 1.19) * R2 * 0.7;
      const dx = tx - prX, dy = ty - prY, d = Math.hypot(dx, dy);
      if (d > 1e-6) { prX += Math.min(base, d) * dx / d; prY += Math.min(base, d) * dy / d; }
    }

    const ox = prX - cx, oy = prY - cy, od = Math.hypot(ox, oy), lim = maxR * 0.9;
    if (od > lim) { prX = cx + ox / od * lim; prY = cy + oy / od * lim; }
  }

  if (P.attractorOn) pushAgentTrail(aTrail, atX, atY);
  if (P.predatorOn) pushAgentTrail(pTrail, prX, prY);
}

/* Pick a cluster to stalk: bin the dots into a coarse grid, then choose among
   the dense cells — weighted by population and, when the attractor is on, by
   distance from it, so the predator often hunts elsewhere. That bias is what
   decouples the two agents. */
const GX = 14, GY = 10;
let gridCounts = new Int32Array(GX * GY);

function retarget() {
  const n = P.n;
  gridCounts.fill(0);
  for (let i = 0; i < n; i++) {
    let gx = (x[i] / W * GX) | 0, gy = (y[i] / H * GY) | 0;
    if (gx < 0) gx = 0; if (gx >= GX) gx = GX - 1;
    if (gy < 0) gy = 0; if (gy >= GY) gy = GY - 1;
    gridCounts[gy * GX + gx]++;
  }
  let max = 0;
  for (let c = 0; c < GX * GY; c++) if (gridCounts[c] > max) max = gridCounts[c];
  if (max === 0) { PRED.tx = cx; PRED.ty = cy; PRED.state = "prowl"; return; }

  const diag = Math.hypot(W, H);
  let total = 0; const cand = [];
  for (let c = 0; c < GX * GY; c++) {
    if (gridCounts[c] < max * 0.35) continue;
    const gcx = ((c % GX) + 0.5) * W / GX, gcy = (((c / GX) | 0) + 0.5) * H / GY;
    let wgt = gridCounts[c];
    // Squared distance bias: with the attractor on it owns most of the mass,
    // so a mild bias still handed the predator the same pile every time.
    if (P.attractorOn) { const b = 0.15 + 0.85 * Math.hypot(gcx - atX, gcy - atY) / diag; wgt *= b * b; }
    cand.push([gcx, gcy, wgt]); total += wgt;
  }
  let pick = Math.random() * total;
  for (const [gcx, gcy, wgt] of cand) {
    pick -= wgt;
    if (pick <= 0) { PRED.tx = gcx; PRED.ty = gcy; break; }
  }
  PRED.state = "prowl"; PRED.refresh = 12;
  PRED.calm = 80 + (Math.random() * 140) | 0;      // stalk before striking
}

/* Track the committed cluster as it drifts: re-centre the aim on the dots near
   it. Returns false when the cluster has dissolved. */
function refineTarget() {
  const reach = Math.min(W, H) * 0.16;
  let sX = 0, sY = 0, m = 0;
  for (let i = 0; i < P.n; i++) {
    if (Math.abs(x[i] - PRED.tx) < reach && Math.abs(y[i] - PRED.ty) < reach) {
      sX += x[i]; sY += y[i]; m++;
    }
  }
  if (m < 5) return false;
  PRED.tx = sX / m; PRED.ty = sY / m;
  return true;
}

function wipe() {
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = look().bg;
  ctx.fillRect(0, 0, W, H);
  document.body.style.background = look().bg;
}

// ---- ties ------------------------------------------------------------------
// Never itself, never the same dot for both — a dot chasing and fleeing the
// same target just cancels out.
function assign(i) {
  const n = P.n;
  if (n < 3) { friend[i] = i; enemy[i] = i; graphDirty = true; return; }
  let f = randInt(n); while (f === i) f = randInt(n);
  let e = randInt(n); while (e === i || e === f) e = randInt(n);
  friend[i] = f; enemy[i] = e; graphDirty = true;
}

/* Each dot points at exactly one friend, so the friend graph is a random
   *functional graph*: follow the chase far enough and you always fall into a
   cycle. This walks it in O(n) and labels every dot with the cycle it drains
   into, plus whether it sits on that cycle. Those cycles are the skeleton the
   whole picture is organised around. */
function analyseGraph() {
  const n = P.n;
  const state = new Uint8Array(n);      // 0 unseen, 1 on current path, 2 resolved
  const order = new Int32Array(n);
  const path = new Int32Array(n);
  basin = new Int32Array(n).fill(-1);
  onCycle = new Uint8Array(n);
  basinRep = new Int32Array(n);
  basinSlot = new Int32Array(n);
  let nb = 0;

  for (let s = 0; s < n; s++) {
    if (state[s]) continue;
    let len = 0, v = s;
    while (state[v] === 0) { state[v] = 1; order[v] = len; path[len++] = v; v = friend[v]; }
    if (state[v] === 1) {                // closed a new cycle inside this path
      const id = nb++;
      let rep = n;
      for (let k = order[v]; k < len; k++) {
        const u = path[k];
        basin[u] = id; onCycle[u] = 1;
        if (u < rep) rep = u;
      }
      basinRep[id] = rep;                // smallest node ON the cycle
    }
    const id = basin[v];                 // the tail drains into whatever v belongs to
    for (let k = 0; k < len; k++) {
      const u = path[k];
      state[u] = 2;
      if (basin[u] < 0) basin[u] = id;
    }
  }
  /* Basin *ids* come from scan order, so they renumber wholesale whenever the
     graph changes — which made colours swap abruptly on a re-roll even when the
     partition barely moved, and especially when a cluster split in two. Rank
     basins instead by the smallest node on their cycle: that's a property of
     the cycle itself, not of how it was found, so the giant basin keeps its
     colour while ties churn. Distinct basins still always get distinct hues. */
  const ids = [];
  for (let i = 0; i < nb; i++) ids.push(i);
  ids.sort((a, b) => basinRep[a] - basinRep[b]);
  for (let r = 0; r < ids.length; r++) basinSlot[ids[r]] = r % BASIN_HUES.length;

  basinCount = nb;
  graphDirty = false;
}

// Absolute target hue for a dot: its basin's slot, plus the global drift.
function targetHue(i) {
  return (BASIN_HUES[basinSlot[basin[i]]] + hueOffset) % 360;
}

function scatter() {
  const r0 = Math.min(W, H) * 0.35;
  for (let i = 0; i < P.n; i++) {
    const a = rnd(0, Math.PI * 2), r = r0 * Math.sqrt(Math.random());
    x[i] = cx + Math.cos(a) * r;
    y[i] = cy + Math.sin(a) * r;
  }
  rx.set(x); ry.set(y);
  sx.set(x); sy.set(y);
  spd.fill(0);
  resetHistory();
}

// Ribbons keep real geometry instead of a smeared image, so the history has to
// be dropped whenever positions jump — otherwise the next frame draws a stripe
// across the floor from the old location to the new one.
// Newest sample lives at hHead-1, so seeding slot 0 means hHead must be 1 —
// otherwise the first frames read an unwritten slot and streak from (0,0).
function resetHistory() {
  if (!hx) return;
  for (let i = 0; i < P.n; i++) { hx[i] = x[i]; hy[i] = y[i]; hs[i] = 0; }
  hHead = 1; hFilled = 1;
}

function pushHistory() {
  const n = P.n, base = hHead * n;
  // Speed rides along with the position: each vertex remembers how fast the
  // dot was when it was laid down, so a ribbon can be shaded by its own past
  // rather than by whatever the dot happens to be doing right now.
  for (let i = 0; i < n; i++) { hx[base + i] = x[i]; hy[base + i] = y[i]; hs[base + i] = spd[i]; }
  hHead = (hHead + 1) % HIST;
  if (hFilled < HIST) hFilled++;
}

/* Sampled once per *step*, never per frame.
   These are only meaningful when the dots actually moved. Measuring them every
   frame meant that at fractional step rates — where most frames run no step —
   every dot read as motionless, the whole field dropped to minimum brightness,
   and then flared on the frame a step landed. That was the strobe, and its
   amplitude scaled with Speed → brightness exactly as you'd expect from
   t = 1 - resp + resp*t_raw. */
function sampleSpeeds() {
  const n = P.n;
  if (spd.length !== n) spd = new Float64Array(n);

  /* Disturbance: one signed axis, +1 hot (predator) to -1 cold (attractor),
     expressed per look by the colour functions. Measured before designing
     this: the density at the predator's rim is ~500x the far field, but the
     dots pinned there have near-zero radial velocity (cos 0.03 vs -0.30 for
     the returning wake) — they are held, not fleeing. So PROXIMITY carries the
     heat, radial velocity only modulates it, and an asymmetric ease (fast
     attack, slow decay) leaves lingering warmth on dots the predator has
     passed: the wake draws itself. */
  const prOn = P.predatorOn, atOn = P.attractorOn;
  const rr = Math.min(W, H) * P.predatorRadius * 1.35;   // felt slightly beyond the push
  const rA = Math.min(W, H) * 0.14;                      // the attractor's cold zone

  let sum = 0;
  for (let i = 0; i < n; i++) {
    const vx = x[i] - sx[i], vy = y[i] - sy[i];
    const s = Math.hypot(vx, vy);
    spd[i] = s; sum += s;

    let tgt = 0;
    if (prOn) {
      const dx = x[i] - prX, dy = y[i] - prY, d = Math.hypot(dx, dy);
      if (d < rr && d > 1e-6) {
        // Quadratic falloff, not linear: the shock front sits at ~0.75 of the
        // felt radius, and linear w gave those dots — the most dramatic ones —
        // the least heat. This holds warmth through the middle, still 0 at rr.
        const q = d / rr, w = 1 - q * q;
        const cos = s > 1e-6 ? (vx * dx / d + vy * dy / d) / s : 0;
        tgt += w * (0.75 + 0.25 * cos);
      }
    }
    if (atOn) {
      const dA = Math.hypot(x[i] - atX, y[i] - atY);
      if (dA < rA) tgt -= 1 - dA / rA;
    }
    if (tgt > 1) tgt = 1; else if (tgt < -1) tgt = -1;
    const cur = dst[i];
    dst[i] = cur + (tgt - cur) * (Math.abs(tgt) > Math.abs(cur) ? 0.5 : 0.035);
  }
  sx.set(x); sy.set(y);
  // Normalise against the mean, not the max. The max is a single dot, so
  // letting it set the scale modulated the brightness of the entire field
  // every time that one dot changed — half of the "lightning".
  const target = Math.max((sum / n) * 2.2, 0.35);
  speedRef += (target - speedRef) * 0.05;
}

/* Ease each dot's hue toward its basin's, the short way round the wheel, and
   advance the global drift. Called once per frame but compounded for the k
   steps that actually ran, so easing and drift stay tied to simulation time
   rather than to frame rate. */
function updateHues(k) {
  const n = P.n;
  if (!dotHue || dotHue.length !== n) return;
  hueOffset = (hueOffset + P.hueDrift * k) % 360;
  const ease = 1 - Math.pow(1 - HUE_EASE, k);
  for (let i = 0; i < n; i++) {
    let d = targetHue(i) - dotHue[i];
    if (d > 180) d -= 360; else if (d < -180) d += 360;
    let h = dotHue[i] + d * ease;
    if (h < 0) h += 360; else if (h >= 360) h -= 360;
    dotHue[i] = h;
  }
}

function seedHues() {
  const n = P.n;
  dotHue = new Float32Array(n);
  for (let i = 0; i < n; i++) dotHue[i] = targetHue(i);   // start settled, don't fade in
}

function rebuild() {
  const n = P.n;
  x = new Float64Array(n); y = new Float64Array(n);
  px = new Float64Array(n); py = new Float64Array(n);
  rx = new Float64Array(n); ry = new Float64Array(n);
  sx = new Float64Array(n); sy = new Float64Array(n);
  spd = new Float64Array(n); dst = new Float64Array(n);
  hx = new Float32Array(HIST * n); hy = new Float32Array(HIST * n);
  hs = new Float32Array(HIST * n);
  friend = new Int32Array(n); enemy = new Int32Array(n);
  scatter();
  for (let i = 0; i < n; i++) assign(i);
  analyseGraph();
  seedHues();
  PRED.state = "prowl"; PRED.refresh = 0; PRED.tx = cx; PRED.ty = cy;
  PRED.vx = 0; PRED.vy = 0;
  resetAgentTrails();
}

// ---- the simulation (unchanged from V1) ------------------------------------
let rechooseAcc = 0;

function step() {
  const n = P.n;

  rechooseAcc += P.rechoosePerSec / 60;
  while (rechooseAcc >= 1) { rechooseAcc -= 1; assign(randInt(n)); }

  updateAgents();

  // Snapshot: every dot reacts to where everyone was, not to half-updated
  // neighbours. "At each step EVERY dot moves" — simultaneous, not sequential.
  px.set(x); py.set(y);

  const fixed = P.model === "fixed";
  // Fixed strides are px but the centre pull is a fraction of distance, so the
  // equilibrium radius is ~stride/pull — which would shrink to a speck on a big
  // monitor. Scale the stride with the floor. Slider values are px at 800px tall.
  const unit = Math.min(W, H) / 800;
  const kFf = P.friendFixed * unit, kEf = P.enemyFixed * unit;
  const kFp = P.friendProp, kEp = P.enemyProp;
  const cp = P.centerPull;

  const atOn = P.attractorOn, atK = P.attractorPull;
  const prOn = P.predatorOn;
  const prR = Math.min(W, H) * P.predatorRadius, prR2 = prR * prR;
  const prK = P.predatorPush * unit;

  for (let i = 0; i < n; i++) {
    const xi = px[i], yi = py[i];
    let X = xi, Y = yi;

    X += cp * (cx - xi);                                   // 1. toward the centre
    Y += cp * (cy - yi);

    const fdx = px[friend[i]] - xi, fdy = py[friend[i]] - yi;  // 2. toward the friend
    const edx = xi - px[enemy[i]],  edy = yi - py[enemy[i]];   // 3. away from the enemy

    if (fixed) {
      const fd = Math.hypot(fdx, fdy);
      if (fd > 1e-9) { X += kFf * fdx / fd; Y += kFf * fdy / fd; }
      const ed = Math.hypot(edx, edy);
      if (ed > 1e-9) { X += kEf * edx / ed; Y += kEf * edy / ed; }
    } else {
      X += kFp * fdx; Y += kFp * fdy;
      X += kEp * edx; Y += kEp * edy;
    }

    // 4. point fields — same slot in the rule as the centre pull
    if (atOn) { X += atK * (atX - xi); Y += atK * (atY - yi); }
    if (prOn) {
      const rdx = xi - prX, rdy = yi - prY, r2 = rdx * rdx + rdy * rdy;
      if (r2 < prR2 && r2 > 1e-12) {
        // Linear falloff to zero at the radius: capped, so the centre pull
        // still wins far out and the system stays bounded.
        const rd = Math.sqrt(r2), f = prK * (1 - rd / prR);
        X += f * rdx / rd; Y += f * rdy / rd;
      }
    }

    const dx = X - cx, dy = Y - cy, d = Math.hypot(dx, dy);
    if (d > maxR) { X = cx + dx / d * maxR; Y = cy + dy / d * maxR; }

    x[i] = X; y[i] = Y;
  }
}

// ---- rendering -------------------------------------------------------------
let spd = new Float64Array(0);

function draw() {
  const L = look();
  const n = P.n;
  if (graphDirty) analyseGraph();
  if (spd.length !== n) spd = new Float64Array(n);

  ctx.globalCompositeOperation = "source-over";
  if (P.trail === "ribbons") {
    // Full clear. Ribbons carry their own history as geometry, so nothing has
    // to survive in the framebuffer — and nothing can accumulate in it either.
    ctx.fillStyle = L.bg;
    ctx.fillRect(0, 0, W, H);
  } else if (P.fade > 0) {
    // Bloom: veil instead of clearing, so old frames decay in place.
    //
    // Careful — this can never actually reach the background. The veil is
    // multiplicative (V -= (V-bg)*a) and the canvas is 8-bit, so as soon as
    // (V-bg)*a < 0.5 the decrement rounds to zero and the pixel is frozen for
    // good. Measured: at a=0.09, ~27% of the canvas sticks 5 levels above the
    // background and never moves again, no matter how long you wait. That
    // fossilised web of every path ever taken is what makes long bloom trails
    // read as an undifferentiated haze. Short trails hide it (at a=0.70 the
    // floor is under one level); ribbons avoid it entirely.
    const b = L.bgRGB;
    ctx.fillStyle = "rgba(" + b[0] + "," + b[1] + "," + b[2] + "," + (P.fade / 100) + ")";
    ctx.fillRect(0, 0, W, H);
  }

  if (P.floor) {
    ctx.strokeStyle = L.floor; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, maxR, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI * 2); ctx.fillStyle = L.floor; ctx.fill();
  }

  // "hidden" is the purist setting — the agents exist only as what they do to
  // the dots. The others give them a body, each in the piece's own vocabulary.
  if (P.agentStyle !== "hidden") drawAgents(L);

  if (P.links) {
    ctx.lineWidth = 0.6;
    ctx.strokeStyle = L.link[0];
    ctx.beginPath();
    for (let i = 0; i < n; i++) { ctx.moveTo(x[i], y[i]); ctx.lineTo(x[friend[i]], y[friend[i]]); }
    ctx.stroke();
    ctx.strokeStyle = L.link[1];
    ctx.beginPath();
    for (let i = 0; i < n; i++) { ctx.moveTo(x[i], y[i]); ctx.lineTo(x[enemy[i]], y[enemy[i]]); }
    ctx.stroke();
  }

  // Speeds come from sampleSpeeds(), which runs per step rather than per frame.
  // Draw. Speed drives brightness and weight, so motion is the signal.
  ctx.globalCompositeOperation = L.blend;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  if (P.trail === "ribbons") drawRibbons(L, n);
  else drawStreaks(L, n);

  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";
  rx.set(x); ry.set(y);
}

function drawAgents(L) {
  if (P.agentStyle === "glow") {
    // Soft radial fields in the look's own light. Sprite-cached — building the
    // gradient fresh every frame cost ~30 ms at full screen.
    ctx.globalCompositeOperation = L.blend;
    if (P.predatorOn) {
      const r = Math.min(W, H) * P.predatorRadius;
      ctx.drawImage(glowSprite(L.glow[0]), prX - r, prY - r, r * 2, r * 2);
    }
    if (P.attractorOn) {
      const r = Math.min(W, H) * 0.14;
      ctx.drawImage(glowSprite(L.glow[1]), atX - r, atY - r, r * 2, r * 2);
    }
    ctx.globalCompositeOperation = "source-over";

  } else if (P.agentStyle === "comet") {
    // The agents inhabit the same vocabulary as the dots: their own ribbon.
    // A lunge stretches the predator's comet into a dash by itself.
    ctx.globalCompositeOperation = L.blend;
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    if (P.attractorOn) drawComet(aTrail, L.glow[1], 5.0, 0.30);
    if (P.predatorOn) drawComet(pTrail, L.glow[0], 2.6, 0.55);
    ctx.globalCompositeOperation = "source-over";

  } else if (P.agentStyle === "void") {
    // The predator is an absence with a corona — the dark core occludes
    // whatever light it crosses, but over empty black it's nothing, so a thin
    // violet ring gives the black hole an event horizon you can see anywhere.
    // The attractor is a pinprick star.
    if (P.predatorOn) {
      const r = Math.min(W, H) * P.predatorRadius * 0.55;
      ctx.drawImage(voidSprite(L.bgRGB.join(",")), prX - r, prY - r, r * 2, r * 2);
      ctx.globalCompositeOperation = L.blend;
      const rc = r * 1.12;
      ctx.drawImage(coronaSprite(L.corona), prX - rc, prY - rc, rc * 2, rc * 2);
      ctx.globalCompositeOperation = "source-over";
    }
    if (P.attractorOn) {
      ctx.globalCompositeOperation = L.blend;
      const r = 14;
      ctx.drawImage(glowSprite(L.glow[1]), atX - r, atY - r, r * 2, r * 2);
      ctx.beginPath(); ctx.arc(atX, atY, 1.6, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(" + L.glow[1] + ",0.9)"; ctx.fill();
      ctx.globalCompositeOperation = "source-over";
    }
  }
}

function drawComet(tr, tint, wBase, peak) {
  const m = tr.filled;
  if (m < 2) return;
  const NB = 3;
  for (let b = 0; b < NB; b++) {
    const a0 = (b * m / NB) | 0, a1 = Math.min((((b + 1) * m / NB) | 0), m - 1);
    if (a1 <= a0) continue;
    const fresh = 1 - (b + 0.5) / NB;              // 1 = the head
    ctx.globalAlpha = 0.04 + peak * fresh * fresh;
    ctx.strokeStyle = "rgba(" + tint + ",1)";
    ctx.lineWidth = wBase * (0.25 + 0.75 * fresh);
    ctx.beginPath();
    for (let a = a1; a >= a0; a--) {               // oldest → newest
      const idx = (tr.head - 1 - a + AH + AH) % AH;
      if (a === a1) ctx.moveTo(tr.x[idx], tr.y[idx]);
      else ctx.lineTo(tr.x[idx], tr.y[idx]);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

/* A thin luminous band just outside the core — transparent centre so the
   absence stays absent, peak at ~0.72 of the radius, gone by the edge. */
const coronaCache = {};
function coronaSprite(tint) {
  let sp = coronaCache[tint];
  if (!sp) {
    sp = document.createElement("canvas"); sp.width = sp.height = 128;
    const g2 = sp.getContext("2d");
    const gr = g2.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, "rgba(" + tint + ",0)");
    gr.addColorStop(0.60, "rgba(" + tint + ",0)");
    gr.addColorStop(0.72, "rgba(" + tint + ",0.55)");
    gr.addColorStop(0.84, "rgba(" + tint + ",0.18)");
    gr.addColorStop(1, "rgba(" + tint + ",0)");
    g2.fillStyle = gr; g2.fillRect(0, 0, 128, 128);
    coronaCache[tint] = sp;
  }
  return sp;
}

const voidCache = {};
function voidSprite(bgTint) {
  let sp = voidCache[bgTint];
  if (!sp) {
    sp = document.createElement("canvas"); sp.width = sp.height = 128;
    const g2 = sp.getContext("2d");
    const gr = g2.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, "rgba(" + bgTint + ",0.92)");
    gr.addColorStop(0.55, "rgba(" + bgTint + ",0.5)");
    gr.addColorStop(1, "rgba(" + bgTint + ",0)");
    g2.fillStyle = gr; g2.fillRect(0, 0, 128, 128);
    voidCache[bgTint] = sp;
  }
  return sp;
}

const glowCache = {};
function glowSprite(tint) {
  let sp = glowCache[tint];
  if (!sp) {
    sp = document.createElement("canvas"); sp.width = sp.height = 128;
    const g2 = sp.getContext("2d");
    const gr = g2.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, "rgba(" + tint + ",0.22)");
    gr.addColorStop(0.55, "rgba(" + tint + ",0.08)");
    gr.addColorStop(1, "rgba(" + tint + ",0)");
    g2.fillStyle = gr; g2.fillRect(0, 0, 128, 128);
    glowCache[tint] = sp;
  }
  return sp;
}

// Bloom: one segment per dot per frame, laid onto whatever survived the veil.
function drawStreaks(L, n) {
  const resp = P.speedResponse, inv = 1 / speedRef;
  const useBasin = !!L.usesBasin;
  ctx.globalAlpha = pulseAmount();
  for (let i = 0; i < n; i++) {
    let t = spd[i] * inv; if (t > 1) t = 1;
    t = 1 - resp + resp * t;                       // 0 response = everything equal
    const cyc = (P.skeleton && onCycle[i]) ? 1 : 0;
    const hue = useBasin ? dotHue[i] : 0;
    const u = dst[i];

    ctx.strokeStyle = L.color(t, cyc, hue, u);
    ctx.lineWidth = L.width(t, cyc, u) * P.weight;

    if (P.streaks) {
      ctx.beginPath();
      ctx.moveTo(rx[i], ry[i]);
      ctx.lineTo(x[i], y[i]);
      ctx.stroke();
    } else {
      const r = L.width(t, cyc, u) * P.weight;
      ctx.fillStyle = L.color(t, cyc, hue, u);
      ctx.beginPath(); ctx.arc(x[i], y[i], r, 0, Math.PI * 2); ctx.fill();
    }
  }
}

/* Ribbons: each dot's last K positions redrawn every frame as a real polyline,
   onto a cleared canvas. Nothing accumulates, so there is no haze and no
   fossil residue — a trail is exactly K frames long and then it is gone.
   Crossing ribbons still brighten each other through the blend mode, but only
   within a single frame, so overlaps read as overlaps instead of smearing into
   a wash. Drawn in a few age bands so opacity and weight taper with age. */
const BANDS = 3;
const QT = 6;                      // speed quantisation, for batching
/* Hue quantisation (11.25°). Settled dots all share their basin's hue, so this
   normally costs nothing — only dots mid-transition spread across buckets, and
   each occupied bucket is a stroke() call. Fine enough that an easing dot still
   reads as a smooth sweep; finer than this only bought cost during churn. */
const HQ = 32;
/* Disturbance quantisation. Odd, so one bin's centre is exactly u = 0 and the
   undisturbed field stays in a single bucket at zero extra cost. */
const DQ = 7;
let keyOf = null, order = null, bkAt = null, bkCur = null;

function drawRibbons(L, n) {
  const K = Math.min(P.trailFrames | 0, hFilled - 1);
  if (K < 1) { drawStreaks(L, n); return; }

  const resp = P.speedResponse, inv = 1 / speedRef;
  const maxSeg = Math.min(W, H) * 0.3;   // a longer hop is a clamp or a respawn

  /* One stroke() per dot per band was 1500 canvas calls a frame and cost 14×
     what bloom does. Stroke overhead is per-call, not per-segment, so instead
     bucket the dots by everything that decides their appearance — quantised
     speed, on-cycle, and basin where the look uses it — and emit one path per
     bucket holding every dot in it. Same pixels, ~10× fewer calls. */
  const useBasin = !!L.usesBasin;
  const nHue = useBasin ? HQ : 1;        // bucket by eased hue, not basin id
  // Disturbance joins the bucket key. With no agents on every dot sits in the
  // neutral bin (u = 0 exactly), so occupancy — and cost — is unchanged.
  const nKeys = nHue * 2 * QT * DQ;

  if (!keyOf || keyOf.length < n) { keyOf = new Int32Array(n); order = new Int32Array(n); }
  if (!bkAt || bkAt.length < nKeys + 1) { bkAt = new Int32Array(nKeys + 1); bkCur = new Int32Array(nKeys); }

  const pulse = pulseAmount();

  for (let band = 0; band < BANDS; band++) {
    const a0 = Math.floor(band * K / BANDS), a1 = Math.floor((band + 1) * K / BANDS);
    if (a1 <= a0) continue;
    const fresh = 1 - (band + 0.5) / BANDS;        // 1 = nearest the dot
    const span = a1 - a0 + 1;

    /* Bucket by the speed the dot was travelling *during this band*, averaged
       over the band's frames — not by its speed right now. Colouring a whole
       ribbon from one instantaneous sample made every trail flash as a unit on
       frame-to-frame noise, which was the rest of the "lightning". Averaging
       over ~K/3 frames is both steadier and truer: the ribbon now shades by
       its own history, so you can read where a dot sped up. */
    // Averaging is a smoothing step, so it does not need every sample —
    // ~4 spread across the band is indistinguishable and keeps this from
    // doubling the age traversal at long trail lengths.
    const stride = span > 8 ? (span >> 2) : 1;
    bkAt.fill(0, 0, nKeys + 1);
    for (let i = 0; i < n; i++) {
      let sum = 0, cnt = 0;
      for (let a = a0; a <= a1; a += stride) {
        const slot = (hHead - 1 - a + HIST + HIST) % HIST;
        sum += hs[slot * n + i]; cnt++;
      }
      let t = (sum / cnt) * inv; if (t > 1) t = 1;
      t = 1 - resp + resp * t;
      let tq = (t * QT) | 0; if (tq >= QT) tq = QT - 1; if (tq < 0) tq = 0;
      const cyc = (P.skeleton && onCycle[i]) ? 1 : 0;
      let hq = useBasin ? (dotHue[i] * HQ / 360) | 0 : 0;
      if (hq >= HQ) hq = HQ - 1; if (hq < 0) hq = 0;
      let dq = ((dst[i] + 1) * 0.5 * DQ) | 0;
      if (dq >= DQ) dq = DQ - 1; if (dq < 0) dq = 0;
      const k = ((hq * 2 + cyc) * QT + tq) * DQ + dq;
      keyOf[i] = k;
      bkAt[k + 1]++;
    }
    for (let k = 0; k < nKeys; k++) { bkAt[k + 1] += bkAt[k]; bkCur[k] = bkAt[k]; }
    for (let i = 0; i < n; i++) order[bkCur[keyOf[i]]++] = i;

    // globalAlpha does the age ramp, so the look's own colour maths is
    // untouched and this works the same under every blend mode.
    ctx.globalAlpha = (0.12 + 0.88 * fresh * fresh) * pulse;

    for (let k = 0; k < nKeys; k++) {
      const s = bkAt[k], e = bkAt[k + 1];
      if (e <= s) continue;
      const dq = k % DQ, r1 = (k / DQ) | 0;
      const tq = r1 % QT, rest = (r1 / QT) | 0;
      const t = (tq + 0.5) / QT, cyc = rest & 1, hq = rest >> 1;
      const u = (dq + 0.5) * 2 / DQ - 1;           // bin centre; dq=3 → exactly 0

      ctx.strokeStyle = L.color(t, cyc, (hq + 0.5) * (360 / HQ), u);
      ctx.lineWidth = L.width(t, cyc, u) * P.weight * (0.35 + 0.65 * fresh);

      ctx.beginPath();
      for (let idx = s; idx < e; idx++) {
        const i = order[idx];
        let lx = 0, ly = 0, started = false;
        for (let a = a1; a >= a0; a--) {           // oldest → newest
          const slot = (hHead - 1 - a + HIST + HIST) % HIST;
          const h = slot * n + i;
          const X = hx[h], Y = hy[h];
          if (!started || Math.abs(X - lx) + Math.abs(Y - ly) > maxSeg) ctx.moveTo(X, Y);
          else ctx.lineTo(X, Y);
          lx = X; ly = Y; started = true;
        }
      }
      ctx.stroke();
    }
  }
}

// ---- loop ------------------------------------------------------------------
let lastT = performance.now(), fps = 0, stepAcc = 0, pulsePhase = 0;

/* The strobe, but on purpose. Phase advances per simulation step rather than
   per frame, so the beat stays tied to the motion instead of to the monitor —
   slow the sim and the pulse slows with it. Depth 0 leaves everything alone. */
function pulseAmount() {
  if (P.pulseDepth <= 0) return 1;
  return 1 - P.pulseDepth * 0.5 * (1 - Math.cos(pulsePhase * Math.PI * 2));
}

function frame(t) {
  const dt = t - lastT; lastT = t;
  fps += ((1000 / Math.max(dt, 1)) - fps) * 0.1;

  if (!P.paused) {
    // Fractional rate: below 1 this runs a step every 1/rate frames, which is
    // where the interesting slow-motion lives — whole steps jumped far too
    // coarsely at the bottom of the range.
    //
    // Advance by wall-clock time, not by frame. Stepping per frame couples
    // render cost into the physics: heavier strokes → more pixels → lower
    // fps → slower world ("dot size changes movement speed"). Steps are
    // defined per 60fps-frame, so the sim holds its wall-clock rate whatever
    // the renderer costs (up to the stall clamp).
    stepAcc += P.stepsPerFrame * Math.min(dt, 100) / (1000 / 60);
    let k = Math.floor(stepAcc);
    stepAcc -= k;
    if (k > 0) {
      if (k > 40) k = 40;                 // don't replay a backgrounded tab
      for (let s = 0; s < k; s++) step();
      sampleSpeeds();                     // only meaningful when dots moved
      if (graphDirty) analyseGraph();     // hues need current basins to ease toward
      updateHues(k);
      pushHistory();                      // one ribbon vertex per drawn frame
      pulsePhase += k / Math.max(P.pulsePeriod, 1);
    }
  }
  draw();

  const st = document.getElementById("stats");
  st.style.color = look().bg === "#f4f1ea" ? "rgba(30,26,22,.45)" : "rgba(255,255,255,.32)";
  st.textContent = P.n + " dots · " + basinCount + " basin" + (basinCount === 1 ? "" : "s")
    + " · " + P.stepsPerFrame.toFixed(2) + " steps/frame"
    + " · " + fps.toFixed(0) + " fps"
    + (P.predatorOn && P.predatorHunts ? " · predator: " + PRED.state : "")
    + (P.paused ? " · paused" : "");

  requestAnimationFrame(frame);
}

// The proportional model is a linear system with only two fates. Say which.
function updateRegime() {
  const el = $("regime");
  const margin = P.centerPull - 2 * P.enemyProp;
  if (Math.abs(margin) < 0.002) {
    el.textContent = "Knife edge — barely bounded. Nudge either slider and it tips into "
      + "inflating or collapsing.";
  } else if (margin < 0) {
    el.textContent = "Inflating: 2 × enemy (" + (2 * P.enemyProp * 100).toFixed(1)
      + "%) beats the centre pull (" + (P.centerPull * 100).toFixed(2)
      + "%). Everything drifts out and jams against the floor edge.";
  } else {
    el.textContent = "Collapsing: the centre pull wins, so every dot converges onto the "
      + "centre point. Structure dies out.";
  }
}

/* The centre pull is the leash: repulsion is capped, the centre term grows with
   distance. Turn it off and leave only a repeller and there is nothing holding
   the swarm in — measured, 52% of dots end up jammed on the floor edge. */
function updateLeashNote() {
  const el = $("leashnote");
  const noLeash = P.centerPull < 0.001 && P.predatorOn && !P.attractorOn;
  el.style.display = noLeash ? "" : "none";
  if (noLeash) {
    el.textContent = "Nothing is holding the swarm in. The centre pull is off and the only "
      + "field is a repeller, so the predator drives everything onto the floor edge "
      + "(measured: 52% pinned). Raise the centre pull, or switch the attractor on.";
  }
}

function syncUI() {
  for (const [id, key, fmt] of SLIDERS) {
    $(id).value = P[key];
    $("v_" + id).textContent = fmt(P[key]);
  }
  $("model").value = P.model;
  $("links").checked = P.links;
  $("floor").checked = P.floor;
  $("skeleton").checked = P.skeleton;
  $("streaks").checked = P.streaks;
  $("attractorOn").checked = P.attractorOn;
  $("predatorOn").checked = P.predatorOn;
  $("predatorHunts").checked = P.predatorHunts;
  document.querySelectorAll("#agentstyle .act").forEach((b) => {
    b.classList.toggle("on", b.dataset.style === P.agentStyle);
  });
  // dataset.needs is unique to these rows — do NOT reuse an attribute name that
  // a dynamically-created element already sets (that hid the look buttons once).
  document.querySelectorAll("[data-needs]").forEach((el) => {
    el.style.display = P[el.dataset.needs] ? "" : "none";

  $("pause").classList.toggle("on", P.paused);

  $("looknote").textContent = look().note;
  document.querySelectorAll("#looks .look").forEach((b) => {
    b.classList.toggle("on", b.dataset.look === P.look);

  document.querySelectorAll("[data-model]").forEach((el) => {
    el.style.display = (el.dataset.model === (P.model === "fixed" ? "fixed" : "prop")) ? "" : "none";
  });
  document.querySelectorAll("[data-trail]").forEach((el) => {
    el.style.display = (el.dataset.trail === P.trail) ? "" : "none";
  });
  document.querySelectorAll("[data-needslook]").forEach((el) => {

  document.querySelectorAll("#trails .act").forEach((b) => {

  $("bloomnote").textContent = P.fade > 0 && P.fade < 20

      + "above the background, so old paths fossilise into a haze. Ribbons don't."
    : "Accumulates onto the previous frame instead of redrawing history.";
  updateRegime();
  updateLeashNote();
}

    : "Frames accumulate and fade toward the background. Glowier, but long trails fossilise into haze.";
  b.addEventListener("click", () => { P.trail = key; wipe(); syncUI(); });
  trailBar.appendChild(b);
});

const presetBar = $("presets");
Object.keys(PRESETS).forEach((name) => {
  const b = document.createElement("button");
  b.className = "act"; b.textContent = name;
  b.title = PRESET_TIPS[name] || "";
  b.addEventListener("click", () => { Object.assign(P, PRESETS[name]); rebuild(); wipe(); syncUI(); });
  presetBar.appendChild(b);
});

$("model").addEventListener("change", (e) => { P.model = e.target.value; syncUI(); });
$("links").addEventListener("change", (e) => { P.links = e.target.checked; });
$("floor").addEventListener("change", (e) => { P.floor = e.target.checked; });
$("skeleton").addEventListener("change", (e) => { P.skeleton = e.target.checked; });
$("streaks").addEventListener("change", (e) => { P.streaks = e.target.checked; });
["attractorOn", "predatorOn", "predatorHunts"].forEach((key) => {
  $(key).addEventListener("change", (e) => { P[key] = e.target.checked; syncUI(); });
});

const AGENT_STYLES = [
  ["hidden", "Nothing drawn. You read the agents from the hole, the hot rim, and the warm wake — the purist setting."],
  ["glow",   "Soft radial fields in the look's own light."],
  ["comet",  "The agents draw their own ribbon, like the dots do. A lunge stretches the predator's comet into a dash."],
  ["void",   "The predator is an absence — a soft hole gliding through the light. The attractor is a pinprick star."],
];
const styleBar = $("agentstyle");
AGENT_STYLES.forEach(([key, tip]) => {
  const b = document.createElement("button");
  b.className = "act"; b.dataset.style = key; b.textContent = key; b.title = tip;
  b.addEventListener("click", () => { P.agentStyle = key; syncUI(); });
  styleBar.appendChild(b);
});
$("pause").addEventListener("click", () => { P.paused = !P.paused; syncUI(); });
$("scatter").addEventListener("click", () => scatter());
$("reroll").addEventListener("click", () => { for (let i = 0; i < P.n; i++) assign(i); });
$("toggle").addEventListener("click", () => {
  const ui = $("ui"); ui.classList.toggle("collapsed");
  $("toggle").textContent = ui.classList.contains("collapsed") ? "show" : "hide";
});

addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (e.code === "Space") { e.preventDefault(); P.paused = !P.paused; syncUI(); }
  else if (e.key === "r") scatter();
  else if (e.key === "t") { for (let i = 0; i < P.n; i++) assign(i); }
  else if (e.key === "l") { P.links = !P.links; syncUI(); }
  else if (e.key >= "1" && e.key <= String(LOOK_KEYS.length)) setLook(LOOK_KEYS[+e.key - 1]);
});

addEventListener("resize", resize);

// ---- go --------------------------------------------------------------------
resize();
rebuild();
wipe();
syncUI();
requestAnimationFrame(frame);
</script>
</body>
</html>
