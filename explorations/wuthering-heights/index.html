<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wuthering Heights</title>
<style>
  :root { --bg: #000; --fg: #5a5650; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { display: grid; place-items: center; font: 11px/1.4 ui-monospace, Consolas, monospace; color: var(--fg); }
  /* 320x200 shown at 4:3 — VGA pixels were 20% taller than wide */
  canvas { display: block; aspect-ratio: 4 / 3; width: min(calc(100vw - 32px), calc((100vh - 40px) * 4 / 3)); height: auto;
           image-rendering: pixelated; cursor: none; }
  #hud { position: fixed; bottom: 6px; left: 0; right: 0; text-align: center; user-select: none; }
</style>
</head>
<body>
<canvas id="c" width="1600" height="1200"></canvas>
<div id="hud">click a verb, then something · click or [.] skips a line · [C] CRT · [space] pause</div>
<script>
// =====================================================================================
//  WUTHERING HEIGHTS, Chapter I — a point-and-click scene in the LucasArts VGA idiom.
//  Standalone fork of the night-storm engine (indexed 320x200, painted ramps, verbs),
//  grown into a tiny adventure engine: rooms, actors, scripts, dialogue trees.
//  Text in quotation marks is Emily Brontë's (1847, public domain); the rest is mine.
// =====================================================================================
const W = 320, H = 200, SH = 144;
const out = document.getElementById('c'), octx = out.getContext('2d');
const lo = document.createElement('canvas'); lo.width = W; lo.height = H;
const lctx = lo.getContext('2d'), img = lctx.createImageData(W, H);
const idx = new Uint16Array(W * H);                 // palette index per pixel
const idb = new Uint8Array(W * SH);                 // hotspot id per scene pixel
const bg = new Uint16Array(W * SH), bgId = new Uint8Array(W * SH), bgZ = new Uint8Array(W * SH);  // baked room: colour, id, occluder depth

let seed = 1847;
const rng = () => (seed = (seed * 16807) % 2147483647, (seed - 1) / 2147483646);
const hash = n => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };

// ---------- palette: anchor colours interpolated into long ramps (painted VGA) ----------
const PAL = [];
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const add = cs => cs.map(c => (PAL.push(c), PAL.length - 1));
const ANCH = {
  SKY:    ['#3a404e', '#535a6a', '#707886', '#8e95a0', '#b0b4bc'],
  CLOUD:  ['#2a2e38', '#424753', '#5f6471', '#878b96', '#aeb1b8'],
  HILL:   ['#262a2e', '#383e3e', '#4e544e', '#666a60'],
  MOOR:   ['#1c1216', '#302028', '#473036', '#60443e', '#7a5c4a'],
  GRASS:  ['#1a1e14', '#2a301e', '#3e442a', '#565a38', '#6e6e46'],
  MUD:    ['#1e1712', '#34281e', '#4c3c2c', '#665240'],
  STONE:  ['#1c1a18', '#312e29', '#48433b', '#605a4e', '#7a7364', '#968e7e'],
  SLATE:  ['#18191f', '#282b33', '#3a3e48', '#505568'],
  FIR:    ['#0c120e', '#162018', '#223024', '#324432'],
  THORN:  ['#141010', '#261a16', '#3a2a22'],
  WOOD:   ['#120a07', '#26180f', '#3e2818', '#5a3c24', '#785234', '#946c3e'],
  IRON:   ['#0e0e10', '#222228', '#3a3a42', '#585862'],
  FIRE:   ['#3a0c04', '#7a2008', '#c4480c', '#f08a1c', '#ffc850', '#fff0b0'],
  FLAG:   ['#38342e', '#554f48', '#746d62', '#938b7e', '#b0a89a'],
  PEWTER: ['#383c44', '#5c626c', '#888e98', '#b6bac2', '#e0e2e6'],
  GREEN:  ['#182216', '#2a3a26', '#3e5438', '#56704e'],
  MEAT:   ['#381610', '#5c281a', '#82402a', '#a66246'],
  OAT:    ['#3a2e1c', '#5e4a2c', '#86703e', '#ae9656'],
  SKIN:   ['#583828', '#8a624e', '#b68a6e', '#dab292'],
  SKIND:  ['#2c1a14', '#4a2e22', '#6c4632', '#8c6246'],
  HAIR:   ['#07070a', '#161419', '#28242a'],
  GREY:   ['#383836', '#5c5a56', '#86837c', '#aeaba2'],
  TAN:    ['#281e12', '#483822', '#6c5634', '#927648', '#b69860'],
  BLACK:  ['#09090b', '#151519', '#232329', '#33333b'],
  RED:    ['#2c0c0c', '#581818', '#882a24', '#b64434'],
  LINEN:  ['#686460', '#98938a', '#c6c1b6', '#ece8de'],
  GOWN:   ['#282834', '#3e3e58', '#5a5a7c', '#7a7a9e'],

const LONG = { SKY: 12, CLOUD: 12, HILL: 8, MOOR: 10, GRASS: 8, MUD: 6, STONE: 14, SLATE: 8, FIR: 6, THORN: 4,
               WOOD: 10, IRON: 6, FIRE: 10, FLAG: 12, PEWTER: 8, GREEN: 6, MEAT: 5, OAT: 4, SKIN: 6, SKIND: 6,

function interp(hs, n) {
  const a = hs.map(hex);
  return Array.from({ length: n }, (_, i) => {
    const f = i / (n - 1) * (a.length - 1), k = Math.min(a.length - 2, f | 0), u = f - k;
    return a[k].map((v, j) => Math.round(v + (a[k + 1][j] - v) * u));
  });
}
const R = {};
for (const k in ANCH) R[k] = add(interp(ANCH[k], LONG[k]));
const OUT = add([hex('#050405')])[0];                                              // sprite outline
const [BLACK, INV, VERB, VERB_HI, SENT] = add(['#000000', '#241c20', '#6a5446', '#e8c8a0', '#b89878'].map(hex));

// ordered dithering, squeezed toward rounding: dither only at the seam between two shades
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(b => (b + .5) / 16);
function dith(r, v, x, y) {
  const f = Math.min(1, Math.max(0, v)) * (r.length - 1), i = f | 0, b = BAYER[(y & 3) * 4 + (x & 3)];
  return r[(f - i) > .5 + (b - .5) * .3 ? Math.min(i + 1, r.length - 1) : i];
}
// light that stays inside the palette: lift a pixel up its own ramp
const RAMP_OF = new Array(PAL.length), POS_OF = new Int16Array(PAL.length);
for (const k in R) if (k !== 'FIRE') R[k].forEach((c, j) => { RAMP_OF[c] = R[k]; POS_OF[c] = j; });
function lift(i, e, x, y) {
  const r = RAMP_OF[idx[i]];
  if (!r || e <= 0) return;
  const f = e * (r.length - 1), n = f | 0, b = BAYER[(y & 3) * 4 + (x & 3)];
  idx[i] = r[Math.min(r.length - 1, POS_OF[idx[i]] + n + ((f - n) > .5 + (b - .5) * .3 ? 1 : 0))];
}

// ---------- tileable value noise ----------
const TW = 256, tex = new Float32Array(TW * TW);
for (const [p, w] of [[4, .45], [8, .27], [16, .15], [32, .08], [64, .05]]) {
  const g = Float32Array.from({ length: p * p }, rng), cell = TW / p;
  for (let y = 0; y < TW; y++) for (let x = 0; x < TW; x++) {
    const gx = x / cell, gy = y / cell, ix = gx | 0, iy = gy | 0;
    let fx = gx - ix, fy = gy - iy; fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
    const a = g[iy * p + ix], b = g[iy * p + (ix + 1) % p], c = g[((iy + 1) % p) * p + ix], d = g[((iy + 1) % p) * p + (ix + 1) % p];
    tex[y * TW + x] += w * ((a + (b - a) * fx) * (1 - fy) + (c + (d - c) * fx) * fy);
  }
}

  6: '.##./#.../###./#..#/#..#/.##.', 7: '####/...#/..#./.#../.#../.#..', 8: '.##./#..#/.##./#..#/#..#/.##.',
  9: '.##./#..#/#..#/.###/...#/.##.',
  '.': './././././#', ',': './././././#/#', '!': '#/#/#/#/./#', '?': '###/..#/.##/.#./.../.#.', "'": '#/#',
  '-': '.../.../###', '—': '...../...../#####', ':': './././#/./#', ';': './././#/./#/#', '"': '#.#/#.#',
  '(': '.#/#./#./#./#./.#', ')': '#./.#/.#/.#/.#/#.',
};
const GLYPH = Object.fromEntries(Object.entries(FONT).map(([k, v]) => [k, v.split('/')]));
const glyphW = ch => ch === ' ' ? 3 : GLYPH[ch] ? GLYPH[ch][0].length : 3;
const textW = (s, z = 1) => [...s].reduce((a, ch) => a + (glyphW(ch) + 1) * z, -z);
const px = (x, y, c) => { x |= 0; y |= 0; if (x >= 0 && x < W && y >= 0 && y < H) idx[y * W + x] = c; };
function text(s, x, y, c, shadow, z = 1) {
  for (const ch of s) {
    const g = GLYPH[ch];
    if (g) g.forEach((row, r) => { for (let k = 0; k < row.length; k++) if (row[k] === '#')
      for (let a = 0; a < z; a++) for (let b = 0; b < z; b++) {
        if (shadow != null) px(x + k * z + a + z, y + r * z + b + z, shadow);
        px(x + k * z + a, y + r * z + b, c);
      } });
    x += (glyphW(ch) + 1) * z;
  }
}
function wrap(s, max) {
  const lines = []; let cur = '';
  for (const w of s.split(' ')) { const t = cur ? cur + ' ' + w : w; if (textW(t) > max && cur) { lines.push(cur); cur = w; } else cur = t; }
  return cur ? [...lines, cur] : lines;
}

// ---------- baking helpers ----------
const P = (x, y, c, id, z = 0) => { x |= 0; y |= 0; if (x >= 0 && x < W && y >= 0 && y < SH) { const i = y * W + x; bg[i] = c; bgId[i] = id; bgZ[i] = z; } };

function bgText(s, x, y, ramp, v, id) {
  for (const ch of s) { const g = GLYPH[ch]; if (g) g.forEach((row, r) => { for (let k = 0; k < row.length; k++) if (row[k] === '#') Pd(x + k, y + r, ramp, v, id); }); x += glyphW(ch) + 1; }
}
function bline(x0, y0, x1, y1, ramp, v, id, z = 0) {
  const n = Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0))) || 1;
  for (let i = 0; i <= n; i++) Pd(Math.round(x0 + (x1 - x0) * i / n), Math.round(y0 + (y1 - y0) * i / n), ramp, v, id, z);

// =====================================================================================
//  SPRITES — ASCII frames; K is the outline, other letters map to [ramp, shade].
//  Shading happens at draw time: the edge facing the room's light gets a rim, the far
//  edge a shadow — so a mirrored sprite stays correctly lit.

    '...KKKKK...', '...KHHHK...', '...KHHHK...', '...KHHHK...', '..KKKKKKK..', '...KFFFK...', '...KFFEK...',

  for (const a of Object.values(A)) if (a.say && T >= a.say.until) { const s = a.say; a.say = null; s.res(); }
  room.tick?.();
  if (room === INT) dogsTick();
}
function frame(now) {
  acc += Math.min(.25, (now - last) / 1000); last = now;
  if (acc >= STEP) { acc = 0; if (!paused) tick(); render(); }
  requestAnimationFrame(frame);
}

// ---------- input ----------
function aim(e) { const r = out.getBoundingClientRect(); mx = Math.floor((e.clientX - r.left) / r.width * W); my = Math.floor((e.clientY - r.top) / r.height * H); }
out.addEventListener('mousemove', aim);
out.addEventListener('mouseleave', () => { mx = my = -1; });
out.addEventListener('click', e => {
  aim(e);
  if (screen === 'title') { screen = 'game'; fadeK = 1; opening(); return; }
  if (screen === 'end') { location.reload(); return; }
  if (choices) { const i = choiceAt(mx, my); if (i >= 0) choices.res(i); return; }
  if (busy) { skipSpeech(); return; }
  if (my >= SH) {
    const v = verbAt(mx, my); if (v) { verb = v; return; }
    const ii = invAt(mx, my);
    if (ii >= 0 && inventory[ii] === 'poker') { const v_ = verb; verb = 'Walk to'; busy++; say(A.lock, v_ === 'Look at' ? "A stout iron poker. My only friend in this house." : v_ === 'Use' && state.attack ? "I'm using it! Vigorously!" : "I'll hold on to this, I think.").then(() => busy--); }
    return;
  }
  if (my >= 0) { const v = verb; verb = 'Walk to'; interact(v, idb[my * W + mx], mx, my); }
});
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === '.') skipSpeech();
  else if (k === ' ') { paused = !paused; e.preventDefault(); }
  else if (k === 'c') crt = !crt;
});

setupOutside();
document.getElementById('hud').textContent += ` · ${NCOL} colours`;
window.G = { A, state, OBJ, EXT, INT, tick, render, get T() { return T; }, get room() { return room; }, get screen() { return screen; }, set screen(v) { screen = v; },
             get busy() { return busy; }, get choices() { return choices; }, interact, setRoom, fade, opening, idb, bg, bgId };
requestAnimationFrame(frame);
</script>
