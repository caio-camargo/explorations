<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Launchpad</title>
<!--
  Launchpad v1.0 — a lean rocket/orbit sandbox. One file, raw WebGL2, no dependencies.
  Design notes and measurements: NOTES.md next to this file.
-->
<style>
:root{--fg:#d8e2ee;--dim:#7d8a9a;--acc:#7fd1ff;--warn:#ffb454;--bad:#ff6b6b;--ok:#7dffa8;--panel:rgba(8,13,22,.84);--line:rgba(127,209,255,.22)}
html,body{margin:0;height:100%;background:#000;color:var(--fg);font:12.5px/1.4 ui-monospace,Consolas,Menlo,monospace;overflow:hidden;user-select:none}
canvas#gl,canvas#ov{position:fixed;inset:0;width:100%;height:100%;display:block}
canvas#ov{pointer-events:none}
.ui{position:fixed;inset:0;pointer-events:none}
.ui>*{pointer-events:auto}
.hidden{display:none!important}
.panel{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;backdrop-filter:blur(3px)}
h1{margin:0 0 2px;font-size:15px;letter-spacing:.25em;color:var(--acc)}
h2{margin:12px 0 6px;font-size:11px;letter-spacing:.15em;color:var(--dim);text-transform:uppercase;font-weight:normal}
.sub{color:var(--dim);font-size:11px}
button{font:inherit;color:var(--fg);background:rgba(127,209,255,.08);border:1px solid var(--line);border-radius:4px;padding:3px 8px;cursor:pointer}
button:hover{background:rgba(127,209,255,.2)}
button.on{background:rgba(127,209,255,.35);color:#fff}
button.big{display:block;width:100%;margin-top:12px;padding:9px;font-size:14px;letter-spacing:.3em;color:#06121c;background:var(--acc);border:0}
button.big:hover{filter:brightness(1.15)}
#palette button{display:flex;justify-content:space-between;width:100%;margin:2px 0;text-align:left}
#palette button span{color:var(--dim)}
.left{left:12px;top:12px;width:250px;max-height:calc(100% - 50px);overflow:auto}
.right{right:12px;top:12px;width:300px;max-height:calc(100% - 50px);overflow:auto}
.row{display:flex;align-items:center;gap:4px;padding:2px 4px;border-radius:3px}
.row:hover{background:rgba(255,255,255,.05)}
.row .nm{flex:1}
.ms{margin:3px 0 5px;padding-left:6px;border-left:2px solid var(--line)}.ms.done{border-left-color:var(--ok);color:var(--dim)}.ms.lock{color:#5a6574;border-left-color:#333}.ms b{color:var(--fg)}.ms.done b{color:var(--ok)}
.ep{color:var(--acc);font-size:11px;margin-top:6px}
.row button{padding:0 5px}
.seg{border-left:2px solid var(--line);margin:4px 0;padding-left:6px}
.dim{color:var(--dim)}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.acc{color:var(--acc)}
table{border-collapse:collapse;width:100%}td{padding:1px 4px}td:last-child{text-align:right}
.tl{left:12px;top:12px;min-width:250px}
.tr{right:12px;top:12px;display:flex;gap:6px;align-items:center}
.bl{left:12px;bottom:12px;min-width:190px}
#info td:first-child{color:var(--dim);padding-right:12px}
#navwrap{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;align-items:flex-end;gap:10px}
#nav{width:180px;height:180px;border-radius:50%;box-shadow:0 0 0 2px #223,0 0 18px #000}
#thr{width:14px;height:150px;border:1px solid var(--line);border-radius:3px;position:relative;background:var(--panel)}
#thrf{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#ffcf6b,#ff7a2e)}
#sas{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:118px}
#sas button{padding:2px 3px;font-size:11px}
#sas .wide{grid-column:span 2}
#navtxt{position:absolute;left:0;right:0;top:-22px;text-align:center;color:var(--acc)}
#msg{position:fixed;left:50%;top:18%;transform:translateX(-50%);font-size:18px;letter-spacing:.12em;color:#fff;text-shadow:0 0 8px #000,0 0 2px #000;pointer-events:none;transition:opacity .4s;text-align:center}
#perf{position:fixed;right:12px;bottom:8px;color:var(--fg);font-size:11.5px;pointer-events:none;text-align:right;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:3px 8px}
.ovl{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);max-height:84vh;overflow:auto;z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 16px;box-shadow:0 10px 40px #000a;backdrop-filter:blur(6px)}
.ovl .x{float:right;cursor:pointer;color:var(--dim)}.ovl h2{margin-top:0}
#help{width:min(440px,92vw)}#help td:first-child{color:var(--acc);white-space:nowrap;padding-right:10px;vertical-align:top}#help td:last-child{text-align:left}#help h3{margin:8px 0 2px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:normal}
#escm{width:min(280px,92vw)}#escm button{display:block;width:100%;margin:4px 0;text-align:left}#escm button.arm{border-color:var(--warn);color:var(--warn)}#escm label{display:block;margin-top:6px;color:var(--dim)}
body.noperf #perf{display:none}
.stg{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.stg.cur{color:#fff}.stg.cur b{color:var(--warn)}
.bar{height:4px;background:rgba(255,255,255,.08);margin-top:2px}.bar i{display:block;height:100%;background:var(--warn)}
#warp{color:var(--warn);min-width:90px;text-align:right}
#news{position:fixed;left:50%;transform:translateX(-50%);top:46px;max-width:min(560px,70vw);font-size:11.5px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:4px 10px;pointer-events:none}
#news div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#news div:first-child::before{content:'NEWS · ';color:var(--acc);letter-spacing:.1em}#news .old{color:var(--dim)}
#nodep{right:12px;top:52px;width:285px}#nodep td:first-child{padding-right:8px}#nodep button{padding:0 6px}
.ndv{display:inline-block;min-width:78px;text-align:right}.ndrow{margin-top:4px;display:flex;gap:3px;align-items:center;flex-wrap:wrap}.ndrow button.on{background:rgba(127,209,255,.35)}
.grp{margin:1px 0 5px 16px;border-left:2px solid rgba(255,180,84,.45);padding:2px 0 2px 6px;border-radius:0 4px 4px 0}
.grp.sel{background:rgba(255,180,84,.1);border-left-color:var(--warn)}
.grp .hd{display:flex;gap:3px;align-items:center;flex-wrap:wrap;color:var(--warn)}.grp .hd button{padding:0 5px}
#target{color:var(--warn);font-size:11px;margin:-2px 0 6px}
.jrow{display:flex;gap:6px;align-items:center;font-size:10.5px;padding:0 4px 0 10px;margin:-1px 0;color:var(--dim)}.jrow .jl{color:#5a6574}.jrow button{margin-left:auto;padding:0 5px;font-size:10px}.jrow button.on{background:rgba(255,180,84,.3);color:#fff}#target a{color:var(--acc);cursor:pointer;text-decoration:underline}
@media (max-width:1000px),(max-height:620px){body{font-size:10.5px}#nav{width:120px;height:120px}#thr{height:100px}#sas{width:100px}#sas button{font-size:9.5px}
 .tl{min-width:0;padding:6px 8px}.bl{padding:6px 8px;min-width:0;max-width:170px}.left,.right{width:210px;padding:8px}#navtxt{font-size:9.5px;top:-16px}h2{margin:6px 0 3px}}
/* the logbook, by era: a handwritten notebook on graph paper; a monochrome phosphor terminal; or plain (modern) */
#logbook{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,92vw);max-height:84vh;overflow:auto;z-index:5;padding:18px 22px;border-radius:4px;box-shadow:0 10px 40px #000a}
#logbook .x{position:absolute;right:10px;top:8px;cursor:pointer;opacity:.7}#logbook .lbrow{margin:10px 0}#logbook .lbv{font-size:1.25em}#logbook s{opacity:.55;margin-right:8px}
#logbook button{font:inherit;font-size:.85em;margin-top:2px}#logbook .lbsec{margin:16px 0 2px;font-size:.8em;letter-spacing:.15em;text-transform:uppercase;opacity:.65;border-bottom:1px solid currentColor}
#logbook .lbrow{margin:6px 0 8px}#logbook .lbopt{margin-top:14px;font-size:.8em;opacity:.75}
.lb-notebook{background:#f6f0de;color:#1d2a52;font:17px/1.35 'Segoe Print','Bradley Hand','Comic Sans MS',cursive;
  background-image:linear-gradient(#bcd2ea55 1px,transparent 1px),linear-gradient(90deg,#bcd2ea55 1px,transparent 1px);background-size:22px 22px}
.lb-notebook h3{margin:0 0 6px;font-size:1.5em;text-decoration:underline wavy #c0392b88}.lb-notebook .lbu{color:#8a7c66;font-style:italic}.lb-notebook .lbby{color:#5d6d8a;font-size:.8em}
.lb-notebook button{background:none;border:0;border-bottom:1px dashed #1d2a52;color:#1d2a52;padding:0;cursor:pointer}
.lb-terminal{background:#020a03;color:#39ff6e;font:15px/1.4 ui-monospace,Consolas,monospace;text-shadow:0 0 6px #39ff6e88;border:1px solid #1d5a2a;
  background-image:repeating-linear-gradient(#ffffff06 0 1px,transparent 1px 3px)}
.lb-terminal h3{margin:0 0 6px;font-weight:normal;letter-spacing:.2em}.lb-terminal .lbu{color:#1f9a45}.lb-terminal .lbby{color:#1f9a45}
.lb-terminal button{background:#06210d;border:1px solid #39ff6e;color:#39ff6e;border-radius:0;padding:0 6px}
.lb-modern{background:var(--panel);color:var(--fg);border:1px solid var(--line);font:13px/1.45 ui-monospace,Consolas,monospace}.lb-modern h3{margin:0 0 6px;color:var(--acc)}.lb-modern .lbu,.lb-modern .lbby{color:var(--dim)}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>

<div id="editor" class="ui">
  <div class="panel left">
    <h1>LAUNCHPAD <button id="bLog" style="float:right;letter-spacing:0;font-size:11px">Logbook</button></h1><div class="sub">assembly · pick a part, then place it on the rocket</div>
    <h2>Program</h2><div id="program"></div>
    <h2>Parts</h2><div id="target"></div><div id="palette"></div>
    <h2>Presets</h2><div id="presets"></div>
  </div>
  <div class="panel right">
    <h2>Build</h2><div id="stack"></div>
    <h2>Stages <span class="dim">(Δv vac / sea level)</span></h2><div id="stats"></div>
    <h2>Launch site</h2><div id="sitePick"></div>
    <button id="launch" class="big">LAUNCH</button>
  </div>
</div>

<div id="hud" class="ui hidden">
  <div class="panel tl"><table id="info"></table></div>
  <div class="tr"><span id="warp"></span><button id="bMap">Map [M]</button><button id="bRevert">Revert</button><button id="bEditor">Assembly</button><button id="bLog2">Logbook</button><button id="bHelp">Keys [H]</button><button id="bMenu" title="menu [Esc]">☰</button><button id="bAuto" class="hidden" title="replay your saved flight of this exact design">▶ Autopilot</button><button id="bSaveTape" title="save this flight so far as this design's autopilot">Save as autopilot</button></div>
  <div id="navwrap">
    <div id="thr"><div id="thrf"></div></div>
    <div style="position:relative"><div id="navtxt"></div><canvas id="nav" width="180" height="180"></canvas></div>
    <div id="sas"></div>
  </div>
  <div class="panel bl" id="stages"></div>
  <div class="panel hidden" id="nodep">
    <h2 style="margin-top:0">Maneuver node</h2>
    <div id="nd-sum"></div>
    <table style="margin:6px 0">
      <tr><td style="color:#d8f05a">Prograde</td><td><button data-a="d0-">−</button> <span id="nd0" class="ndv"></span> <button data-a="d0+">+</button></td></tr>
      <tr><td style="color:#e07cff">Normal</td><td><button data-a="d1-">−</button> <span id="nd1" class="ndv"></span> <button data-a="d1+">+</button></td></tr>
      <tr><td style="color:#5fd0ff">Radial out</td><td><button data-a="d2-">−</button> <span id="nd2" class="ndv"></span> <button data-a="d2+">+</button></td></tr>
    </table>
    <div class="ndrow">step <button data-a="s0.1">0.1</button><button data-a="s1">1</button><button data-a="s10">10</button><button data-a="s100">100</button> m/s</div>
    <div class="ndrow">time <button data-a="t-o">−orbit</button><button data-a="t-60">−1m</button><button data-a="t-5">−5s</button><button data-a="t+5">+5s</button><button data-a="t+60">+1m</button><button data-a="t+o">+orbit</button></div>
    <div class="ndrow"><button data-a="warp">Warp to burn</button> <button data-a="sas">SAS → node</button> <button data-a="del">Delete</button></div>
    <div class="sub">Drag the coloured handles on the map node; the further you drag, the faster it changes.</div>
  </div>
</div>
<div id="logbook" class="hidden"></div>
<div id="help" class="ovl hidden"></div>
<div id="escm" class="ovl hidden"></div>
<div id="msg"></div>
<div id="news" class="hidden"></div>
<div id="perf"></div>

<script src="builder.js"></script>
<script>
'use strict';
// ==== SIM BEGIN — pure simulation, no DOM/GL. Extracted by test.mjs for headless checks.
const G0 = 9.80665, DT = 0.02;
const HOOK = { msg(){}, boom(){}, rebuild(){}, debris(){}, news(){}, save(){}, logged(){} };
const INP = { pitch:0, yaw:0, roll:0, tx:0, ty:0, tz:0 };   // tx/ty/tz: RCS translation, body axes

// ---- vectors / quaternions (plain arrays; doubles throughout)
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const madd=(a,b,s)=>[a[0]+b[0]*s,a[1]+b[1]*s,a[2]+b[2]*s];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const len=a=>Math.hypot(a[0],a[1],a[2]);
const norm=a=>{const l=len(a)||1;return[a[0]/l,a[1]/l,a[2]/l]};
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
function rotY(v,th){const c=Math.cos(th),s=Math.sin(th);return[c*v[0]+s*v[2],v[1],-s*v[0]+c*v[2]]}
const qmul=(a,b)=>[a[3]*b[0]+a[0]*b[3]+a[1]*b[2]-a[2]*b[1],a[3]*b[1]-a[0]*b[2]+a[1]*b[3]+a[2]*b[0],a[3]*b[2]+a[0]*b[1]-a[1]*b[0]+a[2]*b[3],a[3]*b[3]-a[0]*b[0]-a[1]*b[1]-a[2]*b[2]];
const qnorm=q=>{const l=Math.hypot(q[0],q[1],q[2],q[3]);return[q[0]/l,q[1]/l,q[2]/l,q[3]/l]};
const qconj=q=>[-q[0],-q[1],-q[2],q[3]];
const qaxis=(ax,an)=>{const s=Math.sin(an/2);return[ax[0]*s,ax[1]*s,ax[2]*s,Math.cos(an/2)]};
function qrot(q,v){const u=[q[0],q[1],q[2]],w=q[3],uv=cross(u,v),uuv=cross(u,uv);return[v[0]+2*(w*uv[0]+uuv[0]),v[1]+2*(w*uv[1]+uuv[1]),v[2]+2*(w*uv[2]+uuv[2])]}
function qFromBasis(X,Y,Z){const m00=X[0],m10=X[1],m20=X[2],m01=Y[0],m11=Y[1],m21=Y[2],m02=Z[0],m12=Z[1],m22=Z[2],tr=m00+m11+m22;let x,y,z,w,s;
  if(tr>0){s=Math.sqrt(tr+1)*2;w=.25*s;x=(m21-m12)/s;y=(m02-m20)/s;z=(m10-m01)/s}
  else if(m00>m11&&m00>m22){s=Math.sqrt(1+m00-m11-m22)*2;w=(m21-m12)/s;x=.25*s;y=(m01+m10)/s;z=(m02+m20)/s}
  else if(m11>m22){s=Math.sqrt(1+m11-m00-m22)*2;w=(m02-m20)/s;x=(m01+m10)/s;y=.25*s;z=(m12+m21)/s}
  else{s=Math.sqrt(1+m22-m00-m11)*2;w=(m10-m01)/s;x=(m02+m20)/s;y=(m12+m21)/s;z=.25*s}
  return qnorm([x,y,z,w])}
function qFromTo(a,b){const c=cross(a,b),d=dot(a,b);if(d<-0.999999){let ax=cross([1,0,0],a);if(len(ax)<1e-6)ax=cross([0,1,0],a);return qaxis(norm(ax),Math.PI)}return qnorm([c[0],c[1],c[2],1+d])}

// ---- the system: a tree of bodies. Inertial frame centred on the root (Tellus), spin axis +Y.
// Sized from a scale study (2026-10-07, see NOTES) and pegged to Earth rather than to any game planet: a fifth of Earth's
// radius (1,274 km, ~2.1× Kerbin), Earth's surface gravity (9.81), a day a third of Earth's (8 h), Earth-like air with
// its top at the Kármán line (100 km, scale height 7.5 km). Orbit costs ~4,200–4,350 m/s; low-orbit speed is 3.4 km/s.
const TELLUS={name:'Tellus',R:1.274e6,mu:9.81*1.274e6**2,rot:2*Math.PI/28800,atm:1e5,H:7500,rho0:1.225,th0:-Math.PI/3,soi:Infinity};
// Selene: the Moon's size relative to its planet (0.273 R), the Moon's surface gravity (1.62), a tenth of the Moon's distance
const SELENE={name:'Selene',R:3.48e5,mu:1.62*3.48e5**2,atm:0,pert:true,orb:{a:3.844e7,e:0,i:0,lan:0,argp:0,M0:2.0}};
// Nyx: a small captured moon on an inclined, eccentric orbit (8,100–27,900 km, 30°, 33 h), always inside Selene's orbit
// clear of its SOI. Its SOI breathes with its distance (407–1,401 km). Sized from an n-body study (NOTES, "Nyx").
const NYX={name:'Nyx',R:1.5e5,mu:0.4*1.5e5**2,atm:0,pert:true,orb:{a:1.8e7,e:0.55,i:30*Math.PI/180,lan:1.0,argp:0.8,M0:0.5}};
const BODIES=[],PERT_MIN=2e-6;   // PERT_MIN: see the third-body block below
// A moon's orbit about its parent: fixed Kepler elements (a, e, i, longitude of the node, argument of periapsis, mean
// anomaly at t=0). Angles are measured in this frame's equator (XZ) with +Y north, so prograde runs +X → −Z.
function addBody(b,parent){b.parent=parent||null;b.children=[];BODIES.push(b);if(!parent)return b;parent.children.push(b);
  const o=b.orb,cO=Math.cos(o.lan),sO=Math.sin(o.lan),cw=Math.cos(o.argp),sw=Math.sin(o.argp),ci=Math.cos(o.i),si=Math.sin(o.i);
  b.P=[cO*cw-sO*sw*ci,sw*si,-(sO*cw+cO*sw*ci)];b.Q=[-cO*sw-sO*cw*ci,cw*si,-(-sO*sw+cO*cw*ci)];
  b.a=o.a;b.n=Math.sqrt((parent.mu+(b.pert?b.mu:0))/o.a**3);   // a perturbing moon: the pair's relative orbit, consistent with its parent's reflex
  b.rMin=o.a*(1-o.e);b.rMax=o.a*(1+o.e);b.vMax=b.n*o.a*Math.sqrt((1+o.e)/(1-o.e));
  // SOI: the Laplace radius (m/M)^0.4 × distance. On an eccentric orbit it follows the distance (soiAt); b.soi is its
  // largest value, for conservative tests. soiRate bounds how fast it moves, for rails' step size.
  b.soiK=Math.pow(b.mu/parent.mu,0.4);b.soi=o.e?b.rMax*b.soiK:o.a*b.soiK;b.soiMin=o.e?b.rMin*b.soiK:b.soi;b.soiRate=o.e?b.soiK*b.vMax:0;return b}
addBody(TELLUS);addBody(SELENE,TELLUS);addBody(NYX,TELLUS);
// position and velocity of b relative to its parent at time t
function bodyRel(b,t){const o=b.orb,e=o.e,M=b.n*t+o.M0;let E=M;for(let k=0;k<30;k++){const d=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));E-=d;if(Math.abs(d)<1e-15)break}
  const c=Math.cos(E),s=Math.sin(E),q=Math.sqrt(1-e*e),x=o.a*(c-e),y=o.a*q*s,k=b.n*o.a/(1-e*c),vx=-k*s,vy=k*q*c,P=b.P,Q=b.Q;
  return[[x*P[0]+y*Q[0],x*P[1]+y*Q[1],x*P[2]+y*Q[2]],[vx*P[0]+vy*Q[0],vx*P[1]+vy*Q[1],vx*P[2]+vy*Q[2]]]}
function moonPos(t){return bodyRel(SELENE,t)[0]}
function moonVel(t){return bodyRel(SELENE,t)[1]}
// absolute position (relative to the root); the root is the origin
// ---- third-body perturbations (open thread 6b). Near a moon with pert:true (Nyx, Selene) the craft feels both bodies: inside
// its SOI, the parent's tide (direct pull minus the pull on the moon); in the parent's frame, the moon's pull minus the
// parent's reflex toward it. Whether an orbit is perturbed is decided per orbit (pertNear, PERT_MIN = 2e-6 of the central
// pull), and on such an orbit the force is always on, so warp changes nothing but rounding. Low Tellus orbit feels Nyx's tide
// (~1e-5) and drifts metres a month; orbits that feel nothing keep the old exact Kepler rails. Each moon's relative orbit
// uses μ_parent + μ_moon, which is what makes the two frames agree; n-body integrations of that model match the game to under a
// km a day after a Nyx flyby, 10 m over a day in lunar orbit, ~5 km two days after a close Selene pass (NOTES, 6b).
const pthr=(b,r,ac)=>{const rl=len(r);return len(ac)*rl*rl>=PERT_MIN*b.mu};
function pertAcc(b,r,t,thr){let a=null;
  if(b.pert){const R=bodyRel(b,t)[0],y=add(r,R),yl=len(y),Rl=len(R);a=mul(add(mul(y,1/(yl*yl*yl)),mul(R,-1/(Rl*Rl*Rl))),-b.parent.mu)}

  const rows=[['MET',met],['Body',`${b.name} · ${sit}`],['Altitude',`${fmtD(h)}  <span class="dim">${vs>=0?'↑':'↓'} ${Math.abs(vs).toFixed(0)} m/s</span>`],...(h<TERR_TOP+20000&&!S.landed?[['Radar alt',`${fmtD(Math.max(0,groundGap(S)))} <span class="dim">above the ground</span>`]]:[]),
    ['Speed',`srf ${srf.toFixed(0)} · orb ${len(S.v).toFixed(0)} m/s`],
    ['Apoapsis',S.landed?'—':el.e<1?`${fmtD(el.ap-b.R)} <span class="dim">in ${fmtT(tAp)}</span>`:'escape'],
    ['Periapsis',S.landed?'—':`${fmtD(el.pe-b.R)}${isFinite(tPe_)&&tPe_>0&&el.pe>b.R?` <span class="dim">in ${fmtT(tPe_)}</span>`:''}`],
    ['Mass',`${(S.mass/1000).toFixed(2)} t · TWR ${twr.toFixed(2)} · ${S.gload.toFixed(1)} g`],['Δv',`stage ${dv.cur.toFixed(0)} · total ${dv.tot.toFixed(0)} m/s`],
    ['Aero',b.atm&&h<b.atm?`M ${S.mach.toFixed(2)} · AoA ${(S.aoa*57.3).toFixed(1)}° · q ${(S.qdyn/1000).toFixed(1)} kPa`:'—'],
    ['Impact',!toolOK('impact')?'<span class="dim">no trajectory data yet</span>':impact?`in ${fmtT(impact.t-simT)} · ${impact.v.toFixed(0)} m/s${impact.v<12?' <span class="ok">(safe)</span>':''}${impSpread&&impSpread.km>0.5?` <span class="warn">± ${impSpread.km.toFixed(0)} km</span>`:''}${S.rangeWarn?` <span class="bad">over ${S.rangeWarn.city.name}!</span>`:''}`:'—'],
    ['Heat',S.hot?`<span class="${S.hot.T>S.hot.d.Tmax*.9?'bad':S.hot.T>S.hot.d.Tmax*.7?'warn':'ok'}">${S.hot.T.toFixed(0)} / ${S.hot.d.Tmax} K</span> <span class="dim">${S.hot.d.name}${S.parts.some(p=>p.on&&p.cap.ablator)?` · ablator ${(100*S.parts.filter(p=>p.on&&p.cap.ablator).reduce((a,p)=>a+p.res.ablator/p.cap.ablator,0)/S.parts.filter(p=>p.on&&p.cap.ablator).length).toFixed(0)}%`:''}</span>`:'—'],
    ...rcsRows(),...tgtRows(),...dockRows(),...fleetRows(),...bayRows(),...payloadRows(),
    ['Structure',S.maxLoadP&&S.maxLoadP.on&&S.maxLoadP.sk1?(c=>`<span class="${c>1?'bad':c>.7?'warn':'ok'}">${(c*100).toFixed(0)}% ${S.maxLoadKind}</span>`)(S.maxLoad/Math.min(certOf(S.maxLoadP.sk1),certOf(S.maxLoadP.sk2)))+` <span class="dim">${S.maxLoadP.d.name} / ${S.maxLoadP.parent.d.name}</span>`:'—']];
  $('info').innerHTML=rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('');
  const w=WARPS[warpIdx];$('warp').textContent=w>1?`▶▶ ${w}×${railsOK(S)?'':' (physics)'}`:'';
  renderStages();updateNodePanel();updateAutoBtn();settleDrops();
  // the beeper: while an instrument package orbits, towns it passes over hear it (once each per flight)
  if(S.alive&&S.rec.orbitSci&&!S.landed&&S.body===TELLUS){const{city,dist}=nearestCity(toPF(TELLUS,S.r,simT));
    if(dist<350e3&&!heard.has(city.name)){heard.add(city.name);HOOK.news(heard.size===1?`Radio hams in ${city.name} pick up a faint beep-beep-beep from orbit`:`${city.name} hears the beeper pass overhead`,'ok')}}
  if(simT-impT>0.25||simT<impT){impT=simT;impact=predictImpact(S);
    // the atmosphere's unsampled bands: fly the same prediction with the air 25 % thinner and thicker there (once a second)
    if(!impact||impact.b!==TELLUS||BANDS.every(k=>PROG.atm[k]))impSpread=null;
    else if(simT-impST>1||simT<impST){impST=simT;const lo=predictImpact(S,-1),hi=predictImpact(S,1),gc=(a,b)=>Math.acos(clamp(dot(norm(a),norm(b)),-1,1))*TELLUS.R/1000;
      impSpread=lo&&hi?{lo,hi,km:Math.max(gc(lo.pf,impact.pf),gc(hi.pf,impact.pf))}:null}
    // range safety: while climbing under power, the impact point (the whole spread of it) must stay clear of cities
    const vs=impact&&S.thrust>0&&impact.b===TELLUS?[impact,...(impSpread?[impSpread.lo,impSpread.hi]:[])].map(x=>dropVerdict(TELLUS,x.pf)):[],
      rs=vs.find(v=>v.kind==='city')||vs.find(v=>v.kind==='near')||null,warn=!!rs;
    if(warn&&!rangeWarned){rangeWarned=true;HOOK.msg(`RANGE SAFETY: impact point over ${rs.city.name}`);HOOK.news(`Range safety officer spills coffee as flight path crosses ${rs.city.name}`,'warn')}
    if(!warn)rangeWarned=false;S.rangeWarn=warn?rs:null}}
let rangeWarned=false,impSpread=null,impST=-1;const heard=new Set();

// ---- autopilot tapes in browser storage, one per exact design (and sim version: a tape only replays on the sim that made it)
const tapeKey=()=>'launchpad-tape:'+TAPE_V+':'+JSON.stringify(stackDef);
function loadTape(){try{const t=JSON.parse(localStorage.getItem(tapeKey())||'null');return t&&t.v===TAPE_V?t:null}catch(e){return null}}
function updateAutoBtn(){const t=loadTape();$('bAuto').classList.toggle('hidden',!(t&&mode==='flight'&&simT===0&&!player));if(t)$('bAuto').textContent=`▶ Autopilot (${fmtT(tapeDuration(t))})`}
function takeOver(){if(!player)return;recTape=tapeCut(player);player=null;warpIdx=0;HOOK.msg('Autopilot off — you have control')}
$('bAuto').onclick=()=>{const t=loadTape();if(!t)return;if(t.site&&siteById(t.site))PROG.site=t.site;resetShip();player={tape:t,i:0,n:0};updateAutoBtn();HOOK.msg('Autopilot: replaying your recorded flight · any control key takes over')};
$('bSaveTape').onclick=()=>{try{const T=player?tapeCut(player):recTape;localStorage.setItem(tapeKey(),JSON.stringify({v:T.v,stack:T.stack,ops:T.ops,site:T.site}));
  HOOK.msg(`Saved ${fmtT(tapeDuration(T))} of flight as this design's autopilot`)}catch(e){HOOK.msg('Could not save (browser storage unavailable)')}};
function nodeAtApoapsis(){if(!S.alive||S.landed)return;if(!toolOK('nodes')){HOOK.msg(gateMsg('nodes'));return}const el=elements(S.r,S.v,S.body.mu);
  const t=el.e<1&&el.hl>1e-3?simT+timeToNu(el,Math.PI):simT+300;S.node={t,dv:[0,0,0]};HOOK.msg(el.e<1?'Node at next apoapsis':'Node in 5 minutes')}
$('nodep').addEventListener('click',e=>{const a=e.target.dataset&&e.target.dataset.a;if(!a||!S.node)return;if(player)takeOver();const n=S.node;
  if(a[0]==='d'){if(n.burning)return;n.dv[+a[1]]+=(a[2]==='+'?1:-1)*ndStep}
  else if(a[0]==='s'&&a!=='sas'){ndStep=+a.slice(1)}
  else if(a[0]==='t'&&!n.burning){const el=elements(S.r,S.v,S.body.mu),P=el.e<1?el.period:0,d=a==='t-o'?-P:a==='t+o'?P:+a.slice(1);
    const end=(predCache&&predCache.p[0]&&predCache.p[0].endT)||Infinity;n.t=clamp(n.t+d,simT+1,end)}
  else if(a==='warp'){const est=nodeBurnTime(S,len(nodeInfo(S).rem));warpTo=n.t-(isFinite(est)?est/2:0)-15;if(warpTo<=simT+1)warpTo=null}
  else if(a==='sas'){S.sas=true;S.sasMode='node';S.hold=null;renderSAS()}
  else if(a==='del'){S.node=null;HOOK.msg('Node deleted')}
  updateNodePanel()});
function updateNodePanel(){const el=$('nodep');if(!S.node||mode!=='flight'){el.classList.add('hidden');return}el.classList.remove('hidden');
  const n=S.node,I=nodeInfo(S),dv=len(I.rem),est=nodeBurnTime(S,dv);n.est=est;
  for(let k=0;k<3;k++)$('nd'+k).textContent=n.dv[k].toFixed(1)+' m/s';
  const tt=n.t-simT,start=tt-(isFinite(est)?est/2:0);
  $('nd-sum').innerHTML=n.burning?`<b class="warn">BURNING</b> · ${dv.toFixed(1)} m/s to go`:
    `Δv <b>${dv.toFixed(1)} m/s</b> · burn ${isFinite(est)?fmtT(est):'<span class="bad">no engine</span>'}<br>node in ${fmtT(tt)} · <span class="${start<10?'warn':''}">start burn in ${fmtT(start)}</span>${warpTo!==null?' <span class="warn">(warping)</span>':''}`;
  for(const b of el.querySelectorAll('[data-a^="s"]'))b.classList.toggle('on',b.dataset.a==='s'+ndStep)}
renderEditor();
requestAnimationFrame(frame);
</script>
