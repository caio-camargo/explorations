<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Satellite lineup</title>
<!-- Launchpad mock-up (design desk, 2026-10-13): satellite shape variety. Caio: "still concerned that they will look samey...
     more shape variety that is not just cylinders. maybe some of the parts just need to be smaller?" Thirteen craft built
     only from proposed parts, against what the game builds today, to test four directions: smaller sizes, bus shapes,
     skins, signature appendages. Never loaded by the game; shapes after real craft, simplified.
     ?sat=<id> (one craft, drag to turn)  &still=1 -->
<style>
:root{--pane:#0f1822e8;--line:#26384a;--ink:#d6e2ee;--dim:#8a9db0;--acc:#7fd0ff;--ok:#6fdc8c;--warn:#ffb84a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05070c;color:var(--ink);font:12px/1.4 ui-monospace,Consolas,"Cascadia Mono",monospace}
.app{position:relative;width:1280px;height:800px;margin:0 auto;overflow:hidden}
#cv{position:absolute;inset:0;width:1280px;height:800px}
.cell{position:absolute;width:320px;height:200px;border-right:1px solid #111a24;border-bottom:1px solid #111a24;cursor:pointer}
.cell:hover{outline:1px solid var(--acc);outline-offset:-1px}
.cell .n{position:absolute;left:8px;top:6px;font-weight:bold;color:var(--ink);text-shadow:0 1px 2px #000}
.cell .t{position:absolute;left:8px;bottom:6px;right:8px;color:var(--dim);font-size:11px;text-shadow:0 1px 2px #000}
.cell .t i{color:#e7c37a;font-style:normal}
.cell.today .n{color:var(--warn)}
.intro{position:absolute;padding:10px 12px;width:640px;height:200px;font-size:12px;color:#c3d0dc}
.intro h1{margin:0 0 6px;font-size:13px;letter-spacing:2px;color:var(--acc)}
.intro b{color:var(--ink)}
.key span{display:inline-block;margin-right:10px}
.key i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.one{position:absolute;right:12px;top:12px;width:330px;background:var(--pane);border:1px solid var(--line);border-radius:8px;padding:12px;display:none}
.one h2{margin:0 0 6px;font-size:14px;color:var(--acc)}
.one .back{float:right;cursor:pointer;color:var(--dim)}
.one ul{margin:6px 0 0 16px;padding:0}
.hint{position:absolute;right:12px;bottom:12px;background:var(--pane);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:11px;color:var(--dim)}
</style></head><body>
<div class="app" id="app">
<canvas id="cv" width="1280" height="800"></canvas>
<div class="one" id="one"></div>
<div class="hint" id="hint">click a craft to look round it · ?sat=&lt;id&gt; · &amp;still=1</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const Q=new URLSearchParams(location.search);if(Q.get('still'))document.getElementById('hint').style.display='none';
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
// ---- skins (the third direction): canvas textures, no files
function cvTex(w,h,f,rep=[1,1],srgb=true){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(...rep);if(srgb)t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t}
const crinkle=cvTex(256,256,(g,w,h)=>{const d=g.createImageData(w,h);for(let i=0;i<w*h;i++){const x=i%w,y=i/w|0,v=128+60*Math.sin(x*.21+Math.sin(y*.13)*3)*Math.sin(y*.17+Math.sin(x*.09)*2)+40*(Math.random()-.5);d.data.set([v,v,v,255],i*4)}g.putImageData(d,0,0)},[2,2],false);
const cells=(rx,ry)=>cvTex(128,128,(g,w,h)=>{g.fillStyle='#9aa2ab';g.fillRect(0,0,w,h);for(let i=0;i<4;i++)for(let j=0;j<4;j++){g.fillStyle=`hsl(225,55%,${14+Math.random()*6}%)`;g.fillRect(i*32+2,j*32+2,28,28)}},[rx,ry]);
const checker=(rx,ry)=>cvTex(64,64,(g)=>{for(let i=0;i<2;i++)for(let j=0;j<2;j++){g.fillStyle=(i+j)%2?'#141414':'#ecebe6';g.fillRect(i*32,j*32,32,32)}},[rx,ry]);
const stripes=(n)=>cvTex(16,128,(g)=>{for(let j=0;j<8;j++){g.fillStyle=j%2?'#ecebe6':'#9a9da2';g.fillRect(0,j*16,16,16)}},[1,n]);
const meshTex=cvTex(64,64,(g)=>{g.clearRect(0,0,64,64);g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();for(let i=0;i<=64;i+=16){g.moveTo(i,0);g.lineTo(i,64);g.moveTo(0,i);g.lineTo(64,i)}g.stroke()},[24,24],false);
const S={
  gold:new THREE.MeshStandardMaterial({color:'#c98a1e',metalness:.75,roughness:.3,bumpMap:crinkle,bumpScale:.012}),
  silver:new THREE.MeshStandardMaterial({color:'#dfe3e7',metalness:.5,roughness:.28,bumpMap:crinkle,bumpScale:.012}),
  alu:new THREE.MeshStandardMaterial({color:'#f2f2f2',metalness:.6,roughness:.18}),
  white:new THREE.MeshStandardMaterial({color:'#efeee9',metalness:0,roughness:.65}),
  black:new THREE.MeshStandardMaterial({color:'#18191b',metalness:.2,roughness:.6}),
  grey:new THREE.MeshStandardMaterial({color:'#8c9095',metalness:.5,roughness:.45}),
  dgrey:new THREE.MeshStandardMaterial({color:'#4a4d52',metalness:.5,roughness:.5}),
  strut:new THREE.MeshStandardMaterial({color:'#c9ccd0',metalness:.45,roughness:.35}),
  ablate:new THREE.MeshStandardMaterial({color:'#5a3d2a',metalness:0,roughness:.9}),
  lens:new THREE.MeshStandardMaterial({color:'#0a0f1a',metalness:.9,roughness:.05}),
  paint:new THREE.MeshStandardMaterial({color:'#b8bcc2',metalness:.3,roughness:.5}),   // today's look: one painted grey
};
const cellM=(rx,ry)=>new THREE.MeshStandardMaterial({map:cells(rx,ry),metalness:.35,roughness:.35});
const checkM=(rx,ry)=>new THREE.MeshStandardMaterial({map:checker(rx,ry),metalness:0,roughness:.6});
const stripeM=(n)=>new THREE.MeshStandardMaterial({map:stripes(n),metalness:.5,roughness:.35});
const meshM=new THREE.MeshStandardMaterial({color:'#c98a1e',metalness:.7,roughness:.4,alphaMap:meshTex,transparent:true,side:THREE.DoubleSide,depthWrite:false});
// ---- shapes
const mk=(g,m,p,r)=>{const x=new THREE.Mesh(g,m);x.position.set(...(p||[0,0,0]));x.rotation.set(...(r||[0,0,0]));return x};
const cyl=(r,h,m,p,rot,seg=24,r2=r)=>mk(new THREE.CylinderGeometry(r2,r,h,seg),m,p,rot);
const box=(w,h,d,m,p,rot)=>mk(new THREE.BoxGeometry(w,h,d),m,p,rot);
const ball=(r,m,p)=>mk(new THREE.SphereGeometry(r,32,16),m,p);
function rod(a,b,r,m){const A=V(...a),B=V(...b),d=B.clone().sub(A),x=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),8),m);x.position.copy(A).add(B).multiplyScalar(.5);x.quaternion.setFromUnitVectors(V(0,1,0),d.normalize());return x}
function dish(D,depth,m,seg=40){const pts=[];for(let i=0;i<=16;i++){const r=D/2*i/16;pts.push(new THREE.Vector2(r,depth*(r/(D/2))**2))}const g=new THREE.LatheGeometry(pts,seg);const x=new THREE.Mesh(g,m||S.white);x.material.side=THREE.DoubleSide;return x}   // concave toward +y
function wing(len,wd,m,gap=.05){const g=new THREE.Group();const n=Math.max(1,Math.round(len/wd/1.1));for(let i=0;i<n;i++){g.add(box(len/n-gap,wd,.03,m,[gap/2+(i+.5)*len/n,0,0]))}return g}   // panels along +x
function helix(r,L,turns,m){class H extends THREE.Curve{getPoint(t){const a=t*turns*6.2832;return V(r*Math.cos(a),t*L,r*Math.sin(a))}}return new THREE.Mesh(new THREE.TubeGeometry(new H(),turns*16,.012,5),m)}
function truss(a,b,w,m){const g=new THREE.Group(),A=V(...a),B=V(...b),n=6;const ax=B.clone().sub(A),L=ax.length(),u=ax.clone().normalize(),p=Math.abs(u.y)<.9?V(0,1,0):V(1,0,0),s=p.cross(u).normalize().multiplyScalar(w/2),t=u.clone().cross(s).normalize().multiplyScalar(w/2);
  const C=[s.clone().add(t),s.clone().sub(t),s.clone().negate().sub(t),s.clone().negate().add(t)];
  for(const c of C)g.add(rod(A.clone().add(c).toArray(),B.clone().add(c).toArray(),.02,m));
  for(let i=0;i<n;i++){const P=A.clone().add(u.clone().multiplyScalar(L*i/n)),P2=A.clone().add(u.clone().multiplyScalar(L*(i+1)/n));for(let k=0;k<4;k++)g.add(rod(P.clone().add(C[k]).toArray(),P2.clone().add(C[(k+1)%4]).toArray(),.012,m))}
  return g}
// ---- the craft
const SATS=[
 {id:'beep',n:'Beeper sphere',y:'1957',job:'first beacon',size:'0.58 m',tags:['small','sphere','polished','swept whips'],why:'A polished ball so the sun can\'t cook it, four whips swept back so they clear the fairing. Real: Sputnik 1.',
  b:g=>{g.add(ball(.29,S.alu));for(let i=0;i<4;i++){const a=i*Math.PI/2+.785,x=Math.cos(a)*.18,z=Math.sin(a)*.18;g.add(rod([x,-.1,z],[x*9,-2.5-(i%2)*.4,z*9],.012,S.alu))}}},
 {id:'pencil',n:'Pencil probe',y:'1958',job:'radiation counter',size:'2.0 m × 0.16',tags:['tiny','cylinder','thermal stripes','kick motor'],why:'The satellite is the last stage: a thin tube on a small solid motor, striped white and bare to set its temperature, spinning, with wire antennas. Real: Explorer 1.',
  b:g=>{g.add(cyl(.08,.9,stripeM(3),[0,.45,0]));g.add(cyl(.0,.3,S.alu,[0,1.05,0],[0,0,0],24,.08));g.add(cyl(.08,.7,S.black,[0,-.35,0]));g.add(cyl(.05,.12,S.dgrey,[0,-.76,0],0,16,.08));
   for(let i=0;i<4;i++){const a=i*Math.PI/2;g.add(rod([Math.cos(a)*.08,.3,Math.sin(a)*.08],[Math.cos(a)*.65,.32,Math.sin(a)*.65],.006,S.alu))}}},
 {id:'paddle',n:'Paddle wheel',y:'1959',job:'magnetosphere',size:'0.66 m + paddles',tags:['small','sphere','checker paint','paddles'],why:'A small ball painted in black and white checks for its temperature, power from four paddles of cells unfolded after launch. Real: Explorer 6.',
  b:g=>{const s=new THREE.Mesh(new THREE.SphereGeometry(.33,32,16),checkM(8,4));g.add(s);g.add(cyl(.14,.3,S.alu,[0,-.4,0]));
   for(let i=0;i<4;i++){const a=i*Math.PI/2,c=Math.cos(a),sn=Math.sin(a);g.add(rod([c*.3,.1,sn*.3],[c*.75,.45,sn*.75],.012,S.strut));const p=box(.5,.5,.02,cellM(2,2),[c*1.05,.55,sn*1.05]);p.rotation.y=-a+Math.PI/2;g.add(p)}}},
 {id:'faceted',n:'Faceted ball',y:'1962',job:'TV relay',size:'0.88 m',tags:['small','faceted sphere','cell skin','antenna belt'],why:'Cells on every facet, so it powers whichever way it spins; a belt of small antennas round its middle; a helix on top. Real: Telstar.',
  b:g=>{const m=new THREE.Mesh(new THREE.IcosahedronGeometry(.44,1),cellM(1,1));m.material.flatShading=true;g.add(m);g.add(cyl(.46,.08,S.alu,[0,0,0],0,24));
   for(let i=0;i<24;i++){const a=i/24*6.2832;g.add(box(.03,.05,.03,S.dgrey,[Math.cos(a)*.47,0,Math.sin(a)*.47]))}const h=helix(.04,.35,6,S.alu);h.position.set(0,.4,0);g.add(h)}},
 {id:'drum',n:'Weather drum',y:'1960',job:'cloud pictures',size:'1.07 × 0.56 m',tags:['drum (spinner)','cell skin','white top','camera'],why:'A hatbox spinning for stability: cells round its whole side, cameras looking out of the base as it rolls. Real: TIROS.',
  b:g=>{g.add(cyl(.54,.56,cellM(14,2),[0,0,0],0,18));g.add(cyl(.54,.02,S.white,[0,.29,0],0,18));g.add(cyl(.54,.02,S.alu,[0,-.29,0],0,18));g.add(cyl(.06,.1,S.lens,[.2,-.33,0]));g.add(cyl(.06,.1,S.lens,[-.2,-.33,0]));
   for(let i=0;i<4;i++){const a=i*Math.PI/2+.4;g.add(rod([Math.cos(a)*.4,.3,Math.sin(a)*.4],[Math.cos(a)*.75,.62,Math.sin(a)*.75],.008,S.alu))}}},
 {id:'spy',n:'Spy telescope',y:'1966',job:'reconnaissance',size:'1.5 × 6 m',tags:['tube','silver foil','sunshade','film capsule'],why:'Mostly a telescope: a long silver tube, an open black sunshade cut at an angle, film coming home in a capsule at the back. Real: KH-7 Gambit (simplified).',
  b:g=>{g.add(cyl(.75,4,S.silver,[0,0,0],[0,0,Math.PI/2]));const sh=mk(new THREE.CylinderGeometry(.78,.78,1.2,32,1,true),S.black,[2.6,0,0],[0,0,Math.PI/2]);sh.material=S.black.clone();sh.material.side=THREE.DoubleSide;g.add(sh);
   g.add(cyl(.62,.8,S.white,[-2.4,0,0],[0,0,Math.PI/2],24,.75));g.add(ball(.42,S.ablate,[-3.05,0,0]));g.add(cyl(.42,.4,S.ablate,[-2.85,0,0],[0,0,Math.PI/2]));
   for(const s of[1,-1]){const w=wing(1.6,.5,cellM(3,1));w.rotation.y=s>0?Math.PI/2:-Math.PI/2;w.position.set(-1.2,0,s*.75);g.add(w)}}},
 {id:'mariner',n:'Bus with bays',y:'1964',job:'planet flyby',size:'1.4 m bus, 6.9 m span',tags:['octagonal bus','gold foil bays','paddles, dish, boom','scan platform'],why:'An eight-sided bus whose faces are bays of electronics in gold foil, four paddles, a dish to home, a mast for the magnetometer, and the camera under it on a scan platform. Real: Mariner 4.',
  b:g=>{g.add(cyl(.69,.46,S.gold,[0,0,0],[0,Math.PI/8,0],8));for(let i=0;i<4;i++){const a=i*Math.PI/2,w=wing(2.4,.9,cellM(4,2));w.rotation.y=-a;w.position.set(Math.cos(a)*.7,0,Math.sin(a)*.7);g.add(w)}
   const d=dish(1.17,.18,S.white);d.position.set(0,.45,0);g.add(d);g.add(cyl(.03,.25,S.strut,[0,.3,0]));g.add(rod([0,.23,.3],[0,2.4,.3],.025,S.strut));g.add(ball(.07,S.white,[0,2.45,.3]));
   g.add(cyl(.03,.25,S.strut,[0,-.35,0]));g.add(box(.3,.18,.25,S.black,[0,-.55,0]));g.add(cyl(.05,.18,S.lens,[.06,-.6,.13],[Math.PI/2,0,0]))}},
 {id:'comsat',n:'Comsat box',y:'1980s',job:'TV and phone relay',size:'2 m box, 21 m span',tags:['box bus','gold foil','long wings','dish farm'],why:'A box held steady by wheels: long wings that turn to the sun, a farm of dishes on the face that looks at home. Real: the 1980s three-axis comsats (simplified).',
  b:g=>{g.add(box(2,2.3,2,S.gold));g.add(box(2.02,.4,2.02,S.white,[0,1.2,0]));for(const s of[1,-1]){g.add(rod([s,0,0],[s*2.2,0,0],.05,S.strut));const w=wing(8,2.2,cellM(6,2));w.position.set(s*2.2,0,0);if(s<0)w.rotation.y=Math.PI;g.add(w)}
   for(const [x,z,D,a] of[[.5,1.4,2.4,-.5],[-.6,1.3,1.8,.5],[0,1.5,1.2,0]]){const d=dish(D,D*.15,S.white);d.rotation.x=-Math.PI/2+.35;d.rotation.z=a*.3;d.position.set(x,-.2,z);g.add(d);g.add(rod([x*.6,-.4,.9],[x,-.3,z-.1],.03,S.strut))}
   g.add(box(.6,.6,.6,S.silver,[0,-1.45,0]))}},
 {id:'radar',n:'Radar plank',y:'1978',job:'ocean radar',size:'10.7 m antenna',tags:['plank antenna','silver foil','one wing','altimeter dish'],why:'Most of it is one flat radar antenna on struts, beside a bus that hardly shows; one wing; a dish looking straight down. Real: Seasat.',
  b:g=>{g.add(cyl(.75,3,S.silver,[0,0,0]));g.add(box(1.6,1.2,1.6,S.gold,[0,-1.9,0]));const p=box(10.7,2.16,.08,new THREE.MeshStandardMaterial({map:cvTex(256,64,(c)=>{c.fillStyle='#2a2d33';c.fillRect(0,0,256,64);c.strokeStyle='#9aa0a8';c.lineWidth=2;for(let i=0;i<=256;i+=32){c.beginPath();c.moveTo(i,0);c.lineTo(i,64);c.stroke()}},[1,1]),metalness:.5,roughness:.5}),[0,-1.9,2.3],[0,0,0]);
   p.rotation.x=-.35;g.add(p);g.add(rod([.6,-1.6,.8],[3,-1.9,2],.04,S.strut));g.add(rod([-.6,-1.6,.8],[-3,-1.9,2],.04,S.strut));const w=wing(5,1.8,cellM(4,2));w.position.set(.75,1,0);g.add(w);const d=dish(1,.15,S.white);d.rotation.x=Math.PI;d.position.set(0,-2.55,-.4);g.add(d)}},
 {id:'nav',n:'Navigation box',y:'1978',job:'navigation fix',size:'1.5 m box, 5.3 m span',tags:['box bus','white and gold','helix array','two wings'],why:'The face toward home carries a ring of helix antennas, the shape that says "navigation" at a glance. Real: GPS Block I.',
  b:g=>{g.add(box(1.5,1.9,1.5,S.white));g.add(box(1.52,.5,1.52,S.gold,[0,.6,0]));for(const s of[1,-1]){const w=wing(1.9,1.2,cellM(2,2));w.position.set(s*.75,0,0);if(s<0)w.rotation.y=Math.PI;g.add(w)}
   for(let i=0;i<12;i++){const a=i/12*6.2832,r=i<8?.5:.2,b2=i<8?a:a+.4;const h=helix(.045,.35,5,S.alu);h.rotation.x=Math.PI;h.position.set(Math.cos(b2)*r,-.95,Math.sin(b2)*r);g.add(h)}}},
 {id:'bigdish',n:'Big dish',y:'1974',job:'TV to villages',size:'9 m dish',tags:['mesh dish on a truss','bus at the focus','half-drum arrays'],why:'A 9 m gold mesh dish unfurled in orbit, the bus hanging at its focus on a truss, power from two half-cylinders of cells. Real: ATS-6.',
  b:g=>{const d=dish(9,1.6,meshM,64);d.rotation.x=Math.PI;d.position.set(0,2.6,0);g.add(d);g.add(cyl(4.5,.08,S.strut,[0,1.0,0],0,48));
   g.add(truss([0,1,0],[0,-.9,0],.9,S.strut));g.add(box(1.4,1.2,1.4,S.gold,[0,-1.5,0]));for(const s of[1,-1]){g.add(rod([0,1.2,0],[s*3.6,1.4,0],.05,S.strut));const h=mk(new THREE.CylinderGeometry(.75,.75,2,24,1,true,0,Math.PI),cellM(4,1),[s*4.2,1.4,0]);h.material.side=THREE.DoubleSide;g.add(h)}}},
 {id:'gg',n:'Gravity boom',y:'1963',job:'looks down, no power to point',size:'0.5 m + 18 m boom',tags:['tiny box','checker paint','gravity-gradient boom'],why:'A small box that points at the ground with no computer at all: a long boom with a weight on its tip, which gravity pulls straight up. Real: TRAAC, the DODGE satellites.',
  b:g=>{g.add(box(.5,.4,.5,checkM(2,2)));for(const s of[1,-1]){const p=box(.5,.36,.02,cellM(2,1),[0,0,s*.26]);g.add(p)}g.add(rod([0,.2,0],[0,18,0],.02,S.alu));g.add(ball(.12,S.dgrey,[0,18.1,0]));g.add(cyl(.05,.2,S.lens,[0,-.3,0]))}},
 {id:'truss',n:'Truss explorer',y:'1997',job:'outer planets',size:'4 m dish, 6.8 m tall',tags:['open truss','gold and black foil','RTG on a boom','radiator fins'],why:'Late: no bus at all, an open frame carrying a big dish, gold and black blankets, a nuclear power source on a boom with its fins, a magnetometer mast. Real: Cassini, Galileo (simplified).',
  b:g=>{g.add(truss([0,-2,0],[0,1.8,0],1.1,S.strut));g.add(box(1,1.6,1,S.gold,[0,-.8,0]));g.add(cyl(.6,1.4,new THREE.MeshStandardMaterial({color:'#1b1c20',metalness:.6,roughness:.4,bumpMap:crinkle,bumpScale:.015}),[0,.7,0],0,24));
   const d=dish(4,.6,S.white);d.position.set(0,2,0);g.add(d);for(const s of[1,-1]){g.add(rod([s*.55,-1.6,0],[s*1.9,-2.1,0],.04,S.strut));const r=cyl(.2,1.1,S.dgrey,[s*2.1,-2.1,0],[0,0,Math.PI/2],16);g.add(r);for(let k=0;k<6;k++){const a=k/6*6.2832;g.add(box(.9,.02,.16,S.dgrey,[s*2.1,-2.1+Math.cos(a)*.27,Math.sin(a)*.27],[a,0,0]))}}
   g.add(rod([0,-.6,.5],[0,-.6,7],.02,S.alu));g.add(box(.18,.18,.18,S.white,[0,-.6,7]));g.add(box(.9,.02,1.2,S.white,[-.9,-1.7,.4]))}},
 {id:'today',n:'Today\'s satellite',y:'v1.18x',job:'the game now',size:'1.25 m stack',tags:['cylinders on one axis','one grey','wings, side boxes'],today:true,why:'What the builder makes today from the octagonal frame, the instrument package, side boxes and a pair of wings: round parts on one axis, the stack\'s width, one painted finish. The parts are fine; the sameness is scale, shape and skin.',
  b:g=>{g.add(cyl(.4,1,S.paint,[0,0,0],[0,Math.PI/8,0],8));g.add(cyl(.625,.8,S.paint,[0,.9,0]));g.add(cyl(.0,.4,S.paint,[0,1.5,0],0,24,.625));g.add(cyl(.625,.25,S.dgrey,[0,-.62,0]));
   for(const s of[1,-1]){const w=wing(3,1,cellM(3,1));w.position.set(s*.42,.1,0);if(s<0)w.rotation.y=Math.PI;g.add(w)}g.add(box(.3,.4,.25,S.paint,[0,0,.5]));g.add(box(.3,.3,.25,S.paint,[0,.1,-.5]));g.add(rod([0,1.6,0],[0,2.4,0],.01,S.alu))}},
];
// ---- three: one renderer, each craft drawn in its own cell
const cvs=document.getElementById('cv'),ren=new THREE.WebGLRenderer({canvas:cvs,antialias:true,preserveDrawingBuffer:true});ren.setPixelRatio(1);ren.setSize(1280,800,false);
ren.outputEncoding=THREE.sRGBEncoding;ren.toneMapping=THREE.ACESFilmicToneMapping;ren.toneMappingExposure=.78;
const scene=new THREE.Scene();
// the environment the metals reflect: black space above, a blue planet below, the sun
{const es=new THREE.Scene();es.add(new THREE.Mesh(new THREE.SphereGeometry(50,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,vertexShader:'varying vec3 p;void main(){p=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'varying vec3 p;void main(){float y=normalize(p).y;vec3 c=y<-.05?mix(vec3(.12,.22,.38),vec3(.25,.4,.6),smoothstep(-.05,-.6,y)):mix(vec3(.35,.5,.75),vec3(.01,.012,.02),smoothstep(-.05,.15,y));gl_FragColor=vec4(c,1.);}'})));
  const sun=new THREE.Mesh(new THREE.SphereGeometry(3,16,8),new THREE.MeshBasicMaterial({color:new THREE.Color(30,28,25)}));sun.position.set(30,25,20);es.add(sun);
  if(Q.get("env")){const pm=new THREE.PMREMGenerator(ren);scene.environment=pm.fromScene(es,.02).texture}}
const sunL=new THREE.DirectionalLight('#fff6ea',2.6);sunL.position.set(30,25,20);scene.add(sunL);scene.add(new THREE.HemisphereLight('#2a3348','#3d6aa0',.7));{const e=new THREE.DirectionalLight('#5b8fd0',.9);e.position.set(-5,-30,-8);scene.add(e);const r=new THREE.DirectionalLight('#ffffff',.6);r.position.set(-20,8,-25);scene.add(r)}   // earthshine from below, a rim from behind
const human=()=>{const g=new THREE.Group(),m=new THREE.MeshStandardMaterial({color:'#d8551c',roughness:.7});g.add(cyl(.18,1.05,m,[0,.85,0],0,12));g.add(ball(.13,m,[0,1.52,0]));g.add(cyl(.07,.75,m,[.09,.37,0],0,8));g.add(cyl(.07,.75,m,[-.09,.37,0],0,8));return g};   // 1.8 m, for scale
for(const s of SATS){const g=new THREE.Group();s.b(g);const bb=new THREE.Box3().setFromObject(g);const c=bb.getCenter(V());g.position.sub(c);const w=new THREE.Group();w.add(g);
  const h=human(),sz=bb.getSize(V());h.position.set(-sz.x/2-.6-Math.max(0,.2*sz.x),-sz.y/2,0);s.human=h;w.add(h);
  const b2=new THREE.Box3().setFromObject(w);s.R=b2.getBoundingSphere(new THREE.Sphere()).radius;s.c=b2.getCenter(V());s.g=w;w.visible=false;scene.add(w)}
const cam=new THREE.PerspectiveCamera(30,1,.05,500);
let one=Q.get('sat'),az=+(Q.get('az')||40),el=18;
const CELLS=[];   // 4 × 4: the intro takes the first two cells
SATS.forEach((s,i)=>{const k=i+2,cx=k%4,cy=k/4|0;CELLS.push({s,x:cx*320,y:cy*200,w:320,h:200})});
function frame(s,w,h,azd,eld){const f=cam.fov*Math.PI/360,R=s.R*1.02,d=R/Math.sin(Math.min(f,f*w/h))*1.05,a=azd*Math.PI/180,e=eld*Math.PI/180;
  cam.aspect=w/h;cam.position.set(s.c.x+d*Math.cos(e)*Math.cos(a),s.c.y+d*Math.sin(e),s.c.z+d*Math.cos(e)*Math.sin(a));cam.lookAt(s.c);cam.near=d/50;cam.far=d*4;cam.updateProjectionMatrix()}
function draw(){ren.setScissorTest(true);ren.setClearColor('#05070c');ren.setViewport(0,0,1280,800);ren.setScissor(0,0,1280,800);ren.clear();
  if(one){const s=SATS.find(x=>x.id===one);s.g.visible=true;s.human.visible=true;frame(s,1280,800,az,el);ren.setViewport(0,0,1280,800);ren.setScissor(0,0,1280,800);ren.render(scene,cam);s.g.visible=false;return}
  for(const c of CELLS){c.s.g.visible=true;frame(c.s,c.w,c.h,az,el);const y=800-c.y-c.h;ren.setViewport(c.x,y,c.w,c.h);ren.setScissor(c.x,y,c.w,c.h);ren.setClearColor(c.s.today?'#140f08':'#070a10');ren.clear();ren.render(scene,cam);c.s.g.visible=false}}
// ---- labels
const app=document.getElementById('app');
const intro=document.createElement('div');intro.className='intro';intro.style.left='0';intro.style.top='0';
intro.innerHTML=`<h1>SATELLITES THAT DON'T LOOK ALIKE</h1>Thirteen craft built only from proposed parts and skins, against <b style="color:var(--warn)">today's</b> (bottom right). Four directions at once:
<br>1. <b>Smaller parts</b>: 0.3 and 0.6 m stacks, a kick motor (the figure is 1.8 m).
<br>2. <b>Bus shapes</b>: sphere, faceted ball, spin drum, bus with bays, box, open truss, each from a job.
<br>3. <b>Skins</b>: polished metal, gold and silver foil, cells as skin, white paint, thermal checks; cheap, by era and school.
<br>4. <b>Signature appendages</b>: whips, paddles, sunshade tube, dish farm, radar plank, helix ring, mesh dish, gravity boom.
<div class="key" style="margin-top:6px"><span><i style="background:#e6e6e6"></i>polished</span><span><i style="background:#d9a441"></i>gold foil</span><span><i style="background:#d4d8dc"></i>silver foil</span><span><i style="background:#1d2a55"></i>cells</span><span><i style="background:#efeee9"></i>white</span><span><i style="background:linear-gradient(90deg,#141414 50%,#ecebe6 50%)"></i>checks</span></div>`;
app.insertBefore(intro,document.getElementById('one'));
for(const c of CELLS){const d=document.createElement('div');d.className='cell'+(c.s.today?' today':'');d.style.left=c.x+'px';d.style.top=c.y+'px';
  d.innerHTML=`<div class="n">${c.s.n} <span style="color:var(--dim);font-weight:normal">${c.s.y}</span></div><div class="t">${c.s.size} · ${c.s.tags.map((t,i)=>i===0?`<i>${t}</i>`:t).join(' · ')}</div>`;
  d.onclick=()=>{one=c.s.id;show()};c.el=d;app.insertBefore(d,document.getElementById('one'))}
function show(){const o=document.getElementById('one');document.querySelectorAll('.cell,.intro').forEach(e=>e.style.display=one?'none':'');
  if(one){const s=SATS.find(x=>x.id===one);o.style.display='block';o.innerHTML=`<span class="back" id="bk">✕ all</span><h2>${s.n}</h2><div style="color:var(--dim)">${s.y} · ${s.job} · ${s.size}</div><p>${s.why}</p><div>Shows: <ul>${s.tags.map(t=>`<li>${t}</li>`).join('')}</ul></div><p style="color:var(--dim)">drag to turn</p>`;document.getElementById('bk').onclick=()=>{one=null;show()}}
  else o.style.display='none';draw()}
let drag=null;cvs.onpointerdown=e=>{if(!one)return;drag=[e.clientX,e.clientY];cvs.setPointerCapture(e.pointerId)};cvs.onpointerup=()=>drag=null;
cvs.onpointermove=e=>{if(!drag)return;az+=(e.clientX-drag[0])*.4;el=Math.max(-80,Math.min(80,el+(e.clientY-drag[1])*.3));drag=[e.clientX,e.clientY];draw()};
show();
</script>
