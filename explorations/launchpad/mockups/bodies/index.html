<title>Body mock-ups</title>
<!-- Launchpad mock-up for SYSTEM.md (QUEUE Q71): a still per body from its look brief, for Caio to pick from pictures and
     for the sky & bodies beat to build from (Q80–Q85). A standalone page: never loaded by index.html. One fragment
     shader: a lit sphere with procedural colour, a haze limb, plumes, and Hyperion's rings with shadows both ways.
     ?view=<key> picks a still (the bar does the same).
     Round 2 (QUEUE Q207, SYSTEM.md 1.1.0 § "Look, round 2"): body ids 10+ in shade2(), with relief from height functions
     (Enyo), a raymarched lumpy body (Astraea), structured rings and seasons (Hyperion), plume curtains (Eos), a glint
     (Tethys), backlit haze and a companion (Erebus, Aether). Round 1 stays under the r1-* keys for comparison. -->
<style>
  :root { --bg: #05070b; --fg: #e7e9ee; --dim: #8b93a3; --acc: #f2b84b; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #bar { position: fixed; top: 8px; left: 8px; right: 8px; display: flex; gap: 5px; flex-wrap: wrap; align-items: center;
    background: rgba(5, 7, 11, .78); padding: 6px 8px; border-radius: 6px; }
  #bar button { background: #1b2029; color: var(--fg); border: 1px solid #333b48; border-radius: 4px; padding: 3px 8px; cursor: pointer; }
  #bar button.on { border-color: var(--acc); color: var(--acc); }
  #bar .lbl { color: var(--dim); margin: 0 2px 0 6px; }
  #bar button.r1 { opacity: .6; font-size: 11px; }
  #cap { position: fixed; left: 12px; bottom: 10px; right: 12px; color: var(--dim); text-shadow: 0 1px 2px #000; }
  body.still #bar { display: none; }
</style>
</head>

const Q = new URLSearchParams(location.search);
let view = Q.get('view') || 'hesper'; if (!VIEWS[view]) view = 'hesper'; if (Q.has('still')) document.body.classList.add('still');
const bar = document.getElementById('bar');

lbl('round 2');
for (const k in R2) { const b = document.createElement('button'); b.textContent = k; b.dataset.v = k; bar.appendChild(b); }
lbl('round 1');
for (const k in R1) { const b = document.createElement('button'); b.textContent = k; b.dataset.v = 'r1-' + k; b.className = 'r1'; bar.appendChild(b); }
bar.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { view = b.dataset.v; draw(); } });
const cv = document.getElementById('c'), gl = cv.getContext('webgl2', { preserveDrawingBuffer: true });
const VS = `#version 300 es
in vec2 p;out vec2 v;void main(){v=p;gl_Position=vec4(p,0.,1.);}`;
const FS = `#version 300 es
precision highp float;in vec2 v;out vec4 o;
uniform vec2 uRes;uniform vec3 uCam,uSun,uTgt,uUp;uniform float uFov;uniform int uB;
float h3(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float vn(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);
 return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x),mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x),f.y),
  mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x),mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec3 p){float a=.5,s=0.;for(int i=0;i<6;i++){s+=a*vn(p);p=p*2.03+vec3(1.7,9.2,3.1);a*=.5;}return s;}
// craters: cells on the sphere, each with a random bowl and rim; returns (shade, rim)
vec2 craters(vec3 n,float sc,float dens){vec3 p=n*sc,i=floor(p);float sh=0.,rim=0.;
 for(int x=-1;x<=1;x++)for(int y=-1;y<=1;y++)for(int z=-1;z<=1;z++){vec3 c=i+vec3(x,y,z),j=c+vec3(h3(c),h3(c+7.1),h3(c+3.3));
  if(h3(c+11.)>dens)continue;float r=.25+.35*h3(c+5.),d=length(p-j)/r;sh+=(1.-smoothstep(.0,1.,d))*.35;rim+=exp(-pow((d-1.)*6.,2.));}
 return vec2(sh,rim);}
vec3 rotY(vec3 p,float a){float c=cos(a),s=sin(a);return vec3(c*p.x+s*p.z,p.y,-s*p.x+c*p.z);}
vec3 rotX(vec3 p,float a){float c=cos(a),s=sin(a);return vec3(p.x,c*p.y-s*p.z,s*p.y+c*p.z);}
// the body's colour at the unit normal n (body frame)
vec3 surf(int b,vec3 n){
 if(b==0){float f=fbm(n*3.);return mix(vec3(.93,.85,.62),vec3(.98,.93,.76),f*.6+.2*n.y);}   // Hesper: almost featureless
 if(b==1){float lat=n.y,lon=atan(n.z,n.x),chev=sin(lat*9.+abs(lon-.3)*3.2+fbm(n*4.)*2.);   // Hesper in UV: chevrons opening west
  return mix(vec3(.55,.62,.82),vec3(.95,.97,1.),.5+.4*chev*(1.-abs(lat)));}
 if(b==2){float f=fbm(n*2.6),g=fbm(n*7.+3.);vec3 c=mix(vec3(.72,.45,.26),vec3(.86,.62,.38),f);
  c=mix(c,vec3(.32,.22,.18),smoothstep(.55,.7,fbm(n*2.+9.)));   // dark basalt
  float lon=atan(n.z,n.x),can=exp(-pow((n.y+.12+.05*sin(lon*3.))/.025,2.))*smoothstep(.2,-.9,lon)*smoothstep(-2.6,-1.6,lon);c*=1.-.55*can;   // the canyon
  float vol=length(n-normalize(vec3(.3,.35,.88)));c=mix(c,vec3(.55,.36,.25),smoothstep(.2,.1,vol));c*=1.-.35*smoothstep(.03,.0,abs(vol-.15));   // the shield volcano
  c=mix(c,vec3(.95,.95,.97),smoothstep(.86,.9,abs(n.y)+.03*g));return c*(.85+.3*g);}   // polar caps
 if(b==3){vec2 k=craters(n,6.,.6)+craters(n,15.,.5)*.6;vec3 c=vec3(.27,.27,.27)*(.75+.5*fbm(n*5.))*(1.-.6*k.x)+.08*k.y;
  float sp=length(n-normalize(vec3(.25,.3,.92)));c=mix(c,vec3(.95,.95,.92),smoothstep(.06,.02,sp)*(.6+.4*vn(n*80.)));return c;}   // the salt spot
 if(b==4){float lat=n.y+.04*fbm(n*6.),bnd=sin(lat*21.+fbm(n*3.)*1.2);vec3 c=mix(vec3(.84,.68,.46),vec3(.96,.9,.78),.5+.5*bnd);
  c=mix(c,vec3(.68,.46,.3),smoothstep(.5,.9,sin(lat*7.+1.))*.5);   // ochre belts
  vec3 sp=n-normalize(vec3(.35,-.36,.86));float e=length(sp*vec3(1.,2.2,1.));c=mix(c,vec3(.78,.36,.24),smoothstep(.13,.08,e));c*=1.-.15*smoothstep(.15,.13,e);return c;}   // the storm spot
 if(b==6){float f=fbm(n*5.),g=fbm(n*11.+2.);vec3 c=mix(vec3(.85,.78,.35),vec3(.92,.88,.6),f);c=mix(c,vec3(.7,.35,.15),smoothstep(.62,.72,g));
  c=mix(c,vec3(.08,.06,.05),smoothstep(.74,.8,fbm(n*8.+5.)));return c;}   // Theia: sulphur, red, black calderas
 if(b==7){float f=fbm(n*4.);vec3 c=vec3(.9,.9,.92)*(.9+.15*f);float cr=0.;for(int i=0;i<4;i++){vec3 a=normalize(vec3(h3(vec3(i))-.5,h3(vec3(i)+2.)-.5,h3(vec3(i)+5.)-.5));
   cr=max(cr,exp(-pow(dot(n,a)/.012,2.))*(.5+.5*fbm(n*20.+float(i))));}c=mix(c,vec3(.55,.32,.22),cr);   // Eos: lineae
  c=mix(c,vec3(.75,.85,.95),smoothstep(-.75,-.9,n.y)*.4);return c;}
 if(b==8){float f=fbm(n*2.);return mix(vec3(.8,.52,.22),vec3(.88,.62,.3),f*.5+.2*n.y);}   // Tethys: haze top
 if(b==9){float f=fbm(n*3.);vec3 c=mix(vec3(.82,.68,.6),vec3(.9,.8,.72),f);
  vec3 q=n-normalize(vec3(.32,.05,.95));float hrt=length(q*vec3(1.,1.3,1.))-.42+.08*cos(atan(q.y,q.x)*2.);   // the heart-shaped basin
  c=mix(c,vec3(.98,.95,.93),smoothstep(.02,-.02,hrt));c=mix(c,vec3(.35,.18,.12),smoothstep(.5,.65,fbm(n*2.5+4.))*smoothstep(.0,.08,hrt)*smoothstep(.3,-.3,n.y));return c;}
 return vec3(.5);}
vec2 sph(vec3 ro,vec3 rd,float r){float b=dot(ro,rd),c=dot(ro,ro)-r*r,h=b*b-c;if(h<0.)return vec2(-1.);h=sqrt(h);return vec2(-b-h,-b+h);}
vec3 stars(vec3 d){vec3 p=d*300.,i=floor(p);float s=h3(i);return vec3(.8,.85,1.)*step(.9975,s)*(.4+.6*h3(i+1.))*.8;}
// Hyperion's rings, in the planet's tilted frame: (y = 0 plane) radii 1.3–2.2 with gaps; returns opacity
float ringA(float r){if(r<1.3||r>2.2)return 0.;float a=.55+.35*sin(r*55.)*sin(r*13.);a*=1.-smoothstep(.015,0.,abs(r-1.95)-.0)*.85;   // the big gap
 a*=smoothstep(1.3,1.36,r)*smoothstep(2.2,2.12,r);return clamp(a,0.,.95);}
vec3 shade(int b,vec3 ro,vec3 rd,out float hitT){
 vec3 col=stars(rd);hitT=-1.;float tilt=b==4?radians(27.):0.;
 vec3 S=uSun;
 // a plume (Theia, Eos): a fan over a point near the limb
 vec2 hs=sph(ro,rd,1.);
 if(hs.x>0.){vec3 p=ro+rd*hs.x,n=normalize(p),nb=rotY(n,.6);hitT=hs.x;
  vec3 al=surf(b,nb);float dl=max(dot(n,S),0.);
  if(b==4){vec3 pl=rotX(p,tilt);vec3 sl=rotX(S,tilt);float t=-pl.y/sl.y;if(t>0.){vec3 q=pl+sl*t;dl*=1.-.8*ringA(length(q.xz));}}   // ring shadow on the clouds
  float term=b==4||b==0||b==8?smoothstep(-.05,.25,dot(n,S)):1.;   // thick air softens the terminator
  col=al*(dl*mix(1.,term,.5))*1.15+al*.015;
  if(b==8)col*=vec3(1.,.9,.75);}
 // haze limbs
 float hz=b==0?.05:b==2?.025:b==8?.12:b==4?.03:0.;
 if(hz>0.){float cd=length(cross(ro,rd)),tt=-dot(ro,rd);if(tt>0.&&cd>.98&&(hs.x<0.||true)){float x=(cd-1.)/hz,dens=exp(-max(x,0.)*2.5)*step(-.02,x);
   vec3 hc=b==0?vec3(.95,.88,.65):b==2?vec3(.85,.6,.45):b==8?vec3(.95,.62,.28):vec3(.9,.85,.75);
   vec3 cp=ro+rd*tt;float lit=smoothstep(-.3,.4,dot(normalize(cp),S));col+=hc*dens*lit*(hs.x<0.?.9:.25);}
  if(b==8){float x=(cd-1.055)/.008,ly=exp(-x*x);vec3 cp=ro+rd*max(tt,0.);col+=vec3(.45,.6,.95)*ly*.5*smoothstep(-.4,.5,dot(normalize(cp),S));}}   // the detached blue layer
 // plumes
 if(b==6||b==7){vec3 base=normalize(b==6?vec3(-.86,.28,.42):vec3(-.3,-.88,.36)),tip=base*(b==6?1.22:1.18);
  vec3 ba=tip-base,pa=ro-base;float tt=max(0.,-dot(ro,rd));vec3 cp=ro+rd*tt;
  for(int i=0;i<24;i++){float s=float(i)/23.;vec3 q=base+ba*s;vec3 w=ro+rd*dot(q-ro,rd);float d=length(w-q),wd=.02+.12*s;
   float occl=(hs.x>0.&&dot(q-ro,rd)>hs.x)?0.:1.;col+=(b==6?vec3(.55,.62,.9):vec3(.85,.92,1.))*exp(-d*d/(wd*wd))*(1.-s)*.07*occl;}}
 // rings: drawn where the ray crosses the plane, in front of the planet or beside it; lit, with the planet's shadow
 if(b==4){vec3 rl=rotX(ro,tilt),dl=rotX(rd,tilt),sl=rotX(S,tilt);float t=-rl.y/dl.y;
  if(t>0.&&(hs.x<0.||t<hs.x)){vec3 q=rl+dl*t;float r=length(q.xz),a=ringA(r);
   if(a>0.){float lit=sph(q,sl,1.).x>0.?.06:1.;vec3 rc=mix(vec3(.82,.74,.6),vec3(.95,.9,.8),.5+.5*sin(r*90.))*lit*(.35+.65*abs(sl.y));col=mix(col,rc,a);}}}
 // Enyo's Pavor: a small dark potato in front
 if(b==2){vec3 pc=vec3(.55,.42,1.25);vec3 rr=(ro-pc)/vec3(.07,.05,.055),dd=rd/vec3(.07,.05,.055);float bb=dot(rr,dd),cc=dot(rr,rr)-1.,aa=dot(dd,dd),h=bb*bb-aa*cc;
  if(h>0.){float t=(-bb-sqrt(h))/aa;if(t>0.&&(hs.x<0.||t<hs.x)){vec3 p=ro+rd*t,n=normalize((p-pc)/vec3(.0049,.0025,.003));vec2 k=craters(n,5.,.7);
   col=vec3(.23,.21,.2)*(max(dot(n,S),0.)*1.1+.03)*(1.-.5*k.x)+.03*k.y;}}}
 return col;}
// ===== Round 2 (Q207): shade2() and its bodies, ids 10+ =====
float lum(vec3 c){return dot(c,vec3(.3,.59,.11));}
mat3 basis(vec3 a){vec3 t=normalize(cross(a,abs(a.y)<.95?vec3(0.,1.,0.):vec3(1.,0.,0.)));return mat3(t,cross(a,t),a);}   // columns: t1, t2, a
// cells: (distance to the nearest centre, gap to the second = edges, the cell's hash)
vec3 vor(vec3 p){vec3 i=floor(p),f=fract(p);float d1=8.,d2=8.,id=0.;
 for(int x=-1;x<=1;x++)for(int y=-1;y<=1;y++)for(int z=-1;z<=1;z++){vec3 g=vec3(x,y,z),c=i+g,r=g+vec3(h3(c),h3(c+7.1),h3(c+3.3))-f;float d=dot(r,r);
  if(d<d1){d2=d1;d1=d;id=h3(c+1.9);}else if(d<d2)d2=d;}
 return vec3(sqrt(d1),sqrt(d2)-sqrt(d1),id);}
// --- Hesper ---
vec3 hesperDay(vec3 n){
 float lat=asin(clamp(n.y,-1.,1.)),lon=atan(n.z,n.x),s=lon-1.75;
 float op=.42*max(0.,tanh(-s*1.6)),d=abs(abs(lat)-op);   // the sideways Y: a stem on the equator that forks into two arms
 float y=exp(-d*d/.012)*smoothstep(-2.3,-1.3,s)*smoothstep(1.3,.5,s)*(.7+.6*fbm(n*5.));
 float c=lat-.3*sin(lon-1.75)*tanh(lat*8.);   // streaks bend into chevrons
 float st=fbm(vec3(n.x*2.,c*16.,n.z*2.))-.5;
 float r=1.5708-abs(lat),ph=atan(n.z,n.x);
 float sw=sin(2.*ph*sign(n.y)+r*16.+fbm(n*6.)*3.)*smoothstep(.75,.3,r);   // a two-armed swirl at each pole
 float col=exp(-pow((r-.52)/.07,2.));   // the cold collar round it
 vec3 o=mix(vec3(.96,.92,.81),vec3(.8,.71,.55),clamp(y*.6+st*.4*(1.-smoothstep(.9,1.2,abs(lat)))+sw*.13,0.,1.));
 return o*(1.+.06*col);}
vec3 hesperGlow(vec3 n,float mu){
 float lat=asin(clamp(n.y,-1.,1.));
 float op=smoothstep(.45,.7,fbm(vec3(n.x*1.1,lat*11.,n.z*1.1)+fbm(n*3.)*1.2));   // zonal cloud bands
 float fil=.75*smoothstep(.09,.0,abs(fbm(vec3(n.x*4.,lat*16.,n.z*4.)+fbm(n*5.)*2.)-.5));   // dark filaments: thin, zonal
 float cool=smoothstep(.55,.72,fbm(n*1.7+7.));   // highlands are cooler, so darker
 return vec3(.42,.07,.025)*(1.-.8*max(op*.8,fil))*(1.-.45*cool)*(.3+.7*mu);}
// --- Enyo ---
