<title>Suit mock-ups</title>
<!-- Launchpad mock-up for CREW.md § "The suit brief, round 2" (QUEUE Q219; round 1 was Q199, "too samey"): the stylised
     human (W19) in each school's suit line, Cape and Steppe, early / middle / late / spacewalk. Each suit is built from
     its own pieces (helmets, torsos, props), not one body recoloured: Cape is hard shells, gloss and metal, hoses into the
     chest; Steppe is canvas, laces and hoods, hoses into the belly and a ventilator case carried by hand. Same raymarcher
     as the crew mock-up (mockups/crew/, Q72). A standalone page: never loaded by index.html.
     Round 3 (Q226, CREW.md 0.2.7) adds the other five schools: Arsenal, Coastal, Mountain, Isle, Foundry; each school group
     compiles its own shader program (#if SCH). ?school=… or ?suit=cape-early|…|foundry-surface &role=pilot|scientist|engineer &pose=stand|walk &shot=pad|close|front|back
     &sheet=lineup|all|sil|grey|thumb (the brief's checks, every school) &still (hides the bar). -->
<style>
  :root { --bg: #0e1116; --fg: #e7e9ee; --dim: #8b93a3; --acc: #f2b84b; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #sh { position: fixed; inset: 0; display: none; background: #f4f2ee; }
  body.sheet #sh { display: block; }
  body.sheet #c { position: fixed; left: 0; top: 0; visibility: hidden; width: auto; height: auto; }
  #bar { position: fixed; top: 8px; left: 8px; right: 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
    background: rgba(14, 17, 22, .8); padding: 6px 8px; border-radius: 6px; z-index: 2; }
  #bar button { background: #222833; color: var(--fg); border: 1px solid #39414f; border-radius: 4px; padding: 3px 8px; cursor: pointer; }
  #bar button.on { border-color: var(--acc); color: var(--acc); }
  #bar .sep { width: 1px; height: 20px; background: #39414f; margin: 0 3px; }
  #cap { color: var(--dim); flex-basis: 100%; }
  body.still #bar { display: none; }
</style>

const VS = `#version 300 es
in vec2 p;out vec2 v;void main(){v=p;gl_Position=vec4(p,0.,1.);}`;
const FS = `#version 300 es
precision highp float;in vec2 v;out vec4 o;
uniform vec2 uRes;uniform vec3 uCam,uTgt;uniform float uFov;
uniform int uS;uniform float uPose,uStudio,uSil,uHelmR;uniform vec4 uFace,uBody;
uniform vec3 uC1,uC2,uBootC,uGloveC,uShell,uAcc,uStripe;
// ZERO is 0 but not a constant, so the compiler keeps loops as loops: Windows' HLSL compiler (via ANGLE) unrolls and
// inlines everything otherwise, and the first draw took ~90 s to compile
#define ZERO min(uS,0)
const vec3 SUN=normalize(vec3(-.55,.75,.6));
const float HEAD=.13,YAW=.35,PI=3.14159;
const vec3 A=vec3(.75,0.,.05),SKIN=vec3(.95,.76,.6),HAIR=vec3(.36,.2,.09);
// ---- primitives
float sdBox(vec3 p,vec3 b){vec3 q=abs(p)-b;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.);}
float sdRBox(vec3 p,vec3 b,float r){return sdBox(p,b-r)-r;}
float sdCap(vec3 p,vec3 a,vec3 b,float r){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h)-r;}
float limb(vec3 p,vec3 a,vec3 b,float ra,float rb,out float h){vec3 pa=p-a,ba=b-a;h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h)-mix(ra,rb,h);}
float sdEll(vec3 p,vec3 r){float k0=length(p/r),k1=length(p/(r*r));return k0*(k0-1.)/k1;}
float sdCone(vec3 p,float h,float r1,float r2){vec2 q=vec2(length(p.xz),p.y),k1=vec2(r2,h),k2=vec2(r2-r1,2.*h);

    const zf = Math.max(1, Math.min(3, Math.floor(((innerHeight - 58) / ERAS.length - 4) / 56), Math.floor(((innerWidth - 64) / COLS.length - 57) / 45)));   // as much enlargement as the cells allow
    await grid(`Check 3: 48 px tall, as crew lists show them (left: true size; right: the same pixels ×${zf})`, gen, async (k, x, y, cw, ch) => {
      const t = await tile({ suit: k, role, pose: 'stand', shot: 'front', d: 3.4 }, 320, 400, gen);   // the figure fills ~85% of the tile's height
      const s = shrink(t, Math.round(48 / .85 * .8), Math.round(48 / .85)), w = s.width * (zf + 1) + 6, x0 = x + (cw - w) / 2, y0 = y + (ch - s.height * zf) / 2;
      cx.drawImage(s, x0, y0 + s.height * zf - s.height);
      cx.imageSmoothingEnabled = false; cx.drawImage(s, x0 + s.width + 6, y0, s.width * zf, s.height * zf); cx.imageSmoothingEnabled = true; });
  }
}
function bar() {
  document.getElementById('schools').innerHTML = Object.entries(SCHOOLS).map(([k, n]) => `<button data-school="${k}">${n}</button>`).join('');
  document.getElementById('suits').innerHTML = suitsOf(ST.school).map(k => `<button data-suit="${k}">${eraName(k)}</button>`).join('');
  document.querySelectorAll('#bar button').forEach(b => b.classList.toggle('on', ST.sheet ? b.dataset.sheet === ST.sheet || b.dataset.role === ST.role || b.dataset.school === ST.school && ST.sheet === 'lineup'
    : b.dataset.school === ST.school || b.dataset.suit === ST.suit || b.dataset.role === ST.role || b.dataset.pose === ST.pose || b.dataset.shot === ST.shot));
  const S = SUITS[ST.suit];
  document.getElementById('cap').textContent = ST.sheet ? (ST.sheet === 'lineup' ? `${SCHOOLS[ST.school]}: pick a suit to leave the sheet.`
    : 'The brief\'s checks, every school (CREW.md § "The suit brief, the other five schools"). Pick a suit to leave the sheet.')
    : `${S.name} (${S.real}): ${S.cap}. Signature: ${S.sig}. Stripe: ${ST.role}.`;
}
// draw() starts a new picture (cancelling one in progress); window.DRAWN resolves when it's finished (for stills)
function draw() {
  const gen = ++GEN; bar();
  document.body.classList.toggle('sheet', !!ST.sheet);
  const job = ST.sheet ? sheet(ST.sheet, gen)
    : (() => { const dpr = Math.min(1.5, devicePixelRatio || 1), s = Math.min(dpr, Math.sqrt(2.4e6 / (innerWidth * innerHeight)));   // at most ~2.4 Mpx
      return render(ST, Math.round(innerWidth * s), Math.round(innerHeight * s), gen); })();
  window.DRAWN = job.then(() => { window.FRAME_DONE = (window.FRAME_DONE || 0) + 1; return 'done'; }, e => { if (!(e instanceof Stale)) throw e; return 'stale'; });
}
// for stills: go({ suit, sheet, ... }) sets the view and waits for it
window.go = o => { Object.assign(ST, o); if (o.suit) ST.school = o.suit.split('-')[0]; draw(); return window.DRAWN; };
document.getElementById('bar').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.sheet) ST.sheet = b.dataset.sheet;
  else if (b.dataset.school) { const era = ST.suit.split('-')[1]; ST.school = b.dataset.school;
    ST.suit = SUITS[`${ST.school}-${era}`] ? `${ST.school}-${era}` : suitsOf(ST.school)[0]; if (ST.sheet !== 'lineup') ST.sheet = ''; }
  else { if (!b.dataset.role) ST.sheet = ''; for (const k of ['suit', 'role', 'pose', 'shot']) if (b.dataset[k]) ST[k] = b.dataset[k]; }
  draw(); });
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(draw, 250); });
draw();
</script>
