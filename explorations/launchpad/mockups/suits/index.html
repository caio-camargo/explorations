<!doctype html>

<head>
<meta charset="utf-8">

<title>Suit mock-ups</title>
<!-- Launchpad mock-up for CREW.md § "The suit brief, round 2" (QUEUE Q219; round 1 was Q199, "too samey"): the stylised
     human (W19) in each school's suit line, Cape and Steppe, early / middle / late / spacewalk. Each suit is built from
     its own pieces (helmets, torsos, props), not one body recoloured: Cape is hard shells, gloss and metal, hoses into the
     chest; Steppe is canvas, laces and hoods, hoses into the belly and a ventilator case carried by hand. Same raymarcher
     as the crew mock-up (mockups/crew/, Q72). A standalone page: never loaded by index.html.
     ?suit=cape-early|…|steppe-eva &role=pilot|scientist|engineer &pose=stand|walk &shot=pad|close|front|back
     &sheet=lineup|sil|grey|thumb (the brief's checks) &still (hides the bar). -->
<style>
  :root { --bg: #0e1116; --fg: #e7e9ee; --dim: #8b93a3; --acc: #f2b84b; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #sh { position: fixed; inset: 0; display: none; background: #f4f2ee; }
  body.sheet #sh { display: block; }
  body.sheet #c { position: fixed; left: 0; top: 0; visibility: hidden; width: auto; height: auto; }
  #bar { position: fixed; top: 8px; left: 8px; right: 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
    background: rgba(14, 17, 22, .8); padding: 6px 8px; border-radius: 6px; z-index: 2; }
  #bar button { background: #222833; color: var(--fg); border: 1px solid #39414f; border-radius: 4px; padding: 3px 8px; cursor: pointer; }
  #bar button.on { border-color: var(--acc); color: var(--acc); }
  #bar .sep { width: 1px; height: 20px; background: #39414f; margin: 0 3px; }
  #cap { color: var(--dim); flex-basis: 100%; }
  body.still #bar { display: none; }
</style>
</head>

  <span class="sep"></span>
  <button data-sheet="lineup">All eight</button><button data-sheet="sil">Check 1: silhouettes</button><button data-sheet="grey">Check 2: grey squint</button><button data-sheet="thumb">Check 3: 48 px</button>

    c1: [.3, .37, .28], c2: [.94, .5, .12], acc: [.94, .5, .12], boot: [.14, .15, .13], glove: [.24, .27, .21], shell: [.38, .45, .35],

    c1: [.93, .93, .9], c2: [.6, .62, .64], acc: [.8, .14, .1], boot: [.84, .84, .82], glove: [.76, .76, .74], shell: [.95, .95, .93],
    body: [1.35, 1.45, 1.5, .84], helmR: .19, face: [.135, .1, -.01, 3] },
};
const ORDER = Object.keys(SUITS);
// role stripes (CREW.md § The roles; D9 3): the colour round both upper arms, edged in ink so it reads on any suit
const ROLES = { pilot: [.16, .36, .85], scientist: [.18, .62, .3], engineer: [.95, .7, .1] };
const cv = document.getElementById('c'), gl = cv.getContext('webgl2', { preserveDrawingBuffer: true });
const VS = `#version 300 es
in vec2 p;out vec2 v;void main(){v=p;gl_Position=vec4(p,0.,1.);}`;
const FS = `#version 300 es
precision highp float;in vec2 v;out vec4 o;
uniform vec2 uRes;uniform vec3 uCam,uTgt;uniform float uFov;
uniform int uS;uniform float uPose,uStudio,uSil,uHelmR;uniform vec4 uFace,uBody;
uniform vec3 uC1,uC2,uBootC,uGloveC,uShell,uAcc,uStripe;
const vec3 SUN=normalize(vec3(-.55,.75,.6));
const float HEAD=.13,YAW=.35,PI=3.14159;
const vec3 A=vec3(.75,0.,.05),SKIN=vec3(.95,.76,.6),HAIR=vec3(.36,.2,.09);
// ---- primitives
float sdBox(vec3 p,vec3 b){vec3 q=abs(p)-b;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.);}
float sdRBox(vec3 p,vec3 b,float r){return sdBox(p,b-r)-r;}
float sdCap(vec3 p,vec3 a,vec3 b,float r){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h)-r;}
float limb(vec3 p,vec3 a,vec3 b,float ra,float rb,out float h){vec3 pa=p-a,ba=b-a;h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h)-mix(ra,rb,h);}
float sdEll(vec3 p,vec3 r){float k0=length(p/r),k1=length(p/(r*r));return k0*(k0-1.)/k1;}
float sdCone(vec3 p,float h,float r1,float r2){vec2 q=vec2(length(p.xz),p.y),k1=vec2(r2,h),k2=vec2(r2-r1,2.*h);
 vec2 ca=vec2(q.x-min(q.x,(q.y<0.)?r1:r2),abs(q.y)-h);vec2 cb=q-k1+k2*clamp(dot(k1-q,k2)/dot(k2,k2),0.,1.);
 float s=(cb.x<0.&&ca.y<0.)?-1.:1.;return s*sqrt(min(dot(ca,ca),dot(cb,cb)));}
float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
vec2 U(vec2 r,float d,float m){return d<r.x?vec2(d,m):r;}
// the astronaut's frame: stands at A facing +z, turned toward the camera by YAW
vec3 toL(vec3 p){vec3 q=p-A;float c=cos(YAW),s=sin(YAW);return vec3(c*q.x-s*q.z,q.y,s*q.x+c*q.z);}
vec3 dirL(vec3 d){float c=cos(YAW),s=sin(YAW);return vec3(c*d.x-s*d.z,d.y,s*d.x+c*d.z);}
vec3 dirW(vec3 d){float c=cos(YAW),s=sin(YAW);return vec3(c*d.x+s*d.z,d.y,-s*d.x+c*d.z);}
// ---- the skeleton, from the suit's bulk and the pose (uPose 0 standing and waving, 1 the walkout: a stride, one arm up)
float TW,TD,TH,AR,LR,GR,AL,HIP,SH,NECK;vec3 HC,CC;bool CASE;
vec3 JH[2],JK[2],JA[2],JS[2],JE[2],JW[2];float FP[2];int AM[2];   // arm modes: 0 down, 1 wave, 2 carry the case, 3 swing
void skel(){
 TW=.22*uBody.y;TD=.14*uBody.z;TH=.55;AR=.055*uBody.x;LR=.072*uBody.x;GR=.058*mix(1.,uBody.x,.6);AL=.58*uBody.w;
 float lt=.391,w=uPose;vec2 a0=vec2(.34,.04)*w,a1=vec2(-.26,-.62)*w;   // thigh and shin angles from the vertical, + forward
 HIP=.09+lt*(cos(a0.x)+cos(a0.y));
 for(int i=0;i<2;i++){float sx=i==0?-1.:1.;vec2 a=i==0?a0:a1;
  JH[i]=vec3(sx*TW*.48,HIP,0.);JK[i]=JH[i]+vec3(sx*TW*.04,-lt*cos(a.x),lt*sin(a.x)+.02);JA[i]=JK[i]+vec3(-sx*TW*.02,-lt*cos(a.y),lt*sin(a.y)-.02);
  FP[i]=i==0?-.12*w:.5*w;}
 SH=HIP+TH;NECK=SH+HEAD*.25;HC=vec3(0.,NECK+HEAD*1.05,HEAD*.05);
 CASE=uS==4||uS==5;
 for(int i=0;i<2;i++){float sx=i==0?-1.:1.;
  int m=((w<.5)==(i==1))?1:(CASE?2:(w>.5?3:0));AM[i]=m;
  vec3 s=vec3(sx*(TW*1.05+(uS==7?.03:0.)),SH-AR,0.),e,wr;JS[i]=s;
  if(m==1){e=s+vec3(sx*.42*AL,.12*AL,.05);wr=e+vec3(sx*.04,.5*AL,.02);}
  else if(m==2){e=s+vec3(sx*.07,-.5*AL,-.01);wr=e+vec3(sx*.03,-.48*AL,.02);}
  else if(m==3){e=s+vec3(sx*.05,-.47*AL,.13);wr=e+vec3(0.,-.38*AL,.2);}
  else{e=s+vec3(sx*.06,-.5*AL,.04);wr=e+vec3(0.,-.48*AL,.06);}
  if(uS==7&&m!=1){e+=vec3(sx*.05,0.,0.);wr+=vec3(sx*.1,0.,0.);}   // Orlan's stiff arms stand off the body
  JE[i]=e;JW[i]=wr;if(m==2)CC=wr+vec3(sx*.02,-GR*1.3-.15,0.);}
}
// Apollo's bellows: ribs within ~9 cm of a joint (e0, e1: at the segment's start, end)
float ribs(float h,float L,float e0,float e1){float d0=h*L,d1=(1.-h)*L,m=max(e0*smoothstep(.1,.06,d0),e1*smoothstep(.1,.06,d1));return m*(.5+.5*cos(min(d0,d1)*2.*PI/.028));}
// a limb segment's material (sg 0 upper arm, 1 forearm, 2 thigh, 3 shin; h 0 at the body end)
float limbMat(int sg,float h){
 if(sg==0){if(h>.2&&h<.225||h>.395&&h<.42)return 32.;if(h>.225&&h<.395)return 18.;}   // the role stripe, inked
 if(uS==3){if(sg==2&&h>.3&&h<.45||sg==3&&h>.2&&h<.3)return 27.;}
 else if(uS==4){if(sg==3&&h>.28)return 11.;}   // high boots
 else if(uS==5){if(sg==0&&h>.62&&h<.7||sg==1&&h>.4&&h<.48||sg==2&&(h>.3&&h<.37||h>.72&&h<.79)||sg==3&&h>.42&&h<.49)return 28.;}   // lacing straps
 else if(uS==6){if(sg==0&&h<.16||sg==1&&h>.84)return 6.;}   // orange flashes
 else if(uS==7){if(sg==1&&h>.25&&h<.6)return 27.;if(sg==2&&h>.35&&h<.62)return 28.;}
 return 5.;}
float hose(vec3 q,vec3 a,vec3 c,vec3 sag,float r){vec3 b=mix(a,c,.5)+sag;return min(sdCap(q,a,b,r),sdCap(q,b,c,r));}
// ---- the astronaut. Materials: 5 dominant, 6 second, 7 skin, 8 helmet shell, 9 eye white, 10 pupil, 11 boots, 13 mouth,
// 15 hair, 16 lettering, 17 dark (straps, zip, cables), 18 role stripe, 19 gloves, 20 metal, 21 gold, 22 lamp, 23 Snoopy
// cap, 25 ventilator case, 26 hose, 27 red, 28 blue, 30 padding, 31 Orlan's door, 32 ink
vec2 mapA(vec3 p){
 vec3 q=toL(p);
 float bb=sdCap(q,vec3(0.,.3,-.05),vec3(0.,1.75,-.05),.68);if(bb>.08)return vec2(bb,0.);
 vec2 r=vec2(1e9,0.);float h;vec3 hp=q-HC;float R=uHelmR;
 // legs and boots
 for(int i=0;i<2;i++){float L1=length(JK[i]-JH[i]),L2=length(JA[i]-JK[i]);
  float d=limb(q,JH[i],JK[i],LR*1.08,LR,h);
  if(uS==1)d-=LR*.24*ribs(h,L1,0.,1.);if(uS==2)d-=LR*.12*sin(h*PI);
  r=U(r,d,limbMat(2,h));
  d=limb(q,JK[i],JA[i],LR,LR*.85,h);if(uS==1)d-=LR*.24*ribs(h,L2,1.,0.);
  r=U(r,d,limbMat(3,h));
  if(uS==0)r=U(r,length(q-JK[i]-vec3(0.,-.04,.01))-LR*1.5,5.);   // bloused at the knee
  if(uS==6)r=U(r,sdEll(q-JK[i]-vec3(0.,0.,LR*.72),vec3(LR*.85,LR*1.,LR*.5)),30.);   // knee pads
  vec3 bq=q-JA[i];float c=cos(FP[i]),s=sin(FP[i]);bq.yz=vec2(c*bq.y+s*bq.z,-s*bq.y+c*bq.z);
  vec3 bs=vec3(.07*mix(1.,uBody.x,.5),.06,.15);r=U(r,sdRBox(bq-vec3(0.,-.03,bs.z*.35),bs,.042),11.);}
 // the torso
 float tc=HIP+TH*.5,t;
 if(uS==3){t=min(sdRBox(q-vec3(0.,HIP+TH*.68,0.),vec3(TW,TH*.36,TD),.06),sdRBox(q-vec3(0.,HIP+TH*.24,0.),vec3(TW*.82,TH*.3,TD*.88),.1));}   // hard upper torso, soft trousers
 else if(uS==7){t=min(sdRBox(q-vec3(0.,HIP+TH*.64,-.02),vec3(TW,TH*.6,TD),.08),sdRBox(q-vec3(0.,HIP+TH*.12,0.),vec3(TW*.7,TH*.2,TD*.75),.1));}   // the fridge
 else if(uS==2){t=smin(sdRBox(q-vec3(0.,tc,0.),vec3(TW,TH*.55,TD),min(TW,TD)*.9),sdEll(q-vec3(0.,tc+.03,.01),vec3(TW*1.08,TH*.58,TD*1.12)),.05);}   // the pumpkin
 else t=sdRBox(q-vec3(0.,tc,0.),vec3(TW,TH*.55,TD),min(TW,TD)*.85);
 float tm=5.;
 if(uS==5||uS==6){   // the hood, sewn to the suit (soft) or a hard hood; a hollow with the face opening
  float ho=sdEll(hp-vec3(0.,-.01,-.015),vec3(R*.98,R*1.05,R*1.02));if(uS==5)ho+=.005*sin(hp.y*70.+hp.x*30.)*sin(hp.z*50.);
  float t0=t;t=smin(t,ho,uS==5?.12:.05);if(uS==6&&ho<t0-.01)tm=8.;
  t=max(t,-sdEll(hp-vec3(0.,-.01,-.01),vec3(R*.9,R*.97,R*.94)));
  vec3 nl=normalize(hp);float mk=nl.z>0.?1.-length(vec2(nl.x/uFace.x,(nl.y-uFace.z)/uFace.y)):-1.;t=max(t,mk*R*.35);
  float rg=max(abs(length(hp)-R*1.01)-.02,abs(mk)*R*.5-.016);if(nl.z>.1)r=U(r,rg,20.);   // the visor ring
  for(int i=0;i<2;i++){float sx=i==0?-1.:1.;r=U(r,sdCap(hp,vec3(sx*R*.82,uFace.z*R,.08),vec3(sx*R*1.02,uFace.z*R,.1),.026),20.);}}   // its hinges
 if(uS==7){vec3 bq=hp-vec3(0.,0.,.02);float hb=sdRBox(bq,vec3(.165,.18,.165),.075);if(hb<t-.005)tm=8.;
  t=smin(t,hb,.05);t=max(t,-sdRBox(bq,vec3(.145,.16,.148),.065));
  float vis=sdRBox(bq-vec3(0.,uFace.z,.17),vec3(uFace.x,uFace.y,.1),.03);t=max(t,-vis);
  r=U(r,max(sdRBox(bq-vec3(0.,uFace.z,.16),vec3(uFace.x+.022,uFace.y+.022,.03),.04),-vis),20.);   // the visor's frame
  for(int i=0;i<2;i++){float sx=i==0?-1.:1.;r=U(r,sdCap(bq,vec3(sx*.2,.07,-.06),vec3(sx*.2,.07,.07),.036),8.);r=U(r,length(bq-vec3(sx*.2,.07,.085))-.027,22.);}}   // lamps on the "ears"
 r=U(r,t,tm);
 // per suit: torso hardware
 if(uS==0){for(int i=0;i<2;i++){float sx=i==0?-1.:1.;r=U(r,sdCap(q,vec3(sx*.06,HIP+TH*.45,TD-.01),vec3(sx*.06,HIP+TH*.45,TD+.035),.022),21.);}
  r=U(r,min(hose(q,vec3(-.06,HIP+TH*.45,TD+.035),vec3(-.04,HIP+.02,TD+.07),vec3(-.04,0.,.03),.015),hose(q,vec3(.06,HIP+TH*.45,TD+.035),vec3(-.04,HIP+.02,TD+.07),vec3(.05,0.,.04),.015)),20.);}
 else if(uS==1){for(int i=0;i<4;i++){float x=-.11+.073*float(i);r=U(r,sdCap(q,vec3(x,HIP+TH*.42,TD-.01),vec3(x,HIP+TH*.42,TD+.02),.019),i==0||i==2?28.:27.);}
  r=U(r,sdCap(q,vec3(-.1,SH-.06,TD+.002),vec3(.1,HIP+TH*.6,TD+.002),.007),17.);}   // connectors, the diagonal zip
 else if(uS==2){float zf=TD*1.16;
  for(int i=0;i<2;i++){float sx=i==0?-1.:1.;r=U(r,min(sdCap(q,vec3(sx*TW*.42,SH+.03,-TD*.3),vec3(sx*TW*.42,SH-.07,zf),.022),sdCap(q,vec3(sx*TW*.42,SH-.07,zf),vec3(sx*TW*.3,HIP+.03,zf*.98),.022)),17.);}
  r=U(r,sdCap(q,vec3(-TW*.55,HIP+TH*.6,zf),vec3(TW*.55,HIP+TH*.6,zf),.022),17.);r=U(r,sdRBox(q-vec3(0.,HIP+TH*.6,zf+.01),vec3(.04,.035,.015),.008),20.);   // the harness and its buckle
  r=U(r,hose(q,vec3(TW*.32,HIP+TH*.4,zf),vec3(TW*.75,HIP-.12,TD*.9),vec3(.05,-.04,.1),.017),26.);}   // a hose into the chest

    gl.uniform3f(U('uCam'), hc[0] + r * 1.9, hc[1] + r * .4, hc[2] + r * 3.1); gl.uniform3f(U('uTgt'), hc[0], hc[1] - r * .15, hc[2]); gl.uniform1f(U('uFov'), .55); }
  else { const ph = YAW + (o.shot === 'back' ? Math.PI - .7 : .5), d = o.d || 4.6;
    gl.uniform3f(U('uCam'), AX + Math.sin(ph) * d, 1.2, AZ + Math.cos(ph) * d); gl.uniform3f(U('uTgt'), AX, 1., AZ); gl.uniform1f(U('uFov'), 2.3 / d); }
  gl.uniform1i(U('uS'), S.n); gl.uniform1f(U('uPose'), o.pose === 'walk' ? 1 : 0); gl.uniform1f(U('uStudio'), studio ? 1 : 0); gl.uniform1f(U('uSil'), o.sil ? 1 : 0);
  gl.uniform1f(U('uHelmR'), S.helmR); gl.uniform4fv(U('uFace'), S.face); gl.uniform4fv(U('uBody'), S.body);
  for (const [k, n] of [['c1', 'uC1'], ['c2', 'uC2'], ['boot', 'uBootC'], ['glove', 'uGloveC'], ['shell', 'uShell'], ['acc', 'uAcc']]) gl.uniform3fv(U(n), S[k]);

}
// ---- the brief's checks, drawn as sheets on a 2D canvas from tiles rendered one suit at a time
const shc = document.getElementById('sh'), cx = shc.getContext('2d');
function tile(o, w, h) { render(o, w, h); const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(cv, 0, 0); return c; }
function shrink(src, w, h) { let c = src;   // halve in steps, so a big shrink doesn't alias
  while (c.width / 2 >= w) { const n = document.createElement('canvas'); n.width = Math.round(c.width / 2); n.height = Math.round(c.height / 2);
    const x = n.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(c, 0, 0, n.width, n.height); c = n; }
  const n = document.createElement('canvas'); n.width = w; n.height = h; const x = n.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(c, 0, 0, w, h); return n; }
function text(s, x, y, o = {}) { cx.font = `${o.b ? '600 ' : ''}${o.s || 12}px system-ui, sans-serif`; cx.fillStyle = o.c || '#22262e'; cx.textAlign = o.a || 'center'; cx.fillText(s, x, y); }
const ERAS = ['early', 'middle', 'late', 'eva'], ERA_N = { early: 'early', middle: 'middle', late: 'late', eva: 'spacewalk' };
function sheet(kind) {
  const W = innerWidth, H = innerHeight; shc.width = W; shc.height = H; cx.fillStyle = '#f4f2ee'; cx.fillRect(0, 0, W, H);
  const role = ST.role;
  if (kind === 'lineup') {   // all eight in the walkout, schools in rows, eras in columns
    text('All eight, walking out: Cape (top) and Steppe; early, middle, late, spacewalk', W / 2, 22, { b: 1, s: 14 });
    const cw = W / 4, ch = (H - 34) / 2;
    ORDER.forEach((k, i) => { const x = (i % 4) * cw, y = 34 + Math.floor(i / 4) * ch, S = SUITS[k];
      cx.drawImage(tile({ suit: k, role, pose: 'walk', shot: 'front' }, Math.round(cw), Math.round(ch - 36)), x, y);
      text(`${S.name} (${S.real})`, x + cw / 2, y + ch - 22, { b: 1 }); text(S.sig, x + cw / 2, y + ch - 7, { c: '#5a606b', s: 11 }); });
  } else if (kind === 'sil') {   // check 1: black fills in a row, walking out and standing; each must be nameable without colour
    text('Check 1: silhouettes. Each should be nameable without colour (top: walking out; bottom: standing)', W / 2, 22, { b: 1, s: 14 });
    const step = W / 8, th = Math.round((H - 70) / 2), tw = Math.round(th * .58);
    cx.globalCompositeOperation = 'darken';
    ['walk', 'stand'].forEach((pose, r) => ORDER.forEach((k, i) => cx.drawImage(tile({ suit: k, pose, shot: 'front', sil: 1 }, tw, th), step * (i + .5) - tw / 2, 32 + r * (th + 4))));
    cx.globalCompositeOperation = 'source-over';
    ORDER.forEach((k, i) => text(SUITS[k].name, step * (i + .5), H - 14, { b: 1 }));
  } else if (kind === 'grey') {   // check 2: greyscale at a third of the size, the two suits of each era side by side
    text('Check 2: grey squint. At a third of the size, in grey, the two suits of each era should still read apart', W / 2, 22, { b: 1, s: 14 });
    const fw = 300, fh = 380, sw = fw / 3, shh = fh / 3, gw = W / 4;
    ERAS.forEach((e, j) => { const x0 = gw * j + gw / 2;
      ['cape', 'steppe'].forEach((s, i) => { const t = tile({ suit: `${s}-${e}`, role, pose: 'walk', shot: 'front' }, fw * 2, fh * 2);
        const g = shrink(t, sw, shh); cx.filter = 'grayscale(1)'; cx.drawImage(g, x0 - sw + i * sw, 60); cx.filter = 'none';
        cx.drawImage(shrink(t, sw * 1.5, shh * 1.5), x0 - sw * 1.5 + i * sw * 1.5, 250);
        text(s === 'cape' ? 'Cape' : 'Steppe', x0 - sw / 2 + i * sw, 60 + shh + 14, { s: 11 }); });
      text(ERA_N[e], x0, 50, { b: 1 }); });
    text('↑ in grey, a third of the size', W / 2, 222, { c: '#5a606b', s: 11 }); text('↑ in colour, half the size, for reference', W / 2, 250 + shh * 1.5 + 18, { c: '#5a606b', s: 11 });
  } else if (kind === 'thumb') {   // check 3: each at 48 px tall, as the game's crew lists show them; then the same pixels ×4
    text('Check 3: 48 px tall, as crew lists show them (top: true size; below: the same pixels, enlarged ×4)', W / 2, 22, { b: 1, s: 14 });
    const step = W / 8;
    ORDER.forEach((k, i) => { const t = tile({ suit: k, role, pose: 'stand', shot: 'front', d: 3.4 }, 320, 400);   // the figure fills ~85% of the tile's height
      const s = shrink(t, Math.round(48 / .85 * .8), Math.round(48 / .85));
      cx.drawImage(s, step * (i + .5) - s.width / 2, 40);
      cx.imageSmoothingEnabled = false; cx.drawImage(s, step * (i + .5) - s.width * 2, 130, s.width * 4, s.height * 4); cx.imageSmoothingEnabled = true;
      text(SUITS[k].name, step * (i + .5), 130 + s.height * 4 + 18, { b: 1 }); });
  }
}
function draw() {
  document.body.classList.toggle('sheet', !!ST.sheet);
  if (ST.sheet) sheet(ST.sheet);
  else { const dpr = Math.min(2, devicePixelRatio || 1); render(ST, Math.round(innerWidth * dpr), Math.round(innerHeight * dpr)); }
  document.querySelectorAll('#bar button').forEach(b => b.classList.toggle('on', ST.sheet ? b.dataset.sheet === ST.sheet || b.dataset.role === ST.role
    : b.dataset.suit === ST.suit || b.dataset.role === ST.role || b.dataset.pose === ST.pose || b.dataset.shot === ST.shot));
  const S = SUITS[ST.suit];
  document.getElementById('cap').textContent = ST.sheet ? 'The brief\'s checks (CREW.md § "The suit brief, round 2"). Pick a suit to leave the sheet.'
    : `${S.name} (${S.real}): ${S.cap}. Signature: ${S.sig}. Stripe: ${ST.role}.`;
  window.FRAME_DONE = (window.FRAME_DONE || 0) + 1;
}
document.getElementById('suits').innerHTML = ORDER.map(k => `<button data-suit="${k}">${SUITS[k].name.replace('spacewalk', 'EVA')}</button>`).join('');
document.getElementById('bar').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.sheet) ST.sheet = b.dataset.sheet;
  else { if (!b.dataset.role) ST.sheet = ''; for (const k of ['suit', 'role', 'pose', 'shot']) if (b.dataset[k]) ST[k] = b.dataset[k]; }
  draw(); });
addEventListener('resize', draw); draw();
</script>
