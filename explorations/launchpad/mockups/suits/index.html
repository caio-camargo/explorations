<title>Suit mock-ups</title>
<!-- Launchpad mock-up for CREW.md § Part 1's suits (QUEUE Q199, D9; Caio took the defaults, CREW 0.2.3): the stylised
     human (W19) in each school's suit line, Cape and Steppe, three generations (early, middle, late) and the spacewalk
     suit, with a role stripe on the shoulder. Same scene as the crew mock-up (mockups/crew/, Q72), whose raymarcher this
     copies. A standalone page: never loaded by index.html. ?suit=cape-early|…|steppe-eva&role=pilot|scientist|engineer
     &shot=wide|close picks a still (the bar does the same). -->
<style>
  :root { --bg: #0e1116; --fg: #e7e9ee; --dim: #8b93a3; --acc: #f2b84b; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #bar { position: fixed; top: 8px; left: 8px; right: 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
    background: rgba(14, 17, 22, .78); padding: 6px 8px; border-radius: 6px; }
  #bar button { background: #222833; color: var(--fg); border: 1px solid #39414f; border-radius: 4px; padding: 4px 9px; cursor: pointer; }
  #bar button.on { border-color: var(--acc); color: var(--acc); }
  #bar .sep { width: 1px; height: 20px; background: #39414f; margin: 0 4px; }
  #cap { color: var(--dim); margin-left: 6px; }
  body.still #bar { display: none; }
</style>
</head>

<canvas id="c"></canvas>
<div id="bar">
  <span id="suits"></span>
  <span class="sep"></span>
  <button data-role="pilot">Pilot</button><button data-role="scientist">Scientist</button><button data-role="engineer">Engineer</button>
  <span class="sep"></span>
  <button data-shot="wide">Wide</button><button data-shot="close">Helmet close-up</button>
  <span id="cap"></span>
</div>

// ---- primitives
float sdBox(vec3 p,vec3 b){vec3 q=abs(p)-b;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.);}

float sdEll(vec3 p,vec3 r){float k0=length(p/r),k1=length(p/(r*r));return k0*(k0-1.)/k1;}

 vec2 ca=vec2(q.x-min(q.x,(q.y<0.)?r1:r2),abs(q.y)-h);vec2 cb=q-k1+k2*clamp(dot(k1-q,k2)/dot(k2,k2),0.,1.);
 float s=(cb.x<0.&&ca.y<0.)?-1.:1.;return s*sqrt(min(dot(ca,ca),dot(cb,cb)));}
float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
// ---- the scene. Materials: 1 deck, 2 rail (red), 3 capsule shingles, 4 hatch interior, 5 suit, 6 trim, 7 skin, 8 helmet
// shell, 9 eye white, 10 pupil, 11 boots/gloves, 12 gantry, 13 mouth, 14 hatch door
// the astronaut stands at A facing +z, turned a little toward the camera; the helmet's centre is HC
vec3 A=vec3(.75,0.,.05);
vec2 mapA(vec3 p){   // the astronaut, in its own frame (y up, facing +z)
 vec3 q=p-A;float c=cos(.35),s=sin(.35);q.xz=mat2(c,s,-s,c)*q.xz;   // turned toward +x (the camera); glassT and helmetC use its inverse
 float hip=uLegL+uBoot.y*1.2,sh=hip+uTH,neck=sh+uHead*.25;vec3 HC=vec3(0.,neck+uHead*1.05,uHead*.05);
 vec2 r=vec2(1e9,0.);
 float LR=uLegR*uBulk,AR=uArmR*uBulk,TW=uTW*mix(1.,uBulk,.6)*(1.+.12*uRigid),TD=uTD*mix(1.,uBulk,.8)*(1.+.2*uRigid);
 // legs and boots
 for(int i=0;i<2;i++){float sx=i==0?-1.:1.;vec3 h=vec3(sx*uTW*.48,hip,0.),k=vec3(sx*uTW*.52,hip*.5,.02),an=vec3(sx*uTW*.5,uBoot.y*1.5,0.);
  float d=min(sdCapT(q,h,k,LR*1.08,LR),sdCapT(q,k,an,LR,LR*.85));if(d<r.x)r=vec2(d,5.);
  float b=sdRBox(q-vec3(sx*uTW*.5,uBoot.y,uBoot.z*.35),uBoot,min(uBoot.x,uBoot.y)*.7);if(b<r.x)r=vec2(b,11.);}
 // torso, with a chest pack and a belt band
 float t=sdRBox(q-vec3(0.,hip+uTH*.5,0.),vec3(TW,uTH*.55,TD),min(TW,TD)*mix(.85,.35,uRigid));
 float pk=sdRBox(q-vec3(0.,hip+uTH*.62,TD*.95),vec3(TW*.55,uTH*.16,TD*.25),.02);
 float bt=sdRBox(q-vec3(0.,hip+uTH*.08,0.),vec3(TW*1.04,uTH*.06,TD*1.06),.02);
 if(uPack>.5){float bp=sdRBox(q-vec3(0.,hip+uTH*.58,-TD-uTD*.55),vec3(TW*.95,uTH*.45,uTD*.6),.04);if(bp<r.x)r=vec2(bp,17.);}   // the backpack
 if(t<r.x)r=vec2(t,5.);if(pk<r.x)r=vec2(pk,6.);if(bt<r.x)r=vec2(bt,6.);

 vec3 eL=sL+vec3(-.06,-uArmL*.5,.04),wL=eL+vec3(.0,-uArmL*.48,.06);
 vec3 eR=sR+vec3(uArmL*.42,uArmL*.12,.05),wR=eR+vec3(.04,uArmL*.5,.02);
 float a=min(min(sdCapT(q,sL,eL,AR*1.1,AR),sdCapT(q,eL,wL,AR,AR*.9)),min(sdCapT(q,sR,eR,AR*1.1,AR),sdCapT(q,eR,wR,AR,AR*.9)));
 if(a<r.x)r=vec2(a,5.);
 float sp=min(sdCapT(q,mix(sL,eL,.22),mix(sL,eL,.4),AR*1.16,AR*1.12),sdCapT(q,mix(sR,eR,.22),mix(sR,eR,.4),AR*1.16,AR*1.12));if(sp<r.x)r=vec2(sp,18.);   // the role stripe
 float gR=uGlove*mix(1.,uBulk,.5);float g=min(length(q-wL-vec3(0.,-gR*.6,0.))-gR,length(q-wR-vec3(0.,gR*.6,0.))-gR);if(g<r.x)r=vec2(g,11.);
 // the neck ring (trim) and the helmet: a shell with a faceplate opening (uOpen = cos of its half-angle; −1: all glass)
 float nr=length(vec2(length(q.xz)-uHelmR*.78,(q.y-neck-.01)*1.6))-.028;if(nr<r.x)r=vec2(nr,6.);   // a flat ring, the helmet's seat
 vec3 hp=q-HC;float sh2=abs(length(hp)-uHelmR)-.012,fwd=dot(normalize(hp),normalize(vec3(0.,.12,1.)));
 sh2=max(sh2,(fwd-uOpen)*uHelmR);sh2=max(sh2,-(hp.y+uHelmR*.82));
 if(uOpen>-.9&&sh2<r.x){float hy=hp.y/uHelmR;r=vec2(sh2,uHood>.5?19.:uBandOn>.5&&hy>.5&&hy<.74&&fwd>-.2?16.:8.);}

 vec3 hq=q-(HC+vec3(0.,-uHead*.12,0.));
 float hd=sdEll(hq,vec3(uHead*.86,uHead,uHead*.9));
 float jw=mix(sdEll(hq-vec3(0.,-uHead*.45,uHead*.12),vec3(uHead*.62,uHead*.5,uHead*.62)),sdRBox(hq-vec3(0.,-uHead*.5,uHead*.12),vec3(uHead*.58,uHead*.42,uHead*.56),uHead*.18),uJaw);
 hd=smin(hd,jw,uHead*.15);hd=smin(hd,sdEll(hq-vec3(0.,-uHead*.05,uHead*.86),vec3(uHead*.13,uHead*.18,uHead*.16)),uHead*.06);   // nose
 for(int i=0;i<2;i++){float sx=i==0?-1.:1.;hd=smin(hd,sdEll(hq-vec3(sx*uHead*.86,-uHead*.05,0.),vec3(uHead*.1,uHead*.2,uHead*.14)),uHead*.04);}
 if(hd<r.x)r=vec2(hd,7.);
 if(uHairOn>.5){float hr=sdEll(hq-vec3(0.,uHead*.04,-uHead*.03),vec3(uHead*.91,uHead*1.04,uHead*.95)),cut=hq.y-mix(-.15,.42,smoothstep(-.4,.7,hq.z/uHead))*uHead;
  hr=max(hr,-cut);if(hr<r.x)r=vec2(hr,15.);   // short hair: a cap over the skull, its hairline high at the front
  for(int i=0;i<2;i++){float sx=i==0?-1.:1.;float bw=sdCap(hq,vec3(sx*uHead*.22,uHead*.38,uHead*.84),vec3(sx*uHead*.5,uHead*.36,uHead*.72),uHead*.035);if(bw<r.x)r=vec2(bw,15.);}}
 for(int i=0;i<2;i++){float sx=i==0?-1.:1.;vec3 ec=hq-vec3(sx*uHead*.36,uHead*.16,uHead*.8-uEye*.4);
  float ew=length(ec)-uEye;if(ew<r.x)r=vec2(ew,9.);float pu=length(ec-vec3(sx*uEye*-.1,0.,uEye*.72))-uEye*.45;if(pu<r.x)r=vec2(pu,10.);}
 vec3 mq=hq-vec3(0.,-uHead*.42,uHead*.82);float mo=sdCap(mq,vec3(-uHead*.26,uHead*.06,0.),vec3(uHead*.26,uHead*.06,0.),uHead*.045);
 mo=max(mo,-(mq.y-uHead*.02-abs(mq.x)*.3));if(mo<r.x)r=vec2(mo,13.);
 return r;}
vec2 map(vec3 p){
 vec2 r=vec2(p.y+.06,1.);   // the walkway's grating
 r.x=max(r.x,abs(p.z-.2)-1.45);r.x=max(r.x,abs(p.x)-6.);
 // railing on the open side (z = +1.6, behind the camera) and along the walkway's end (x = 3.3): posts, rails, a kick plate
 float rl=min(sdCap(p,vec3(-6.,1.05,1.6),vec3(6.,1.05,1.6),.025),sdCap(p,vec3(-6.,.55,1.6),vec3(6.,.55,1.6),.018));
 float px=p.x-clamp(floor(p.x/1.2+.5)*1.2,-6.,6.);rl=min(rl,sdCap(vec3(px,p.y,p.z),vec3(0.,0.,1.6),vec3(0.,1.05,1.6),.025));
 rl=min(rl,sdBox(p-vec3(0.,.06,1.6),vec3(6.,.06,.008)));
 vec3 sq=p-vec3(3.3,0.,0.);rl=min(rl,min(sdCap(sq,vec3(0.,1.05,-1.2),vec3(0.,1.05,1.6),.025),sdCap(sq,vec3(0.,.55,-1.2),vec3(0.,.55,1.6),.018)));
 float pz=sq.z-clamp(floor(sq.z/.95+.5)*.95,-1.2,1.6);rl=min(rl,sdCap(vec3(sq.x,sq.y,pz),vec3(0.),vec3(0.,1.05,0.),.025));if(rl<r.x)r=vec2(rl,2.);
 // the gantry behind: two red box columns with cross-bracing
 for(int i=0;i<2;i++){float gx=i==0?-3.4:3.6;float c=sdBox(p-vec3(gx,1.5,-2.6),vec3(.16,4.,.16));if(c<r.x)r=vec2(c,12.);}
 vec3 bq=p-vec3(.1,2.1,-2.75);float br=min(sdCap(bq,vec3(-3.4,-2.1,0.),vec3(3.6,2.,0.),.05),sdCap(bq,vec3(-3.4,2.,0.),vec3(3.6,-2.1,0.),.05));if(br<r.x)r=vec2(br,12.);
 // the capsule: a Mercury-like truncated cone, its axis at (−.55, ·, −1.25), the hatch in its side facing the walkway
 vec3 cq=p-vec3(-.55,1.25,-1.25);float cap=sdCone(cq,1.15,.95,.42);
 cap=min(cap,sdCap(cq,vec3(0.,1.15,0.),vec3(0.,1.55,0.),.3));   // the antenna canister
 float hole=sdRBox(cq-vec3(.2,-.25,.85),vec3(.32,.42,.5),.08);float shellIn=sdCone(cq,1.1,.88,.36);
 float hatchIn=max(hole,shellIn+.0);   // the cabin you see through the hatch
 cap=max(cap,-hole);if(cap<r.x)r=vec2(cap,3.);
 float inside=max(-shellIn,hole-.01);inside=max(inside,-(cq.y+1.1));if(hatchIn<r.x&&hatchIn<cap)r=vec2(hatchIn+.01,4.);
 // the hatch door, swung open on the side
 vec3 dq=cq-vec3(.62,-.25,.62);float dc=cos(1.1),ds=sin(1.1);dq.xz=mat2(dc,-ds,ds,dc)*dq.xz;float dr=sdRBox(dq-vec3(.3,0.,0.),vec3(.3,.4,.03),.05);if(dr<r.x)r=vec2(dr,14.);
 vec2 a=mapA(p);if(a.x<r.x)r=a;
 return r;}
vec3 nrm(vec3 p){vec2 e=vec2(.0007,0.);return normalize(vec3(map(p+e.xyy).x-map(p-e.xyy).x,map(p+e.yxy).x-map(p-e.yxy).x,map(p+e.yyx).x-map(p-e.yyx).x));}
float shadow(vec3 o,vec3 d){float res=1.,t=.02;for(int i=0;i<48;i++){float h=map(o+d*t).x;res=min(res,10.*h/t);t+=clamp(h,.02,.4);if(res<.002||t>12.)break;}return clamp(res,0.,1.);}
float ao(vec3 p,vec3 n){float a=0.,w=1.;for(int i=1;i<=5;i++){float h=.04*float(i);a+=w*(h-map(p+n*h).x);w*=.6;}return clamp(1.-2.2*a,0.,1.);}
vec3 sky(vec3 d){vec3 c=mix(vec3(.62,.74,.86),vec3(.24,.45,.78),pow(max(d.y,0.),.6));
 if(d.y<0.){float t=-24./d.y;vec2 g=(uCam.xz+d.xz*t)*.02;float f=exp(-t*.0016);vec3 gr=mix(vec3(.38,.5,.3),vec3(.66,.62,.5),step(.5,hash(floor(g))));c=mix(c,gr,f);}   // the ground far below

vec3 albedo(float m,vec3 p,vec3 n){

 if(m<2.5)return vec3(.75,.16,.1);
 if(m<3.5){float rib=.5+.5*cos((atan(p.z+1.25,p.x+.55))*80.);return vec3(.08,.085,.1)*(.8+.4*rib);}   // shingles
 if(m<4.5)return vec3(.18,.17,.15);
 if(m<5.5)return uSuit;if(m<6.5)return uTrim;if(m<7.5)return uSkin;if(m<8.5)return uShell;
 if(m<9.5)return vec3(.96);if(m<10.5)return vec3(.03,.04,.06);if(m<11.5)return uBootC;if(m<12.5)return vec3(.68,.18,.1);if(m<13.5)return vec3(.35,.08,.07);
 if(m<14.5)return vec3(.1,.1,.11);if(m<15.5)return uHair;

 if(m<17.5)return uSuit*.92;if(m<18.5)return uStripe;return uShell;}   // backpack, role stripe, the soft hood
// the helmet's glass: an analytic sphere over the faceplate (or the whole bowl)
float glassT(vec3 ro,vec3 rd,out vec3 gn){vec3 q=A;float c=cos(.35),s=sin(.35);
 float hip=uLegL+uBoot.y*1.2,sh=hip+uTH,neck=sh+uHead*.25;vec3 hcL=vec3(0.,neck+uHead*1.05,uHead*.05);
 vec3 hc=A+vec3(c*hcL.x+s*hcL.z,hcL.y,-s*hcL.x+c*hcL.z);
 vec3 oc=ro-hc;float b=dot(oc,rd),cc=dot(oc,oc)-uHelmR*uHelmR,h=b*b-cc;if(h<0.)return -1.;float t=-b-sqrt(h);if(t<0.)return -1.;
 gn=normalize(ro+rd*t-hc);vec3 f=normalize(vec3(0.,.12,1.));f.xz=vec2(c*f.x+s*f.z,-s*f.x+c*f.z);
