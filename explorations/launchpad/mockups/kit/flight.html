<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Launchpad mock-up: the flight HUD on the roles</title>
<!-- A static mock-up (ELEMENTS.md § 6.1, for QUEUE Q477). Never loaded by the game. The flight HUD as the instrument
     panel, built from ELEMENTS.md's roles: engraved = the system (B612, D52), lit on glass = the data. A caution is a
     lit tile, never coloured text in a readout (D51). The backgrounds, the navball and "Today" are the game's own
     (views.js refView 94 and 156, v1.370). The figures are invented.
     URL: ?state=quiet|caution|warning|burn &ph=amber|green|white &fig=vt|b612|sans &keys=legend|plate &gz=bar|ptr &squint=1 &grey=1 &today=1 -->
<style>
@font-face{font-family:'VT323';src:url(../../fonts/vt323.woff2) format('woff2')}
@font-face{font-family:'B612';font-weight:400;src:url(faces/B612-Regular.ttf)}
@font-face{font-family:'B612';font-weight:700;src:url(faces/B612-Bold.ttf)}
@font-face{font-family:'B612 Mono';font-weight:400;src:url(faces/B612Mono-Regular.ttf)}
@font-face{font-family:'B612 Mono';font-weight:700;src:url(faces/B612Mono-Bold.ttf)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
/* ---------- the mock-up's own chrome ---------- */
#bar{position:fixed;inset:0 0 auto 0;height:34px;z-index:10;background:#16171a;color:#cfd2d6;font:12px/1 system-ui,sans-serif;display:flex;gap:6px;align-items:center;padding:0 10px;white-space:nowrap;overflow:auto}
#bar b{font-weight:600;color:#8d9299;margin:0 2px 0 10px}#bar a{color:#9db8e8}
#bar button{font:inherit;color:inherit;background:#26282c;border:1px solid #3a3d42;border-radius:3px;padding:5px 9px;cursor:pointer}
#bar button.on{background:#e8e6e0;color:#111;border-color:#e8e6e0}
#who{position:fixed;inset:auto 0 0 0;height:24px;z-index:10;background:#16171a;color:#cfd2d6;font:12px/24px system-ui,sans-serif;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#who b{color:#fff}
#stage{position:fixed;inset:34px 0 24px 0;background:#000 url(bg-climb.jpg) center/cover;overflow:hidden}
body[data-state=burn] #stage{background-image:url(bg-orbit.jpg)}
body.squint #stage{filter:blur(4px)}body.grey #stage{filter:grayscale(1)}body.squint.grey #stage{filter:blur(4px) grayscale(1)}
#today{display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;z-index:5}
body.today #today{display:block}

/* ---------- the panel: tokens ---------- */
#stage{--ink:#e6e1d3;--quiet:#aaa698;--well:#0a0b0a;--amber:#f2b01e;--red:#ff4a3a;--lit:#f3ecd2;--ph:#ffb000;
  --f-lit:'VT323',monospace;--l1:18px;--l2:46px;font:11px/1.25 'B612','Arial Narrow',sans-serif;color:var(--ink)}
body[data-ph=green] #stage{--ph:#5ee88a}body[data-ph=white] #stage{--ph:#e9f2df}
body[data-fig=b612] #stage{--f-lit:'B612 Mono',monospace;--l1:13px;--l2:30px}
body[data-fig=sans] #stage{--f-lit:'B612',sans-serif;--l1:13px;--l2:30px}
/* a bezel: the only enclosure for a group */
.bz{position:absolute;background:linear-gradient(180deg,#303337,#26292c);border:1px solid #111;border-radius:4px;box-shadow:inset 0 1px 0 #50545a,0 8px 26px rgba(0,0,0,.6);padding:9px 10px}
/* engraved: label, heading, key legend */
.lab,.h,.btn,.kbd,.lamp{font-family:'B612','Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.12em}
.lab{font-size:11px;color:var(--ink);white-space:nowrap}
.h{font-size:12px;font-weight:700;margin:0}
.term{text-decoration:underline dotted;text-underline-offset:3px;cursor:help}
.grp{border:1px solid #8b887c;border-radius:5px;padding:13px 8px 8px;position:relative;margin-top:7px}
.grp>.h{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:#2d3033;padding:0 8px;white-space:nowrap}
/* lit on glass: value, unit, name, sentence */
.glass{display:block;background:var(--well);border:1px solid #000;border-radius:3px;box-shadow:inset 0 0 10px color-mix(in srgb,var(--ph) 9%,transparent),0 1px 0 #4a4e54;color:var(--ph);font:var(--l1)/1.15 var(--f-lit);padding:2px 7px;font-variant-numeric:tabular-nums;white-space:nowrap}
.glass.r{text-align:right}
.big{font-size:var(--l2);line-height:.95}
.u{opacity:.62;margin-left:.3em;font-size:var(--l1)}
.dim{opacity:.62}
/* a row: engraved label, then its glass */
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 8px;align-items:center;margin-top:6px}
/* gauge: a value as a length, against a tick engraved on the bezel. It never changes colour (D51) */
.gz{position:relative;height:12px;background:var(--well);border:1px solid #000;border-radius:2px;box-shadow:0 1px 0 #4a4e54}
.gz i{position:absolute;inset:2px auto 2px 2px;background:var(--ph);max-width:calc(100% - 4px)}
.gz b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);margin-left:-1px}
/* the other gauge: a pointer on a scale, so the only filled blocks of the phosphor's colour are lamps */
body[data-gz=ptr] .gz i{background:linear-gradient(90deg,transparent calc(100% - 4px),var(--ph) 0)}
body[data-gz=ptr] .thr .gz i{background:linear-gradient(0deg,transparent calc(100% - 4px),var(--ph) 0)}
body[data-gz=ptr] .gz{background:var(--well) repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),#3a3d40 0 10%)}
body[data-gz=ptr] .thr .gz{background:var(--well) repeating-linear-gradient(0deg,transparent 0 calc(10% - 1px),#3a3d40 0 10%)}
.grow{display:grid;grid-template-columns:1fr auto;gap:3px 8px;align-items:center;margin-top:7px}
.grow .lab{grid-column:1/-1}.grow .glass{min-width:5.2em;text-align:right}
.grow .fix{grid-column:1/-1;white-space:normal;text-align:left}
.grow.flat .lab{grid-column:auto}
/* keys: command, toggle, choice. Raised plate; lit when on */
.btn{font-size:11px;color:var(--ink);background:linear-gradient(#474b51,#303337);border:1px solid #15171a;border-top-color:#70757c;border-radius:3px;box-shadow:0 2px 0 #101112;padding:5px 8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:#484d53}
.btn.on{background:var(--lit);color:#15130c;border-color:var(--lit);box-shadow:0 0 10px rgba(243,236,210,.45)}
/* the other way to show a key is on: only its legend and a bar light, so it stays darker than a lamp and than read 1 */
body[data-keys=legend] .btn.on{background:linear-gradient(#3a3d42,#26292c);color:var(--lit);border-color:#15171a;border-top-color:#70757c;box-shadow:0 2px 0 #101112,inset 0 3px 0 var(--lit);text-shadow:0 0 6px rgba(243,236,210,.7)}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5}
.kbd{font-size:10px;border:1px solid currentColor;border-radius:3px;padding:0 4px;opacity:.75;letter-spacing:0;text-transform:none}
/* lamp: a caution as a tile, dark until it matters. No raised edge, so it is not a key */
.lamp{display:block;font-size:10.5px;font-weight:700;text-align:center;padding:5px 2px;border-radius:2px;background:#1b1c1a;color:#55574f;border:1px solid #000;box-shadow:inset 0 1px 0 #333}
.lamp.amber{background:var(--amber);color:#1a1408;box-shadow:0 0 12px rgba(242,176,30,.55)}
.lamp.red{background:var(--red);color:#fff;box-shadow:inset 0 0 0 2px #fff,0 0 14px rgba(255,74,58,.7)}
.lamp.master{padding:5px 2px;line-height:1.25;cursor:pointer}
/* token: an event in the staging sequence, on glass */
.tok{display:inline-block;border:1px solid var(--ph);border-left-width:4px;padding:0 6px 0 4px;margin-right:4px}
.srow{display:flex;gap:7px;align-items:baseline;padding:1px 0}.srow .ix{min-width:1.6em;text-align:right}

/* ---------- the layout ---------- */
.tl{left:12px;top:12px;display:flex;gap:8px;align-items:center}
.tr{right:12px;top:12px;display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;align-items:stretch}.seg .btn{border-radius:3px 0 0 3px}.seg .btn:last-child{border-radius:0 3px 3px 0}.seg .glass{border-radius:0;min-width:3.4em;text-align:center}
.bl{left:12px;bottom:12px;width:226px}
.br{right:12px;bottom:12px;width:226px}
.main{left:50%;transform:translateX(-50%);bottom:12px;display:flex;gap:10px;align-items:stretch}
.col{display:flex;flex-direction:column;gap:5px}
.col.sas{width:96px}.col.read{width:146px}.col.ann{width:106px;justify-content:space-between}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:5px}.keys .btn{padding:5px 0}
.thr{width:20px;display:flex;flex-direction:column;gap:4px;align-items:center}
.thr .gz{flex:1;width:14px;height:auto}.thr .gz i{inset:auto 2px 2px 2px;max-width:none}
.ballw{display:flex;flex-direction:column;gap:5px;align-items:center}
.ball{width:164px;height:164px;border-radius:50%;border:5px solid #17191b;box-shadow:0 0 0 1px #5a5e64,inset 0 0 12px #000;background:#0a0b0a;display:block}
.ballw .glass{font-size:var(--l1);padding:0 8px}
.sp{flex:1}
</style>
</head>
<body data-state="quiet" data-ph="amber" data-fig="vt" data-keys="legend" data-gz="bar">
<div id="bar">
  <a href="index.html">← kit</a>
  <b>State</b><button data-state="quiet">Climb, all quiet</button><button data-state="caution">Caution</button><button data-state="warning">Warning</button><button data-state="burn">Orbit burn</button>
  <b>Phosphor</b><button data-ph="amber">Amber</button><button data-ph="green">Green</button><button data-ph="white">White</button>
  <b>Figures</b><button data-fig="vt">VT323</button><button data-fig="b612">B612 Mono</button><button data-fig="sans" title="the panel's own sans, whose figures are already of one width: one face for the whole cockpit">B612</button>
  <b>Key on</b><button data-keys="legend" title="a key that is on lights its legend and a bar">Legend</button><button data-keys="plate" title="a key that is on lights whole, as in the kit's Panel dress">Plate</button>
  <b>Gauge</b><button data-gz="bar">Bar</button><button data-gz="ptr" title="a pointer on a scale: no filled block in the readout's colour">Pointer</button>
  <b>Checks</b><button data-cls="squint">Squint</button><button data-cls="grey">Grey</button><button data-cls="today" title="the game's flight HUD at v1.370, the same moment as the climb">Today</button>
</div>
<div id="stage"></div>
<div id="who"></div>
<script>
const $=s=>document.querySelector(s),B=document.body;
// symbols for the hold keys: drawn, since no face has them (ELEMENTS.md § 7.1)
const SYM={hold:'<path d="M2 9h4l3 3 3-3h4"/>',pro:'<circle cx="9" cy="9" r="4"/><path d="M9 5V2M5 9H1M13 9h4"/>',
  retro:'<circle cx="9" cy="9" r="4"/><path d="M9 5V2M5 9H1M13 9h4M6.2 6.2l5.6 5.6M11.8 6.2l-5.6 5.6"/>',node:'<path d="M9 2l6 7-6 7-6-7z"/>'};
const tri=d=>`<svg viewBox="0 0 18 18" style="width:9px;height:9px"><path fill="currentColor" stroke="none" d="${d<0?'M14 2v14L3 9z':'M4 2v14l11-7z'}"/></svg>`;
// ---- the states. Figures are invented; the climb's are near the game's own still
const ST={
 quiet:{say:'<b>All quiet.</b> No tile is lit and no figure is coloured: an empty caution column means all is well. Read 1 is the ball, speed and altitude; the phase card shows only what an ascent needs.',
  met:'00:52',spd:'441',ref:'surface',mach:['Mach','1.47'],alt:'10.0',altU:'km',rows:[['Climb','+422','m/s'],['Ap','19.4','km']],hdg:'090',pitch:'77',thr:100,sas:'hold',modes:['hold','pro'],
  stage:{n:2,name:'Petrel',fuel:64,left:'1:04',dv:'2056',next:[[3,['decouple','ignite Wren']],[4,['chute']]]},
  phase:{name:'Ascent',rows:[{l:'Q',term:'dynamic pressure: how hard the air pushes on the rocket',v:'31.3',u:'kPa',g:.78},{l:'Structure',v:'19',u:'%',g:.19,t:.8}]},lamps:{}},
 caution:{say:'<b>Caution (will need action).</b> The STRUCTURE tile and the master light amber. The gauge of the same name is past its engraved tick, and the fix is written under it in the readout\'s own colour.',
  met:'00:58',spd:'512',ref:'surface',mach:['Mach','1.85'],alt:'12.3',altU:'km',rows:[['Climb','+471','m/s'],['Ap','24.8','km']],hdg:'090',pitch:'71',thr:100,sas:'hold',modes:['hold','pro'],
  stage:{n:2,name:'Petrel',fuel:58,left:'0:58',dv:'1890',next:[[3,['decouple','ignite Wren']],[4,['chute']]]},
  phase:{name:'Ascent',rows:[{l:'Q',term:'dynamic pressure: how hard the air pushes on the rocket',v:'35.5',u:'kPa',g:.89},{l:'Structure',v:'82',u:'%',g:.82,t:.8,fix:'At the adapter: throttle down'}]},lamps:{Structure:'amber'}},
 warning:{say:'<b>Warning (act now).</b> STRUCTURE is red, with a white frame so it differs from amber without colour (try Grey); the master reads WARNING. HEAT lit amber, so its row appeared on the phase card.',
  met:'01:01',spd:'548',ref:'surface',mach:['Mach','1.98'],alt:'13.6',altU:'km',rows:[['Climb','+489','m/s'],['Ap','27.9','km']],hdg:'090',pitch:'64',thr:100,sas:'hold',modes:['hold','pro'],
  stage:{n:2,name:'Petrel',fuel:55,left:'0:55',dv:'1805',next:[[3,['decouple','ignite Wren']],[4,['chute']]]},
  phase:{name:'Ascent',rows:[{l:'Q',term:'dynamic pressure: how hard the air pushes on the rocket',v:'36.1',u:'kPa',g:.9},{l:'Structure',v:'96',u:'%',g:.96,t:.8,fix:'At the adapter: throttle down now'},{l:'Heat',v:'870',u:'K',g:.87,t:.8,fix:'Parachute is hottest: nose into the wind'}]},lamps:{Structure:'red',Heat:'amber'}},
 burn:{say:'<b>Orbit burn.</b> The phase card changed to what a burn needs; Pe joined Ap. The one prompt of the screen is a lit sentence on the card. The panel sits over the bright limb here: the worst background it meets.',
  met:'41:07',spd:'7780',ref:'orbit',mach:null,alt:'212',altU:'km',rows:[['Climb','+3','m/s'],['Ap','412','km'],['Pe','208','km']],hdg:'092',pitch:'0',thr:0,sas:'node',modes:['hold','pro','retro','node'],
  stage:{n:3,name:'Wren',fuel:71,left:'2:10',dv:'1632',next:[[4,['chute']]]},
  phase:{name:'Burn',rows:[{l:'Δv to go',v:'124',u:'m/s',g:1},{l:'Ignition in',v:'1:12',u:''},{l:'Burn time',v:'0:38',u:''}],pmt:'Burn at the marker'},lamps:{}}};
const TILES=['Heat','Structure','Link','Power','Fuel'],TERM={Ap:'apoapsis: the highest point of the path',Pe:'periapsis: the lowest point of the path'};
const lab=(t,x)=>`<span class="lab${x||TERM[t]?' term':''}"${x||TERM[t]?` title="${x||TERM[t]}"`:''}>${t}</span>`;
function render(){const s=ST[B.dataset.state],L=s.lamps,worst=Object.values(L).includes('red')?'red':Object.values(L).length?'amber':'';
  $('#stage').innerHTML=`<img id="today" src="today-flight.jpg" alt="">
  <section class="bz tl">${lab('Clock')}<span class="glass">T+ ${s.met}</span><button class="btn" title="pin more lines to the readout">Readout +</button></section>
  <section class="bz tr">${lab('Warp')}<span class="seg"><button class="btn">${tri(-1)}</button><span class="glass">1×</span><button class="btn">${tri(1)}</button></span><button class="btn">Map <span class="kbd">M</span></button><button class="btn">Menu <span class="kbd">Esc</span></button></section>

  <section class="bz bl"><div class="grp"><h2 class="h">Stage</h2>
    <span class="glass"><span class="dim">${s.stage.n}</span> ${s.stage.name}</span>
    <div class="grow">${lab('Fuel')}<div class="gz"><i style="width:${s.stage.fuel}%"></i></div><span class="glass">${s.stage.fuel}<span class="u">%</span></span></div>
    <div class="kv">${lab('Burn left')}<span class="glass r">${s.stage.left}</span>${lab('Δv')}<span class="glass r">${s.stage.dv}<span class="u">m/s</span></span></div></div>
    <div class="grp" style="margin-top:14px"><h2 class="h">Next <span class="kbd">Space</span></h2>
    <div class="glass" style="white-space:normal">${s.stage.next.map(([n,e],i)=>`<div class="srow${i?' dim':''}"><span class="ix">${n}</span><span>${e.map(x=>`<span class="tok">${x}</span>`).join('')}</span></div>`).join('')}</div></div></section>

  <section class="bz br"><div class="grp"><h2 class="h">${s.phase.name}</h2>
    ${s.phase.rows.map(r=>`<div class="grow${r.g==null?' flat':''}">${lab(r.l,r.term)}${r.g!=null?`<div class="gz"><i style="width:${r.g*100}%"></i>${r.t?`<b style="left:${r.t*100}%"></b>`:''}</div>`:''}<span class="glass">${r.v}${r.u?`<span class="u">${r.u}</span>`:''}</span>${r.fix?`<span class="glass fix">${r.fix}</span>`:''}</div>`).join('')}
    ${s.phase.pmt?`<span class="glass" style="margin-top:8px;white-space:normal">&gt; ${s.phase.pmt}</span>`:''}</div></section>

  <section class="bz main">
    <div class="col sas"><button class="btn on" aria-pressed="true">SAS <span class="kbd">T</span></button>
      <div class="keys">${s.modes.map(m=>`<button class="btn${m===s.sas?' on':''}" title="${m}"><svg viewBox="0 0 18 18">${SYM[m]}</svg></button>`).join('')}</div></div>
    <div class="col read">${lab('Speed')}<span class="glass r"><span class="big">${s.spd}</span><span class="u">m/s</span></span>
      <span class="seg"><button class="btn${s.ref==='surface'?' on':''}" style="flex:1">Surface</button><button class="btn${s.ref==='orbit'?' on':''}" style="flex:1">Orbit</button></span><span class="sp"></span>
      <div class="kv" style="margin:0">${s.mach?`${lab(s.mach[0])}<span class="glass r">${s.mach[1]}</span>`:''}${lab('Throttle')}<span class="glass r">${s.thr}<span class="u">%</span></span></div></div>
    <div class="thr"><div class="gz"><i style="height:${s.thr}%"></i></div></div>
    <div class="ballw"><span class="glass">${s.hdg}°<span class="u">hdg</span> &nbsp;${s.pitch}°<span class="u">pitch</span></span><img class="ball" src="nav-${B.dataset.state==='burn'?'orbit':'climb'}.png" alt="the navball"></div>
    <div class="col read">${lab('Altitude')}<span class="glass r"><span class="big">${s.alt}</span><span class="u">${s.altU}</span></span><span class="sp"></span>
      <div class="kv" style="margin:0">${s.rows.map(([l,v,u])=>`${lab(l)}<span class="glass r">${v}<span class="u">${u}</span></span>`).join('')}</div></div>
    <div class="col ann"><span class="lamp master ${worst}" title="click: acknowledge">Master<br>${worst==='red'?'warning':'caution'}</span>${TILES.map(t=>`<span class="lamp ${L[t]||''}">${t}</span>`).join('')}</div>
  </section>`;
  $('#who').innerHTML=s.say;
  for(const b of document.querySelectorAll('#bar button'))b.classList.toggle('on',b.dataset.state?B.dataset.state===b.dataset.state:b.dataset.ph?B.dataset.ph===b.dataset.ph:b.dataset.fig?B.dataset.fig===b.dataset.fig:b.dataset.keys?B.dataset.keys===b.dataset.keys:b.dataset.gz?B.dataset.gz===b.dataset.gz:B.classList.contains(b.dataset.cls))}
$('#bar').onclick=e=>{const d=e.target.dataset;if(!d||e.target.tagName!=='BUTTON')return;for(const k of['state','ph','fig','keys','gz'])if(d[k])B.dataset[k]=d[k];if(d.cls)B.classList.toggle(d.cls);render()};
const q=new URLSearchParams(location.search);for(const k of['state','ph','fig','keys','gz'])if(q.get(k))B.dataset[k]=q.get(k);for(const c of['squint','grey','today'])if(q.get(c))B.classList.add(c);
render();
// what a still can't show: bezels that overlap or leave the screen, and text that doesn't fit its box
window.CHECK=()=>document.fonts.ready.then(()=>{const S=$('#stage').getBoundingClientRect(),bz=[...document.querySelectorAll('.bz')].map(e=>[e.className,e.getBoundingClientRect()]),out=[];
  for(const[n,r]of bz)if(r.left<S.left||r.right>S.right||r.top<S.top||r.bottom>S.bottom)out.push('off screen: '+n);
  for(let i=0;i<bz.length;i++)for(let j=i+1;j<bz.length;j++){const a=bz[i][1],b=bz[j][1];if(a.left<b.right&&b.left<a.right&&a.top<b.bottom&&b.top<a.bottom)out.push('overlap: '+bz[i][0]+' / '+bz[j][0])}
  for(const e of document.querySelectorAll('.glass,.lab,.lamp,.btn,.col,.grp'))if(e.scrollWidth>e.clientWidth+1)out.push('too wide: '+e.className+' "'+e.textContent.trim().slice(0,24)+'" '+e.scrollWidth+'/'+e.clientWidth);
  const m=$('.main').getBoundingClientRect();return (out.join(' | ')||'fits')+' · main '+Math.round(m.width)+'×'+Math.round(m.height)+' · stage '+Math.round(S.width)+'×'+Math.round(S.height)});
</script>
</body>
</html>
