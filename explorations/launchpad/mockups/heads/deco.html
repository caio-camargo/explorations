<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Puppet heads, art deco</title>
<!-- Launchpad mock-up, Q220 round 2 for head (b) (Caio 2026-10-10: "a more art deco direction, faceted, more chiselled
     faces rather than a round head as the base … the same face in different ways"). One face, six treatments. The head
     is a polyhedron: an intersection of planes (mirrored left/right), an eye socket cut out, a wedge nose, ears and a
     hair shell added; facet edges are found from the two nearest planes, so they can be inked. Per variant: the face
     at 3/4 in its helmet, a front and a profile study without the helmet, a grin and alarm, and 48 px thumbnails.
     A standalone page: never loaded by index.html. ?rows=0,1,2 draws some rows only; ?still hides the bar. -->
<style>
  :root { --bg: #0e1116; --fg: #e7e9ee; --dim: #8b93a3; --acc: #f2b84b; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
  #wrap { position: relative; width: 1280px; }
  canvas { display: block; }
  #ov { position: absolute; inset: 0; pointer-events: none; }
  #ov div { position: absolute; white-space: nowrap; }
  #ov .h { font-size: 15px; font-weight: 600; color: var(--acc); }
  #ov .l { color: var(--dim); font-size: 12px; }
  #ov .t { white-space: normal; color: var(--fg); font-size: 12px; line-height: 1.4; }
  #bar { position: fixed; top: 8px; right: 8px; z-index: 2; background: rgba(14, 17, 22, .85); padding: 6px 8px; border-radius: 6px; }
  #bar a { color: var(--acc); }
  body.still #bar { display: none; }
</style>

<body>

<div id="wrap"><canvas id="c"></canvas><canvas id="zoom" style="position:absolute;left:0;top:0"></canvas><div id="ov"></div></div>
<script>
'use strict';
const Q = new URLSearchParams(location.search);
if (Q.has('still')) document.body.classList.add('still');
// ---- the variants: soft (edge rounding, R), detail (0: few planes, 1: cheek hollows and a jaw angle), hair (0 plain
// block, 1 finger waves, 2 stepped terraces, 3 streamline grooves), shade (0 flat facets, 1 two tones + inked edges,
// 2 painted gradient (Lempicka), 3 bronze with enamel eyes), nose/jaw/cheek scale
const VARS = [
  { name: '1. Carved block', soft: 0, detail: 0, hair: 0, shade: 0, nose: 1, jaw: 1, cheek: 1,
    text: 'Few planes, each one flat-lit: a carved and lacquered wooden puppet head, the nearest to Thunderbirds\' workshop.' },
  { name: '2. Chiselled, inked', soft: 0, detail: 1, hair: 1, shade: 1, nose: 1, jaw: 1, cheek: 1.03,
    text: 'More planes (cheek hollows, the jaw\'s angle), two tones and an ink line on every facet edge: the crew\'s flat colour and ink (W19) on a cut head. Finger-wave hair.' },
  { name: '3. Lempicka', soft: .05, detail: 1, hair: 1, shade: 2, nose: 1, jaw: 1, cheek: 1.03,
    text: 'The same planes with softened edges and painted light: warm highlights, cool shadows, a sheen. Tamara de Lempicka\'s portraits, 1920s.' },
  { name: '4. Streamline', soft: .13, detail: 0, hair: 3, shade: 2, nose: 1.15, jaw: .97, cheek: 1,
    text: 'Planes rounded into a keel: a hood ornament\'s face, the nose and brow one sweep, hair in speed grooves. The 1930s.' },
  { name: '5. Ziggurat', soft: 0, detail: 1, hair: 2, shade: 1, nose: 1, jaw: 1.03, cheek: 1.03,
    text: 'Chiselled and inked, the hair stepped like a skyscraper\'s crown (the Chrysler, Rockefeller Center\'s reliefs).' },
  { name: '6. Bronze', soft: .02, detail: 1, hair: 1, shade: 3, nose: 1, jaw: 1, cheek: 1.03,
    text: 'The chiselled head cast in bronze, eyes and lips in enamel: a monument (Atlas, Prometheus). Skin tone is lost; shown for the form.' },
];
const P = { name: 'Ada Marsh', skin: [.95, .77, .64], hair: [.36, .17, .08], iris: [.28, .45, .62], brow: 1 };
const EXPR = {
  neutral: { label: 'Neutral', brow: [0, 0, .2], eye: 1, look: [.25, 0], mouth: [.12, .2, 0, 0], g: 0, tint: [0, 0, 0] },
  grin: { label: 'Grin', brow: [.04, .2, .6], eye: .9, look: [.3, .05], mouth: [.22, 1, .09, 1], g: 0, tint: [0, 0, 0] },
  alarm: { label: 'Alarm', brow: [.08, 1, .3], eye: 1.45, look: [.7, -.1], mouth: [.07, 0, .14, 0], g: 0, tint: [.55, .07, .04] },
};

const cv = document.getElementById('c'), gl = cv.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false });
const VS = `#version 300 es
in vec2 p;out vec2 v;void main(){v=p;gl_Position=vec4(p,0.,1.);}`;
const FS = `#version 300 es
precision highp float;in vec2 v;out vec4 o;
uniform vec2 uRes;uniform vec3 uCam,uTgt;uniform float uFov,uShell;
uniform float uHead,uHelmR;uniform vec3 uHC,uHCw;
uniform vec3 uSkin,uHair,uIris;uniform float uBrowW;
uniform float uSoft,uDetail,uHairS,uShade,uNoseS,uJaw,uCheek;
uniform vec3 uBrow;uniform float uEyeO;uniform vec2 uLook;uniform vec4 uMouth;uniform float uG;uniform vec3 uTint;
const vec3 SUN=normalize(vec3(-.55,.7,.55));
const vec3 SUIT=vec3(.82,.86,.9),TRIM=vec3(.86,.22,.16),INK=vec3(.045,.04,.045),BRONZE=vec3(.72,.48,.24);
const float TW=.22,TD=.14,TH=.55,LEGL=.8,ARML=.58,ARMR=.055;const vec3 BOOT=vec3(.07,.06,.15);
const vec3 A=vec3(.75,0.,.05);const float YAW=.35;
float gAA=.01;
float sdBox(vec3 p,vec3 b){vec3 q=abs(p)-b;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.);}
float sdRBox(vec3 p,vec3 b,float r){return sdBox(p,b-r)-r;}
float sdCapT(vec3 p,vec3 a,vec3 b,float ra,float rb){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h)-mix(ra,rb,h);}
float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
float smax(float a,float b,float k){return -smin(-a,-b,k);}
float seg2(vec2 p,vec2 a,vec2 b){vec2 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h);}
vec3 toLocal(vec3 p){vec3 q=p-A;float c=cos(YAW),s=sin(YAW);q.xz=mat2(c,s,-s,c)*q.xz;return q;}
// ---- polyhedra. pl() adds a plane: sS is the (softened) intersection, sA/sB the two highest plane values (sharp),
// so sA − sB near 0 marks a facet edge
float sA,sB,sS,K;vec3 nA,nB;
void beg(float k){sA=-1e9;sB=-1e9;sS=-1e9;K=k;}
void pl(vec3 q,vec3 n,float c){n=normalize(n);float v=dot(q,n)-c;sS=K>0.?smax(sS,v,K):max(sS,v);if(v>sA){sB=sA;nB=nA;sA=v;nA=n;}else if(v>sB){sB=v;nB=n;}}
float gap(){return (sA-sB)/max(length(nA-nB),.05);}   // distance to the edge line, roughly
void plm(vec3 q,vec3 n,float c){pl(q,n,c);pl(q,vec3(-n.x,n.y,n.z),c);}
void skullP(vec3 q,float off){   // q in units of R: face +z, y up; off inflates (the hair shell)
 float dd=mix(4.,0.,uDetail);
 pl(q,vec3(0.,1.,0.),.98+off);plm(q,vec3(.55,.8,0.),1.+off);pl(q,vec3(0.,.75,.66),1.+off);pl(q,vec3(0.,.15,1.),.84+off);
 plm(q,vec3(1.,0.,0.),.76+off);plm(q,vec3(.7,.1,.7),.9+off);pl(q,vec3(0.,0.,-1.),.88+off);pl(q,vec3(0.,.7,-.7),.98+off);
 plm(q,vec3(.7,0.,-.7),.95+off);pl(q,vec3(0.,-.7,-.7),.9+off);
 pl(q,vec3(0.,0.,1.),.8+off);   // the muzzle's front
 plm(q,vec3(.75,-.15,.65),.8*uCheek+off);   // cheekbones
 plm(q,vec3(.62,-.5,.6),.76+dd+off);   // cheek hollows (detail)
 plm(q,vec3(.9,-.42,0.),.76*uJaw+off);   // the jaw's sides
 pl(q,vec3(0.,-1.,0.),.98+off);pl(q,vec3(0.,-.55,.84),.86+off);   // chin
 plm(q,vec3(.5,-.78,.42),.82+dd+off);}   // the jaw's angle (detail)
float headC(vec3 q){beg(uSoft);skullP(q,0.);return sS;}
float sockC(vec3 q){vec3 s=vec3(abs(q.x),q.y,q.z);beg(uSoft*.5);
 pl(s,vec3(0.,1.,-.6),-.286);pl(s,vec3(0.,-1.,.8),.6);pl(s,vec3(1.,0.,.55),.92);pl(s,vec3(0.,0.,-1.),-.77);return sS;}   // one band across both eyes: a brow ledge above, the cheeks ramp up into it
float noseC(vec3 q){vec3 n=q-vec3(0.,-.08,.79);n.z/=uNoseS;beg(uSoft*.6);
 pl(n,vec3(.9,0.,.45),.068);pl(n,vec3(-.9,0.,.45),.068);pl(n,vec3(0.,.35,1.),.09);pl(n,vec3(0.,1.,-.1),.21);pl(n,vec3(0.,-1.,-.3),.2);pl(n,vec3(0.,0.,-1.),.05);
 return sS;}
float earC(vec3 q){vec3 s=vec3(abs(q.x),q.y,q.z);beg(uSoft*.5);
 pl(s,vec3(1.,0.,0.),.84);pl(s,vec3(-1.,0.,0.),-.66);pl(s,vec3(0.,1.,0.),.12);pl(s,vec3(0.,-1.,0.),.3);pl(s,vec3(0.,0.,1.),.06);pl(s,vec3(0.,0.,-1.),.16);pl(s,vec3(.6,0.,.8),.52);return sS;}
float hairC(vec3 q){float th=.06;
 if(uHairS>.5&&uHairS<1.5)th=.055+.028*sin((q.y*1.1+.32*q.x+.1*q.z)*11.);   // finger waves
 if(uHairS>1.5&&uHairS<2.5)th=.03+.045*floor(clamp((1.-q.y)*3.2,0.,4.));   // terraces, wider going down
 if(uHairS>2.5)th=.08-.03*smoothstep(.32,.46,abs(fract(q.y*6.5)-.5));   // speed grooves
 beg(uSoft);skullP(q,th);
 pl(q,vec3(.22,-.8,.6),.1);pl(q,vec3(0.,-1.,0.),.3);pl(q,vec3(0.,-.4,.92),.62);   // the hairline, parted a little to one side; sideburns stop at the ears
 return sS;}
// ---- the figure (portraits: torso, arms, neck ring, helmet). Materials: 5 suit, 6 trim, 7 skin, 8 shell, 15 hair
vec2 mapA(vec3 p){
 vec3 q=toLocal(p);float hip=LEGL+BOOT.y*1.2,sh=hip+TH,neck=sh+.0325;vec2 r=vec2(1e9,0.);
 float t=sdRBox(q-vec3(0.,hip+TH*.5,0.),vec3(TW,TH*.55,TD),min(TW,TD)*.85);if(t<r.x)r=vec2(t,5.);
 float pk=sdRBox(q-vec3(0.,hip+TH*.62,TD*.95),vec3(TW*.55,TH*.16,TD*.25),.02);if(pk<r.x)r=vec2(pk,6.);
 vec3 sL=vec3(-TW*1.05,sh-ARMR,0.),sR=vec3(TW*1.05,sh-ARMR,0.);
 float a=min(sdCapT(q,sL,sL+vec3(-.06,-ARML*.5,.04),ARMR*1.1,ARMR),sdCapT(q,sR,sR+vec3(.06,-ARML*.5,.04),ARMR*1.1,ARMR));if(a<r.x)r=vec2(a,5.);
 if(uShell>.5){float nr=length(vec2(length(q.xz)-uHelmR*.78,(q.y-neck-.01)*1.6))-.028;if(nr<r.x)r=vec2(nr,6.);
  vec3 hp=q-uHC;float s2=abs(length(hp)-uHelmR)-.012,fwd=dot(normalize(hp),normalize(vec3(0.,.12,1.)));
  s2=max(s2,(fwd-.2)*uHelmR);s2=max(s2,-(hp.y+uHelmR*.82));if(s2<r.x)r=vec2(s2,8.);}
 else{float nr=sdCapT(q,vec3(0.,neck-.02,0.),vec3(0.,neck+.02,0.),.11,.1);if(nr<r.x)r=vec2(nr,6.);}   // a collar for the studies
 float R=uHead;vec3 h=(q-uHC)/R;
 float nk=sdCapT(q,vec3(0.,neck-.03,-.01),uHC-vec3(0.,.6*R,.12*R),.052,.048);
 float hd=max(headC(h),-sockC(h));hd=min(hd,noseC(h));hd=min(hd,earC(h));hd=min(hd*R,nk);if(hd<r.x)r=vec2(hd,7.);
 float hr=hairC(h)*R;if(hr<r.x)r=vec2(hr,15.);
 return r;}
vec2 map(vec3 p){return mapA(p);}
// facet edges and creases near a surface point, in R units: small = on an edge
float edgeAt(vec3 p){vec3 h=(toLocal(p)-uHC)/uHead;
 float hd=headC(h),gh=gap(),sk=sockC(h),gs=gap(),ns=noseC(h),gn=gap(),er=earC(h),ge=gap(),hr=hairC(h),gr=gap();
 float fc=max(hd,-sk),gf=min(hd>-sk?gh:gs,abs(hd+sk));
 float d[4]=float[4](fc,ns,er,hr),g[4]=float[4](gf,gn,ge,gr);
 int i0=0;for(int i=1;i<4;i++)if(d[i]<d[i0])i0=i;
 float e=g[i0];for(int i=0;i<4;i++)if(i!=i0)e=min(e,abs(d[i]-d[i0])*6.);
 return e;}
vec3 nrm(vec3 p){vec2 e=vec2(.00035,0.);return normalize(vec3(map(p+e.xyy).x-map(p-e.xyy).x,map(p+e.yxy).x-map(p-e.yxy).x,map(p+e.yyx).x-map(p-e.yyx).x));}
float shadow(vec3 o,vec3 d){float res=1.,t=.006;for(int i=0;i<40;i++){float h=map(o+d*t).x;res=min(res,10.*h/t);t+=clamp(h,.006,.3);if(res<.002||t>4.)break;}return clamp(res,0.,1.);}
vec3 sky(vec3 d){
 if(uShell<.5)return mix(vec3(.2,.21,.23),vec3(.36,.37,.39),smoothstep(-.6,.6,d.y));   // a studio for the studies
 vec3 c=mix(vec3(.07,.08,.1),vec3(.17,.19,.23),smoothstep(-.6,.6,d.y));
 vec2 g=d.xy/max(-d.z,.3);c*=.85+.15*step(.08,fract(g.x*2.))*step(.08,fract(g.y*2.5));return c+uTint*.18;}
// ---- the painted face, in face coordinates f (units of R, orthographic from the front)
void paint(inout vec4 c,float d,vec3 col){c=mix(c,vec4(col,1.),1.-smoothstep(-gAA,gAA,d));}
float almond(vec2 p,float w,float h){   // a vesica: two circular arcs meeting at the corners
 float r=(w*w+h*h)/(2.*h);return max(length(p-vec2(0.,h-r)),length(p+vec2(0.,h-r)))-r;}
vec4 face(vec3 h){
 vec4 c=vec4(0.);if(h.z<.3)return c;vec2 f=h.xy;f.y+=.045*uG;
 float sx=f.x<0.?-1.:1.;vec2 m=vec2(abs(f.x),f.y);
 bool bz=uShade>2.5;vec3 lineC=bz?vec3(.2,.1,.05):INK,lipC=bz?vec3(.5,.1,.08):uSkin*vec3(.72,.38,.34);
 // eyes, on the socket floor: an almond, a lid shadow above it, an iris that follows the gaze
 vec2 e=vec2(.37,.045);float eh=.075*clamp(uEyeO,.2,1.5),ew=.135;
 float lid=almond(m-e-vec2(0.,.035),ew*1.05,eh+.05);paint(c,lid,uSkin*(bz?vec3(.55,.42,.3):vec3(.82,.68,.66)));
 float al=almond(m-e,ew,eh);paint(c,al-.016,lineC);paint(c,al,bz?vec3(.92,.9,.85):vec3(.97,.96,.94));
 vec2 lk=uLook*vec2(.05,.03);lk.x*=sx;float ir=length(m-e-lk);
 paint(c,max(ir-.05,al),bz?vec3(.1,.3,.35):uIris);paint(c,max(ir-.024,al),INK);
 paint(c,max(abs(m.y-e.y-eh+.004)-.012,al-.02),lineC);   // the heavy upper lid line
 // brows: thin, high, arched
 vec2 b0=vec2(.13,.25+uBrow.x+uBrow.y*.08),b1=vec2(.32,.29+uBrow.x+uBrow.z*.04+uBrow.y*.02),b2=vec2(.56,.24+uBrow.x-uBrow.y*.03);
 paint(c,min(seg2(m,b0,b1),seg2(m,b1,b2))-.017*uBrowW,bz?lineC:uHair*.55);
 // the mouth: a bowed upper lip and a full lower one when closed; open shapes as before
 float my=-.5,mw=uMouth.x,mc=uMouth.y,mo=uMouth.z,s=clamp(f.x/mw,-1.,1.);float base=my+mc*.08*(s*s-.35);
 if(mo<.02){float up=(abs(f.x)<mw*1.25)?base+.045*(1.-s*s)*(1.-.5*smoothstep(.0,.25,abs(s)-.05)+.4*smoothstep(.05,0.,abs(f.x))):base;
  float lo=base-.06*sqrt(max(1.-s*s,0.));float din=max(max(f.y-up+.012,lo-f.y),abs(f.x)-mw*1.05);
  paint(c,din,lipC);paint(c,length(vec2(max(abs(f.x)-mw*1.05,0.),f.y-base))-.009,lineC);}
 else{float k=uMouth.w>1.5?sqrt(max(1.-pow(s,4.),0.)):sqrt(max(1.-s*s,0.));float yU=base+mo*mix(.25,.75,smoothstep(.12,.06,mw))*k,yL=base-mo*k;
  float din=max(max(f.y-yU,yL-f.y),abs(f.x)-mw);paint(c,din-.03,lipC);paint(c,din-.008,lineC);paint(c,din,vec3(.32,.06,.06));
  if(uMouth.w>.5&&uMouth.w<1.5)paint(c,max(din,yU-.045-f.y),vec3(.97));}
 return c;}
vec3 albedo(float mt,vec3 p){
 if(mt<5.5)return SUIT;if(mt<6.5)return TRIM;if(mt>7.5&&mt<8.5)return SUIT*.97;
 vec3 base=mt<7.5?uSkin:uHair;if(uShade>2.5)base=BRONZE*(mt<7.5?1.:.8);
 if(mt<7.5){vec4 f=face((toLocal(p)-uHC)/uHead);return mix(base,f.rgb,f.a);}
 return base;}
float glassT(vec3 ro,vec3 rd,out vec3 gn){vec3 oc=ro-uHCw;float b=dot(oc,rd),cc=dot(oc,oc)-uHelmR*uHelmR,h=b*b-cc;if(h<0.)return -1.;float t=-b-sqrt(h);if(t<0.)return -1.;
 gn=normalize(ro+rd*t-uHCw);float c=cos(YAW),s=sin(YAW);vec3 f=normalize(vec3(0.,.12,1.));f.xz=vec2(c*f.x+s*f.z,-s*f.x+c*f.z);
 if(dot(gn,f)<.2||gn.y<-.82)return -1.;return t;}
void main(){
 vec2 uv=(v*.5)*vec2(uRes.x/uRes.y,1.);vec3 fw=normalize(uTgt-uCam),rt=normalize(cross(fw,vec3(0.,1.,0.))),up=cross(rt,fw);
 vec3 rd=normalize(fw+uv.x*rt*uFov+uv.y*up*uFov),ro=uCam;float pix=uFov/uRes.y;
 float t=0.,mn=1e9,tMn=0.;vec2 h=vec2(0.);bool hit=false;
 for(int i=0;i<200;i++){h=map(ro+rd*t);float r=h.x/max(t,.1);if(r<mn&&t>.2){mn=r;tMn=t;}if(h.x<.0003*t){hit=true;break;}t+=h.x*.85;if(t>12.)break;}
 vec3 col;
 if(!hit)col=sky(rd);
 else{vec3 p=ro+rd*t,n=nrm(p);float m=h.y;gAA=t*pix/uHead*.8;vec3 al=albedo(m,p);
  float dif=max(dot(n,SUN),0.),sha=shadow(p+n*.002,SUN),l=dif*sha;vec3 rf=reflect(rd,n);
  vec3 TD=normalize(normalize(uCam-p)+vec3(0.,-.4,0.));float tl=max(dot(n,TD),0.);
  bool head=m>6.5&&m<7.5||m>14.5;
  vec3 fill=vec3(.4,.4,.43)*(.7+.3*n.y)+vec3(.5,.45,.4)*tl+uTint*.6*tl;
  if(uShade<.5||!head){col=al*(l*vec3(1.,.96,.88)*.8+fill);}   // flat facets: each plane one tone
  else if(uShade<1.5){float b=l<.3?.7:1.;col=al*(b*vec3(1.,.97,.92)*.9+.12*vec3(.42,.42,.46)+uTint*.5*step(.4,tl));
   if(edgeAt(p)<min(gAA*1.1,.014))col=INK;}   // two tones and inked edges
  else if(uShade<2.5){vec3 warm=vec3(1.08,.95,.8),cool=vec3(.62,.62,.78);   // painted: warm light, cool shade, a sheen
   col=al*(mix(cool*.55+vec3(.3,.24,.2)*tl,warm*1.12,smoothstep(.0,.75,l))+uTint*.6*tl);col+=vec3(1.,.93,.82)*pow(max(dot(rf,SUN),0.),18.)*sha*.28;}
  else{vec3 env=sky(rf)*.6+vec3(.25,.22,.18)*(.5+.5*rf.y);   // bronze
   col=al*(l*vec3(1.,.95,.85)*.9+.22)*.55+al*env*.9;col+=BRONZE*pow(max(dot(rf,SUN),0.),40.)*sha*1.4;}}
 if(uShade>.5&&uShade<1.5&&mn<pix*1.3&&(!hit||t>tMn+.1*uHead))col=INK;   // inked silhouettes
 vec3 gn;float tg=glassT(ro,rd,gn);
 if(uShell>.5&&tg>0.&&(!hit||tg<t)){float fr=.06+.94*pow(1.-max(dot(-rd,gn),0.),4.);vec3 rfl=reflect(rd,gn);
  col=col*vec3(.95,.97,.98)*(1.-fr*.33)+sky(rfl)*fr*.3+vec3(1.,.95,.85)*pow(max(dot(rfl,SUN),0.),160.)*1.2;
  float rim=1.-abs(dot(rd,gn));col=mix(col,vec3(.03),smoothstep(1.-pix*14.,1.-pix*5.,rim));}
 col=col/(1.+col*.25);o=vec4(pow(clamp(col,0.,1.),vec3(1./2.2)),1.);}`;
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); document.title = 'SHADER ERROR'; } return s; }
const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

const L2W = l => [A[0] + Math.cos(YAW) * l[0] + Math.sin(YAW) * l[2], A[1] + l[1], A[2] - Math.sin(YAW) * l[0] + Math.cos(YAW) * l[2]];
const HC = [0, NECK + 1.1 * R, 0], HCW = L2W(HC), HR = R * HELM;
let H_ = 0;
// shot: 'portrait' (3/4 in the helmet), 'front' / 'profile' (studies, no helmet)
function tile(x, y, w, h, vi, ex, shot) {
  const V = VARS[vi], E = EXPR[ex];

const ov = document.getElementById('ov'), zc = document.getElementById('zoom'), zx = zc.getContext('2d');

  rows.forEach((vi, r) => {
    const y = 64 + r * 278, V = VARS[vi];
    L.push([12, y, V.name, 'h']);
    T.push([12, y + 22, 240, 240, vi, 'neutral', 'portrait']);
    [['neutral', 'front'], ['neutral', 'profile'], ['grin', 'portrait'], ['alarm', 'portrait']].forEach(([e, s], i) => T.push([258 + i * 176, y + 22, 170, 170, vi, e, s]));
    ['Front', 'Profile', 'Grin', 'Alarm'].forEach((t, i) => L.push([258 + i * 176, y + 194, t, 'l']));
    ['neutral', 'grin', 'alarm'].forEach((e, i) => { T.push([970 + i * 54, y + 22, 48, 48, vi, e, 'portrait']); Z.push([970 + i * 54, y + 22, 970 + i * 104, y + 80]); });
