<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Head mock-ups</title>
<!-- Launchpad mock-up for CREW.md part 1, the head (D11, QUEUE Q220): three heads on the stylised-human crew (W19), each
     in a helmet. Per head: a close-up on the pad, the whole figure, true-size 48 px thumbnails, five flight-portrait
     expressions and a roster of six people. A standalone page: never loaded by index.html.
     A WebGL2 raymarcher over signed distance fields (forked from mockups/crew/), one draw per tile; faces are painted on
     (decals in head space), as a texture would be in the game. ?view=a|b|c|compare picks a sheet; ?still hides the bar.
     The suit is the crew mock-up's placeholder (style c), not a school's suit: suits are Q219's. -->
<style>
  :root { --bg: #0e1116; --fg: #e7e9ee; --dim: #8b93a3; --acc: #f2b84b; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
  #wrap { position: relative; width: 1280px; }
  canvas { display: block; }
  #ov { position: absolute; inset: 0; pointer-events: none; }
  #ov div { position: absolute; white-space: nowrap; }
  #ov .h { font-size: 15px; font-weight: 600; color: var(--acc); }
  #ov .l { color: var(--dim); font-size: 12px; }
  #ov .t { white-space: normal; color: var(--fg); font-size: 12.5px; line-height: 1.45; }
  #bar { position: fixed; top: 8px; left: 8px; display: flex; gap: 6px; align-items: center; z-index: 2;
    background: rgba(14, 17, 22, .85); padding: 6px 8px; border-radius: 6px; }
  #bar button { background: #222833; color: var(--fg); border: 1px solid #39414f; border-radius: 4px; padding: 4px 9px; cursor: pointer; }
  #bar button.on { border-color: var(--acc); color: var(--acc); }
  body.still #bar { display: none; }
</style>
</head>
<body>
<div id="bar">
  <button data-view="a">(a) Ligne claire</button><button data-view="b">(b) Puppet</button><button data-view="c">(c) Toy peg</button>
  <button data-view="compare">Side by side</button>
</div>
<div id="wrap"><canvas id="c"></canvas><canvas id="zoom" style="position:absolute;left:0;top:0"></canvas><div id="ov"></div></div>

  alarm: { label: 'Alarm', brow: [.11, 1, .3], eye: 1.45, look: [.7, -.1], mouth: [.075, 0, .16, 0], g: 0, tint: [.55, .07, .04] },

const cv = document.getElementById('c'), gl = cv.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false });
const VS = `#version 300 es
in vec2 p;out vec2 v;void main(){v=p;gl_Position=vec4(p,0.,1.);}`;
const FS = `#version 300 es
precision highp float;in vec2 v;out vec4 o;
uniform vec2 uRes;uniform vec3 uCam,uTgt;uniform float uFov,uScene,uWave;
uniform float uType,uHead,uHelmR;uniform vec3 uHC,uHCw;
uniform vec3 uSkin,uHair,uNose,uIris;uniform float uStyle,uBrowW,uMous;

const vec3 SUN=normalize(vec3(-.55,.75,.6));
const vec3 SUIT=vec3(.82,.86,.9),TRIM=vec3(.86,.22,.16),INK=vec3(.045,.04,.045);
const float TW=.22,TD=.14,TH=.55,LEGL=.8,LEGR=.072,ARML=.58,ARMR=.055,GLOVE=.058;const vec3 BOOT=vec3(.07,.06,.15);
const vec3 A=vec3(.75,0.,.05);const float YAW=.35;
float gAA=.01;
// ---- primitives
float sdBox(vec3 p,vec3 b){vec3 q=abs(p)-b;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.);}
float sdRBox(vec3 p,vec3 b,float r){return sdBox(p,b-r)-r;}
float sdCap(vec3 p,vec3 a,vec3 b,float r){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h)-r;}
float sdCapT(vec3 p,vec3 a,vec3 b,float ra,float rb){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h)-mix(ra,rb,h);}
float sdEll(vec3 p,vec3 r){float k0=length(p/r),k1=length(p/(r*r));return k0*(k0-1.)/k1;}
float sdCone(vec3 p,float h,float r1,float r2){vec2 q=vec2(length(p.xz),p.y),k1=vec2(r2,h),k2=vec2(r2-r1,2.*h);
 vec2 ca=vec2(q.x-min(q.x,(q.y<0.)?r1:r2),abs(q.y)-h);vec2 cb=q-k1+k2*clamp(dot(k1-q,k2)/dot(k2,k2),0.,1.);
 float s=(cb.x<0.&&ca.y<0.)?-1.:1.;return s*sqrt(min(dot(ca,ca),dot(cb,cb)));}
float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float seg2(vec2 p,vec2 a,vec2 b){vec2 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h);}
vec3 toLocal(vec3 p){vec3 q=p-A;float c=cos(YAW),s=sin(YAW);q.xz=mat2(c,s,-s,c)*q.xz;return q;}
// ---- heads, in head space h (centre of the head, facing +z, y up)
vec3 eyeC(float sx){float R=uHead;return vec3(sx*.31*R,.04*R,.665*R);}   // the puppet's eyeballs
float skull(vec3 h){float R=uHead;
 if(uType<.5)return sdEll(h,R*vec3(.93,1.,.95));
 if(uType<1.5)return max(sdEll(h,R*vec3(.86,1.02,.9)),abs(h.x)-.8*R);
 float rc=.84*R*(1.-.05*h.y/R),hh=1.1*R,rr=.34*R;vec2 dd=vec2(length(h.xz)-rc+rr,abs(h.y)-hh+rr);
 return min(max(dd.x,dd.y),0.)+length(max(dd,0.))-rr;}
float headD(vec3 h){float R=uHead,d=skull(h);
 if(uType<.5){   // ligne claire: a round head, a small round chin, a small nose, ears
  d=smin(d,sdEll(h-vec3(0.,-.38*R,.1*R),R*vec3(.68,.58,.7)),.12*R);
  vec3 nq=h-vec3(0.,(-.12-.07*uNose.z)*R,(.9+.03*uNose.y)*R);d=smin(d,sdEll(nq,R*vec3(.1,.09,.07+.06*uNose.y)*uNose.x),.04*R);
  for(int i=0;i<2;i++){float sx=i==0?-1.:1.;d=smin(d,sdEll(h-vec3(sx*.9*R,-.06*R,0.),R*vec3(.1,.19,.13)),.04*R);}}
 else if(uType<1.5){   // puppet: carved planes
  d=max(d,dot(h,normalize(vec3(0.,.3,1.)))-.86*R);   // the forehead's plane
  for(int i=0;i<2;i++){float sx=i==0?-1.:1.;d=max(d,dot(h,normalize(vec3(sx*.8,-.25,.55)))-.75*R);}   // cheek planes
  float jw=sdRBox(h-vec3(0.,-.5*R,.05*R),R*vec3(.62,.42,.66),.1*R);
  jw=max(jw,dot(h,normalize(vec3(0.,-.55,.85)))-.66*R);d=smin(d,jw,.04*R);   // a square jaw, its chin planed
  d=smin(d,sdEll(h-vec3(0.,.2*R,.68*R),R*vec3(.58,.09,.18)),.07*R);   // the brow ledge
  for(int i=0;i<2;i++){float sx=i==0?-1.:1.;d=max(d,-(length(h-eyeC(sx))-.185*R));   // sockets
   d=smin(d,sdRBox(h-vec3(sx*.82*R,-.06*R,0.),R*vec3(.06,.2,.12),.04*R),.03*R);}   // ears, flat
  vec3 nq=h-vec3(0.,(-.11-.05*uNose.z)*R,.84*R);float c=cos(-.28),s=sin(-.28);nq.yz=mat2(c,-s,s,c)*nq.yz;
  d=smin(d,sdRBox(nq,R*vec3(.06*uNose.x,.13*uNose.y,.075),.025*R),.05*R);}   // a block nose
 return d;}
// the hairline: > 0 where hair grows (in R units)
float hairKeep(vec3 h){float R=uHead,y=h.y/R,z=h.z/R;
 if(uStyle>4.5)return min(min(.42-y,y+.32),.12-z);   // receding: sides and back only
 vec4 k=uStyle<.5?vec4(-.22,.5,-.3,.62):uStyle<1.5?vec4(-.25,.44,-.3,.62):uStyle<2.5?vec4(-.82,.36,.32,.72):uStyle<3.5?vec4(-.3,.48,-.3,.62):vec4(-.4,.5,-.3,.6);
 return y-mix(k.x,k.y,smoothstep(k.z,k.w,z));}
float hairD(vec3 h){float R=uHead;if(uStyle>5.5)return 1e9;
 float th=uType>1.5?.09*R:.055*R;
 if(uStyle>3.5&&uStyle<4.5)th=.12*R+.035*R*sin(h.x/R*15.)*sin(h.y/R*15.+1.)*sin(h.z/R*15.+2.);   // curls
 if(uStyle>1.5&&uStyle<2.5)th+=.07*R*smoothstep(.2,-.75,h.y/R);   // the bob flares
 float d=max(skull(h)-th,-hairKeep(h)*R);
 if(uStyle>.5&&uStyle<1.5)d=smin(d,sdEll(h-vec3(-.28*R,.78*R,.5*R),R*vec3(.42,.17,.3)),.05*R);   // the side part's wave
 if(uStyle>2.5&&uStyle<3.5)d=min(d,length(h-vec3(0.,.45*R,uType>1.5?-.92*R:-.88*R))-.29*R);   // a bun
 return d;}
// ---- the astronaut (local frame, y up, facing +z). Materials: 5 suit, 6 trim, 7 skin, 8 helmet shell, 9 eyeball, 11 boots/gloves, 15 hair
vec2 mapA(vec3 p){
 vec3 q=toLocal(p);
 float hip=LEGL+BOOT.y*1.2,sh=hip+TH,neck=sh+.0325;
 vec2 r=vec2(1e9,0.);
 if(uScene>.5){   // legs and boots (the portraits don't need them)
 for(int i=0;i<2;i++){float sx=i==0?-1.:1.;vec3 h=vec3(sx*TW*.48,hip,0.),k=vec3(sx*TW*.52,hip*.5,.02),an=vec3(sx*TW*.5,BOOT.y*1.5,0.);
  float d=min(sdCapT(q,h,k,LEGR*1.08,LEGR),sdCapT(q,k,an,LEGR,LEGR*.85));if(d<r.x)r=vec2(d,5.);
  float b=sdRBox(q-vec3(sx*TW*.5,BOOT.y,BOOT.z*.35),BOOT,min(BOOT.x,BOOT.y)*.7);if(b<r.x)r=vec2(b,11.);}}
 float t=sdRBox(q-vec3(0.,hip+TH*.5,0.),vec3(TW,TH*.55,TD),min(TW,TD)*.85);
 float pk=sdRBox(q-vec3(0.,hip+TH*.62,TD*.95),vec3(TW*.55,TH*.16,TD*.25),.02);
 float bt=sdRBox(q-vec3(0.,hip+TH*.08,0.),vec3(TW*1.04,TH*.06,TD*1.06),.02);
 if(t<r.x)r=vec2(t,5.);if(pk<r.x)r=vec2(pk,6.);if(bt<r.x)r=vec2(bt,6.);
 vec3 sL=vec3(-TW*1.05,sh-ARMR,0.),sR=vec3(TW*1.05,sh-ARMR,0.);
 vec3 eL=sL+vec3(-.06,-ARML*.5,.04),wL=eL+vec3(.0,-ARML*.48,.06);
 vec3 eR=mix(sR+vec3(.06,-ARML*.5,.04),sR+vec3(ARML*.42,ARML*.12,.05),uWave),wR=eR+mix(vec3(0.,-ARML*.48,.06),vec3(.04,ARML*.5,.02),uWave);
 float a=min(min(sdCapT(q,sL,eL,ARMR*1.1,ARMR),sdCapT(q,eL,wL,ARMR,ARMR*.9)),min(sdCapT(q,sR,eR,ARMR*1.1,ARMR),sdCapT(q,eR,wR,ARMR,ARMR*.9)));
 if(a<r.x)r=vec2(a,5.);
 float g=min(length(q-wL-vec3(0.,-GLOVE*.6,0.))-GLOVE,length(q-wR-vec3(0.,mix(-GLOVE,GLOVE,uWave)*.6,0.))-GLOVE);if(g<r.x)r=vec2(g,11.);
 // the neck ring and the helmet shell, its faceplate opening forward and a little up
 float nr=length(vec2(length(q.xz)-uHelmR*.78,(q.y-neck-.01)*1.6))-.028;if(nr<r.x)r=vec2(nr,6.);
 vec3 hp=q-uHC;float s2=abs(length(hp)-uHelmR)-.012,fwd=dot(normalize(hp),normalize(vec3(0.,.12,1.)));
 s2=max(s2,(fwd-.2)*uHelmR);s2=max(s2,-(hp.y+uHelmR*.82));if(s2<r.x)r=vec2(s2,8.);
 // the neck, the head, the hair, the puppet's eyes
 float nk=sdCap(q,vec3(0.,neck-.03,0.),uHC-vec3(0.,.5*uHead,.05*uHead),.048);if(nk<r.x)r=vec2(nk,7.);
 vec3 h=q-uHC;
 float hd=headD(h);if(hd<r.x)r=vec2(hd,7.);
 float hr=hairD(h);if(hr<r.x)r=vec2(hr,15.);
 if(uType>.5&&uType<1.5)for(int i=0;i<2;i++){float e=length(h-eyeC(i==0?-1.:1.))-.165*uHead;if(e<r.x)r=vec2(e,9.);}
 if(uMous>.5&&uType>.5&&uType<1.5){float m=sdEll(h-vec3(0.,-.36*uHead,.84*uHead),uHead*vec3(.26,.06,.07));if(m<r.x)r=vec2(m,15.);}   // the puppet's is sculpted
 return r;}
vec2 map(vec3 p){
 vec2 r=vec2(1e9,0.);
 if(uScene>.5){
 r=vec2(p.y+.06,1.);r.x=max(r.x,abs(p.z-.2)-1.45);r.x=max(r.x,abs(p.x)-6.);
 float rl=min(sdCap(p,vec3(-6.,1.05,1.6),vec3(6.,1.05,1.6),.025),sdCap(p,vec3(-6.,.55,1.6),vec3(6.,.55,1.6),.018));
 float px=p.x-clamp(floor(p.x/1.2+.5)*1.2,-6.,6.);rl=min(rl,sdCap(vec3(px,p.y,p.z),vec3(0.,0.,1.6),vec3(0.,1.05,1.6),.025));
 rl=min(rl,sdBox(p-vec3(0.,.06,1.6),vec3(6.,.06,.008)));
 vec3 sq=p-vec3(3.3,0.,0.);rl=min(rl,min(sdCap(sq,vec3(0.,1.05,-1.2),vec3(0.,1.05,1.6),.025),sdCap(sq,vec3(0.,.55,-1.2),vec3(0.,.55,1.6),.018)));
 float pz=sq.z-clamp(floor(sq.z/.95+.5)*.95,-1.2,1.6);rl=min(rl,sdCap(vec3(sq.x,sq.y,pz),vec3(0.),vec3(0.,1.05,0.),.025));if(rl<r.x)r=vec2(rl,2.);
 for(int i=0;i<2;i++){float gx=i==0?-3.4:3.6;float c=sdBox(p-vec3(gx,1.5,-2.6),vec3(.16,4.,.16));if(c<r.x)r=vec2(c,12.);}
 vec3 bq=p-vec3(.1,2.1,-2.75);float br=min(sdCap(bq,vec3(-3.4,-2.1,0.),vec3(3.6,2.,0.),.05),sdCap(bq,vec3(-3.4,2.,0.),vec3(3.6,-2.1,0.),.05));if(br<r.x)r=vec2(br,12.);
 vec3 cq=p-vec3(-.55,1.25,-1.25);float cap=sdCone(cq,1.15,.95,.42);
 cap=min(cap,sdCap(cq,vec3(0.,1.15,0.),vec3(0.,1.55,0.),.3));
 float hole=sdRBox(cq-vec3(.2,-.25,.85),vec3(.32,.42,.5),.08);float shellIn=sdCone(cq,1.1,.88,.36);
 float hatchIn=max(hole,shellIn);cap=max(cap,-hole);if(cap<r.x)r=vec2(cap,3.);

 vec3 dq=cq-vec3(.62,-.25,.62);float dc=cos(1.1),ds=sin(1.1);dq.xz=mat2(dc,-ds,ds,dc)*dq.xz;float dr=sdRBox(dq-vec3(.3,0.,0.),vec3(.3,.4,.03),.05);if(dr<r.x)r=vec2(dr,14.);}
 vec2 a=mapA(p);if(a.x<r.x)r=a;
 return r;}
vec3 nrm(vec3 p){vec2 e=vec2(.0005,0.);return normalize(vec3(map(p+e.xyy).x-map(p-e.xyy).x,map(p+e.yxy).x-map(p-e.yxy).x,map(p+e.yyx).x-map(p-e.yyx).x));}
float shadow(vec3 o,vec3 d){float res=1.,t=.01;for(int i=0;i<40;i++){float h=map(o+d*t).x;res=min(res,10.*h/t);t+=clamp(h,.01,.4);if(res<.002||t>8.)break;}return clamp(res,0.,1.);}
vec3 sky(vec3 d){
 if(uScene<.5){   // the cabin behind a flight portrait: dim panels, a lit window edge
  vec3 c=mix(vec3(.07,.08,.1),vec3(.17,.19,.23),smoothstep(-.6,.6,d.y));
  vec2 g=d.xy/max(d.z*-1.,.3);c*=.85+.15*step(.08,fract(g.x*2.))*step(.08,fract(g.y*2.5));
  return c+uTint*.18;}

void paint(inout vec4 c,float d,vec3 col){c=mix(c,vec4(col,1.),1.-smoothstep(-gAA,gAA,d));}
vec4 face(vec3 h){
 float R=uHead;vec4 c=vec4(0.);if(h.z<0.)return c;
 vec2 f=uType>1.5?vec2(atan(h.x,h.z)*.84,h.y/R):h.xy/R;
 f.y+=.045*uG;   // under g the face is pulled down
 float sx=f.x<0.?-1.:1.;vec2 m=vec2(abs(f.x),f.y);
 float ex=uType>1.5?.3:.3,ey=uType>1.5?.16:.1,by=uType<.5?.34:uType<1.5?.22:.4,my=uType<.5?-.45:uType<1.5?-.5:-.4;
