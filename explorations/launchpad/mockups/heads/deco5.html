<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puppet heads, round 5</title>
<!-- Launchpad mock-up, Q220 round 5 for head (b), Caio's brief (2026-10-10), on round 4's carved mass, hair and brow:
     (1) turn the corner: a side plane, the cheekbone and jaw line running back to simple carved ears; the face part of
     the head, not a mask in the hair; ¾ is the main view; (2) open eyes, a carved upper-lid ledge, a painted iris and a
     catchlight, deep under the brow; (3) the mouth wrapped round a curve, volume in both lips; (4) a nose base: a plane
     under the tip, nostril wings; (5) heroic proportions: a shorter, thicker neck (Thunderbirds' head-to-neck ratio),
     a broader jaw; (6) paint: warmth on cheeks, nose and ears, tinted lips, a satin sheen. Neutral only, ¾, front and
     profile, each beside references at the same angle. The references load from the repo's intake/ and are never
     committed (copyrighted; the repo is public); ?intake=<folder URL> points elsewhere. ?still hides nothing (no bar). -->
<style>
  :root { --bg: #0e1116; --fg: #e7e9ee; --dim: #8b93a3; --acc: #f2b84b; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
  #wrap { position: relative; width: 1280px; height: 1420px; }
  canvas { position: absolute; left: 0; top: 0; }
  .ref { position: absolute; object-fit: cover; background: #1b1f27; width: 270px; height: 270px; }
  .lab { position: absolute; color: var(--dim); font-size: 12px; }
  .h { position: absolute; font-size: 15px; font-weight: 600; color: var(--acc); }
  .t { position: absolute; font-size: 12.5px; line-height: 1.5; width: 830px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="1420"></canvas><div id="ov"></div></div>
<script>
'use strict';
const Q = new URLSearchParams(location.search);
const BASE = Q.get('intake') || '../../../../intake/';
const P = { skin: [.9, .7, .56], hair: [.4, .2, .1], iris: [.3, .46, .62], lip: [.72, .33, .3], flush: [.86, .42, .38] };
// rows: view angle (about the head's vertical axis; + shows its left side), references at the same angle
const ROWS = [
  { name: '¾ (the main view)', a: .62, refs: [['images (2).jpg', 'Thunderbirds: head-to-neck', '50% 35%'], ['images (1).jpg', 'The Incredibles: a stylised mass', '50% 40%'], ['sculpture-restoration-new-orleans-02-e1615915886826.jpg', 'A deco relief: heads in ¾', '50% 18%']] },
  { name: 'Front', a: 0, refs: [['images (4).jpg', 'A deco head: the planes, the lids', '50% 35%'], ['vera.jpg', 'Vera: carved wood', '50% 25%'], ['art-deco-school--20th-century-pair-art-d-EHHC4-570.jpg', 'A deco pair: hair as a carved mass', '20% 30%']] },
  { name: 'Profile', a: Math.PI / 2, refs: [['images (3).jpg', 'A deco profile in stone', '18% 45%'], ['images (5).jpg', 'Lempicka: paint, tinted lips', '40% 30%'], ['86.jpg', 'The Incredibles: a profile', '72% 50%']] },
];
const ov = document.getElementById('ov');
let html = '<div class="h" style="left:12px;top:12px">(b) Puppet, round 5: Ada Marsh, neutral, in ¾, front and profile, beside references at the same angle</div>';
ROWS.forEach((r, i) => {
  const y = 44 + i * 456;
  html += `<div class="lab" style="left:12px;top:${y + 424}px">Ours, ${r.name.toLowerCase()}</div>`;
  r.refs.forEach(([f, t, pos], j) => { const x = 440 + j * 278;
    html += `<img class="ref" src="${BASE}${encodeURIComponent(f)}" style="left:${x}px;top:${y}px;object-position:${pos}" alt="reference missing (it lives in intake/)"><div class="lab" style="left:${x}px;top:${y + 272}px">${t}</div>`; });
});
html += `<div class="t" style="left:440px;top:${44 + 300}px"><b>Round 5:</b> the side of the head is a plane, the cheekbone and jaw line run back to carved ears, the hair stops above them.
 Eyes open under a carved lid ledge, painted iris and catchlight. The lips wrap round the mouth's curve. The nose has a base and nostril wings.
 A shorter, thicker neck and a broader jaw. Painted warmth on cheeks, nose and ears; tinted lips; satin.</div>`;
ov.innerHTML = html;
const cv = document.getElementById('c'), gl = cv.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false });
const VS = `#version 300 es
in vec2 p;out vec2 v;void main(){v=p;gl_Position=vec4(p,0.,1.);}`;
const FS = `#version 300 es
precision highp float;in vec2 v;out vec4 o;
uniform vec2 uRes;uniform vec3 uCam,uTgt,uKey;uniform float uFov;uniform vec3 uSkin,uHair,uIris,uLip,uFlush;
#define KEY uKey
float sdEll(vec3 p,vec3 r){float k0=length(p/r),k1=length(p/(r*r));return k0*(k0-1.)/k1;}
float sdCapT(vec3 p,vec3 a,vec3 b,float ra,float rb){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h)-mix(ra,rb,h);}
float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
float smax(float a,float b,float k){return -smin(-a,-b,k);}
float plane(vec3 p,vec3 n,vec3 at){return dot(p-at,normalize(n));}
float cut(float d,vec3 p,vec3 n,vec3 at,float k){return smax(d,plane(p,n,at),k);}
float cutM(float d,vec3 p,vec3 n,vec3 at,float k){d=cut(d,p,n,at,k);return cut(d,p,vec3(-n.x,n.y,n.z),vec3(-at.x,at.y,at.z),k);}
// ---- the head, in head units (the cranium's half-width ~.8), face +z, y up
const float SH=.012,SO=.07;
float mass(vec3 p){
 float d=sdEll(p-vec3(0.,.16,-.1),vec3(.78,.88,.94));   // cranium
 d=smin(d,sdEll(p-vec3(0.,-.4,.1),vec3(.66,.58,.64)),.28);   // the jaw, broad
 d=smin(d,sdEll(p-vec3(0.,-.78,.46),vec3(.34,.2,.3)),.16);   // the chin, forward
 d=smin(d,sdEll(p-vec3(0.,.24,.55),vec3(.6,.15,.3)),.12);   // the brow, forward
 vec3 n=p-vec3(0.,-.02,0.);float ridge=dot(n.yz,normalize(vec2(.28,1.)))-.9;   // the nose on the forehead's line
 float wedge=max(max(abs(n.x)*.95+n.z*.32-.38,ridge),max(n.y-.32,-(n.y+.13)-n.z*.2));   // its base: the plane under the tip
 wedge=max(wedge,-(n.z-.55));d=smin(d,wedge,.05);
 for(int i=0;i<2;i++){float sx=i==0?-1.:1.;d=smin(d,sdEll(p-vec3(sx*.1,-.33,.78),vec3(.075,.06,.07)),.035);}   // nostril wings
 return d;}
float carve(vec3 p,float d){
 d=cutM(d,p,vec3(.72,-.12,.68),vec3(.5,-.12,.64),SH);   // the cheekbones: front meets side
 d=cutM(d,p,vec3(1.,-.05,-.08),vec3(.7,-.1,0.),SH*1.5);   // the side plane of the head
 d=cutM(d,p,vec3(.8,-.5,.3),vec3(.6,-.62,.3),SH);   // the jaw line
 d=cutM(d,p,vec3(.45,-.85,0.),vec3(.5,-.74,0.),SH);   // the jaw's underside, back to the ear
 d=cutM(d,p,vec3(.8,.25,.55),vec3(.62,.36,.42),SO);   // temples
 d=cut(d,p,vec3(0.,.28,.96),vec3(0.,.48,.74),SO);   // the forehead
 d=cut(d,p,vec3(0.,-.45,.89),vec3(0.,-.78,.77),SO*.6);   // the chin's front
 d=cutM(d,p,vec3(.8,-.1,.6),vec3(.34,-.8,.68),SO*.6);   // the chin's sides
 return d;}
// features (shared with the paint, so the albedo knows where the eyes and lips are)
vec3 eyeL(vec3 p){return vec3(abs(p.x),p.y,p.z)-vec3(.3,.035,.62);}
float eyeD(vec3 p){vec3 e=eyeL(p);float al=max(length(e-vec3(0.,-.09,0.))-.17,length(e+vec3(0.,-.09,0.))-.17);return max(al,length(e*vec3(.8,1.,1.))-.15);}
vec3 mouthL(vec3 p){vec3 m=p-vec3(0.,-.56,0.);m.z+=1.1*m.x*m.x;return m;}   // the mouth wraps round the face's curve
float upLip(vec3 m){return sdEll(m-vec3(0.,.045,.735),vec3(.17,.045,.055));}
float loLip(vec3 m){return max(sdEll(m-vec3(0.,-.06,.72),vec3(.14,.05,.065)),plane(m,vec3(0.,.7,.7),vec3(0.,-.03,.765)));}
float features(vec3 p,float d){
 vec3 s=vec3(abs(p.x),p.y,p.z);
 float so=max(sdEll(s-vec3(.3,.04,.8),vec3(.21,.13,.14)),s.y-.14);d=smax(d,-so,SH);   // the socket under the brow
 d=smin(d,eyeD(p),.01);
 d=smin(d,sdEll(s-vec3(.3,.12,.73),vec3(.155,.028,.06)),.014);   // the upper lid's ledge
 vec3 m=mouthL(p);
 d=smin(d,upLip(m),.03);
 d=smax(d,-max(abs(m.x)-.02,sdEll(m-vec3(0.,.1,.79),vec3(.035,.06,.015))),.012);   // the philtrum, shallow
 d=smin(d,loLip(m),.025);
 float gy=m.y-(-.012+.04*m.x*m.x-.012*exp(-m.x*m.x*300.));
 d=smax(d,-max(length(vec2(gy,max(abs(m.x)-.17,0.)))-.011,.62-m.z),.008);   // the groove, only at the front
 d=smax(d,-sdEll(m-vec3(0.,-.17,.8),vec3(.14,.035,.05)),.03);   // under the lower lip
 d=smax(d,-sdEll(s-vec3(.055,-.36,.84),vec3(.025,.012,.03)),.008);   // nostrils
 return d;}
float earD(vec3 p,float d){vec3 s=vec3(abs(p.x),p.y,p.z);
 d=smin(d,sdEll(s-vec3(.72,-.1,-.1),vec3(.085,.2,.13)),.035);   // a simple ear
 return smax(d,-sdEll(s-vec3(.79,-.1,-.08),vec3(.035,.12,.065)),.02);}   // its bowl
float hairD(vec3 p){
 vec3 h=p-vec3(0.,.2,-.12);
 float d=sdEll(h,vec3(.91,1.,1.06)+vec3(0.,.05,0.)*smoothstep(.0,.8,p.z));
 float th=atan(p.x,p.y+.2)+.25*sin(p.z*2.2),g=abs(fract(th*4./3.14159+.5)-.5);d+=.075*(1.-smoothstep(.03,.3,g));   // four grooves, never through the mass
 float F=p.y-mix(mix(-.55,.16,smoothstep(-.75,-.4,p.z)),.5,smoothstep(.3,.68,p.z))+.1*smoothstep(.15,.6,abs(p.x))*smoothstep(.25,.6,p.z);   // the hairline: high on the brow, above the ears, down at the nape
 return smax(d,-F,.05);}
float headD(vec3 p){float d=earD(p,features(p,carve(p,mass(p))));
 d=smin(d,sdCapT(p,vec3(0.,-.55,-.18),vec3(0.,-1.5,-.1),.5,.56),.16);   // a short, thick neck
 return max(d,-(p.y+1.32));}
vec2 map(vec3 p){vec2 r=vec2(headD(p),1.);float h=hairD(p);if(h<r.x)r=vec2(h,2.);return r;}
vec3 nrm(vec3 p){vec2 e=vec2(.0012,0.);return normalize(vec3(map(p+e.xyy).x-map(p-e.xyy).x,map(p+e.yxy).x-map(p-e.yxy).x,map(p+e.yyx).x-map(p-e.yyx).x));}
float shadow(vec3 o,vec3 d){float res=1.,t=.015;for(int i=0;i<64;i++){float h=map(o+d*t).x;res=min(res,16.*h/t);t+=clamp(h,.008,.25);if(res<.002||t>5.)break;}return clamp(res,0.,1.);}
float ao(vec3 p,vec3 n){float a=0.,w=1.;for(int i=1;i<=5;i++){float h=.035*float(i);a+=w*(h-map(p+n*h).x);w*=.6;}return clamp(1.-3.*a,0.,1.);}
float gs(vec3 p,vec3 c,float s2){vec3 d=p-c;return exp(-dot(d,d)/s2);}
// the paint: 0 skin (warmed), 1 lips, 2 eye, 3 hair; returns colour, and .w = gloss
vec4 paint(vec3 p,float m){
 if(m>1.5)return vec4(uHair,.5);
 if(eyeD(p)<.006){vec3 e=eyeL(p);vec2 c=vec2(0.,.0);float r=length(e.xy-c);vec3 col=vec3(.9,.87,.82);
  if(r<.058)col=uIris*(.75+.4*smoothstep(.058,.02,r));if(r<.026)col=vec3(.03);
  if(length(e.xy-c-vec2(-.02,.024))<.011)col=vec3(1.4);   // the catchlight
  return vec4(col,1.);}
 vec3 mq=mouthL(p);if(min(upLip(mq),loLip(mq))<.012)return vec4(uLip,.8);
 vec3 s=vec3(abs(p.x),p.y,p.z);
 float w=.8*gs(s,vec3(.38,-.28,.62),.04)+.7*gs(p,vec3(0.,-.32,.9),.012)+.8*gs(s,vec3(.74,-.1,-.1),.02);   // cheeks, nose, ears
 return vec4(mix(uSkin,uFlush,.32*clamp(w,0.,1.)),.6);}
void main(){
 vec2 uv=(v*.5)*vec2(uRes.x/uRes.y,1.);vec3 fw=normalize(uTgt-uCam),rt=normalize(cross(fw,vec3(0.,1.,0.))),up=cross(rt,fw);
 vec3 rd=normalize(fw+uv.x*rt*uFov+uv.y*up*uFov),ro=uCam;
 float t=0.;vec2 h;bool hit=false;
 for(int i=0;i<220;i++){h=map(ro+rd*t);if(h.x<.0004*t){hit=true;break;}t+=h.x*.85;if(t>20.)break;}
 vec3 col=mix(vec3(.12,.12,.12),vec3(.27,.27,.27),smoothstep(-.5,.7,rd.y));
 if(hit){vec3 p=ro+rd*t,n=nrm(p);vec4 al=paint(p,h.y);
  float l=max(dot(n,KEY),0.)*shadow(p+n*.004,KEY),oc=ao(p,n);vec3 rf=reflect(rd,n);float fr=pow(1.-max(dot(n,-rd),0.),4.);
  col=al.rgb*(l*vec3(1.,.95,.86)*1.3+(vec3(.11,.12,.15)*(.5+.5*n.y)+vec3(.07,.055,.045))*oc);
  col+=vec3(1.,.95,.88)*(pow(max(dot(rf,KEY),0.),22.)*.16*al.w+pow(max(dot(rf,KEY),0.),200.)*1.2*step(.9,al.w))*l;   // satin; the eye's gloss
  col+=vec3(.32,.34,.38)*fr*.18*oc;   // the sheen at grazing angles
  col+=vec3(.3,.32,.36)*pow(1.-max(dot(n,-rd),0.),3.)*max(dot(n,normalize(vec3(.6,.2,-.7))),0.)*.4;}
 col=col/(1.+col*.2);o=vec4(pow(clamp(col,0.,1.),vec3(1./2.2)),1.);}`;
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); document.title = 'SHADER ERROR'; } return s; }
const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(prog, n);
const H = 1420;
gl.enable(gl.SCISSOR_TEST); gl.clearColor(.055, .067, .086, 1); gl.viewport(0, 0, 1280, H); gl.scissor(0, 0, 1280, H); gl.clear(gl.COLOR_BUFFER_BIT);
let k = 0;
// one view per frame (a long single GPU job can trip Windows' GPU timeout)
function step() {
  if (k >= ROWS.length) { window.FRAME_DONE = 1; return; }
  const a = ROWS[k].a, x = 12, y = 44 + k * 456, w = 420, h = 420, d = 6; k++;
  gl.viewport(x, H - y - h, w, h); gl.scissor(x, H - y - h, w, h); gl.uniform2f(U('uRes'), w, h);
  gl.uniform3f(U('uCam'), Math.sin(a) * d, .1, Math.cos(a) * d); gl.uniform3f(U('uTgt'), 0, -.22, 0); gl.uniform1f(U('uFov'), .5);
  // the key: above and to the side of each view
  const kx = -.75 * Math.cos(a) + .3 * Math.sin(a), kz = .3 * Math.cos(a) + .75 * Math.sin(a), kl = Math.hypot(kx, .7, kz);
  gl.uniform3f(U('uKey'), kx / kl, .7 / kl, kz / kl);
  for (const [n, c] of [['uSkin', P.skin], ['uHair', P.hair], ['uIris', P.iris], ['uLip', P.lip], ['uFlush', P.flush]]) gl.uniform3fv(U(n), c);
  gl.drawArrays(gl.TRIANGLES, 0, 3); gl.flush(); requestAnimationFrame(step);
}
requestAnimationFrame(step);
</script>
</body>
</html>
