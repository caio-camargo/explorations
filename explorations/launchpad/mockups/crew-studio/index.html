<!DOCTYPE html>
<!-- mockups/crew-studio/ — the game's own astronaut mesh (app/crew-look.js, crewFigure) in a plain studio light, for
     judging the head close up (QUEUE Q532, the ligne-claire head, D26). Not the game's mesh shader: a key, a fill and a
     rim on flat colours, so this judges shapes, the face's drawing and fit in the helmets, not the game's lighting.
     ?view=sheet (default): the five expressions, the roster, the 48 px row (true size and ×3), every suit's helmet;
     ?view=heads: the head alone (expressions, roster, profiles); ?view=helmets: the 18 launch suits' helmets round the head; ?view=suits: the 18 launch suits, a figure each. ?still hides the caption bar. Loads the game's files as they are:
     sim/core.js for the vectors, app/gl.js's tube and lathe (cut from its text), app/crew-look.js. -->
<html><head><meta charset="utf-8"><title>Crew studio — the ligne-claire head</title>
<style>
  body { margin: 0; background: #0f1218; color: #cfd6e0; font: 13px system-ui, sans-serif; }
  #bar { padding: 8px 12px; } body.still #bar { display: none; }
  #wrap { position: relative; } canvas { display: block; }
  .lab { position: absolute; font-size: 12px; color: #9fb0c4; white-space: nowrap; }
  .hd { position: absolute; font-size: 14px; color: #e8b45a; font-weight: 600; }
</style></head><body>
<div id="bar">Crew studio (Q532): the game's crewFigure, studio light. <a href="?view=sheet">sheet</a> · <a href="?view=heads">heads</a> · <a href="?view=helmets">helmets</a> · <a href="?view=suits">suits</a></div>
<div id="wrap"><canvas id="c"></canvas><canvas id="z" style="position:absolute;left:0;top:0;pointer-events:none"></canvas></div>
<script src="../../sim/core.js"></script>
<script>
'use strict';
const Q = new URLSearchParams(location.search); if (Q.has('still')) document.body.classList.add('still');
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t) };
const PK = { o: [0, 0, 0], k: 0, R: 0, h: 0, i: -1 };
// the studio's vertex: position, normal, colour, material
function pv(out, P, N, c) { out.push(P[0], P[1], P[2], N[0], N[1], N[2], c[0], c[1], c[2], c[3] || 0) }
async function load() {
  const glsrc = await (await fetch('../../app/gl.js')).text();
  const cut = (a, b) => { const i = glsrc.indexOf(a); if (i < 0) throw new Error('gl.js: no ' + a); return glsrc.slice(i, glsrc.indexOf(b, i + a.length)) };
  const s1 = document.createElement('script');
  s1.textContent = cut('let SMOOTH_FX', '\nconst C={') + '\n' + cut('function tube(', '\n// an open lattice');
  document.head.appendChild(s1);
  await new Promise((r, j) => { const s = document.createElement('script'); s.src = '../../app/crew-look.js'; s.onload = r; s.onerror = j; document.head.appendChild(s) });
}
const VXS = 10;
const cv = document.getElementById('c'), gl = cv.getContext('webgl2', { preserveDrawingBuffer: true, antialias: true });
const VS = `#version 300 es
layout(location=0) in vec3 aP;layout(location=1) in vec3 aN;layout(location=2) in vec3 aC;layout(location=3) in float aM;
uniform mat4 uVP;out vec3 vN,vC,vP;out float vM;void main(){vN=aN;vC=aC;vM=aM;vP=aP;gl_Position=uVP*vec4(aP,1.);}`;
const FS = `#version 300 es
precision highp float;in vec3 vN,vC,vP;in float vM;uniform vec3 uCam;out vec4 o;
void main(){vec3 n=normalize(vN),v=normalize(uCam-vP);if(dot(n,v)<0.)n=-n;
 vec3 K=normalize(vec3(-.55,.75,.6)),F=normalize(vec3(.7,.2,.5)),Rm=normalize(vec3(.3,.4,-.9));
 float k=max(dot(n,K),0.),f=max(dot(n,F),0.)*.33,r=pow(1.-max(dot(n,v),0.),3.)*max(dot(n,Rm)+.3,0.)*.5;
 vec3 c=vC*(.3+.75*k+f)+vec3(.9,.95,1.)*r;
 float sp=vM>.5&&vM<1.5||vM>4.5?pow(max(dot(reflect(-K,n),v),0.),24.)*.5:vM<.5?pow(max(dot(reflect(-K,n),v),0.),40.)*.12:0.;
 c+=sp;o=vec4(pow(c,vec3(1./1.1)),vM>3.5&&vM<4.5?.3:1.);}`;
function sh(t, s) { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(x); return x }
const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr);
function mesh(a) {
  const d = new Float32Array(a), vao = gl.createVertexArray(), b = gl.createBuffer(); gl.bindVertexArray(vao); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, d, gl.STATIC_DRAW);
  [[0, 3, 0], [1, 3, 12], [2, 3, 24], [3, 1, 36]].forEach(([l, n, o]) => { gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, n, gl.FLOAT, false, VXS * 4, o) });
  gl.bindVertexArray(null); return { vao, n: d.length / VXS };
}
function persp(fy, a, n, f) { const t = 1 / Math.tan(fy / 2); return [t / a, 0, 0, 0, 0, t, 0, 0, 0, 0, (f + n) / (n - f), -1, 0, 0, 2 * f * n / (n - f), 0] }
function look(e, c) { const z = norm(sub(e, c)), x = norm(cross([0, 1, 0], z)), y = cross(z, x); return [x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -dot(x, e), -dot(y, e), -dot(z, e), 1] }
function mm(a, b) { const r = new Array(16).fill(0); for (let i = 0; i < 4; i++)for (let j = 0; j < 4; j++)for (let k = 0; k < 4; k++)r[j * 4 + i] += a[k * 4 + i] * b[j * 4 + k]; return r }
const H = document.documentElement;
// one tile: the figure m seen from eye e at target t, in the rectangle (x, y, w, h) (y from the top), a background colour
function tile(m, x, y, w, h, e, t, fov, bg) {
  const Y = cv.height - y - h; gl.viewport(x, Y, w, h); gl.scissor(x, Y, w, h); gl.enable(gl.SCISSOR_TEST);
  gl.clearColor(...bg, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.useProgram(pr); gl.uniformMatrix4fv(gl.getUniformLocation(pr, 'uVP'), false, mm(persp(fov, w / h, .05, 50), look(e, t)));
  gl.uniform3fv(gl.getUniformLocation(pr, 'uCam'), e);
  gl.enable(gl.DEPTH_TEST); gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.bindVertexArray(m.vao); gl.drawArrays(gl.TRIANGLES, 0, m.n); gl.disable(gl.SCISSOR_TEST);
}
const wrap = document.getElementById('wrap'), lab = (x, y, s, cls = 'lab') => { const d = document.createElement('div'); d.className = cls; d.style.left = x + 'px'; d.style.top = y + 'px'; d.textContent = s; wrap.appendChild(d) };
const CAB = [.2, .22, .26];
async function main() {
  await load();
  const view = Q.get('view') || 'sheet';
  const HCy = (() => { const s = CREW_C; return s.legL + s.boot[1] * 1.2 + s.tH + s.head * .25 + s.head * 1.05 - s.head * .12 })();
  const portrait = (m, x, y, w, h, yaw = .3) => tile(m, x, y, w, h, [Math.sin(yaw) * .7, HCy + .03, Math.cos(yaw) * .7], [0, HCy - .045, .03], .48, CAB);
  if (view === 'suits') {
    cv.width = 1280; cv.height = 800; cv.style.width = cv.width + 'px';
    for (let sc = 0; sc < 6; sc++)for (let g = 0; g < 3; g++) {
      const i = sc * 3 + g, x = (i % 9) * 143, y = 30 + (i / 9 | 0) * 430, m = mesh(crewFigure(suitOf(sc, g), 'stand', i % CREW_PEOPLE.length));
      tile(m, x, y, 140, 400, [Math.sin(.4) * 4.2, 1.0, Math.cos(.4) * 4.2], [0, .9, 0], .5, CAB); lab(x + 4, y - 18, `school ${sc} gen ${g}`);
    }
    document.title += ' (ready)'; return;
  }
  if (view === 'heads') {   // the head alone (crewHead), no helmet: the expressions, the roster from the front, then in profile
    cv.width = 1280; cv.height = 800; cv.style.width = cv.width + 'px';
    const R = CREW_C.head, hm = (k, ex) => { const o = []; crewHead(o, [0, 0, 0], R, CREW_PEOPLE[k], CREW_EX[ex], false); return mesh(o) };
    const at = (m, x, y, w, h, yaw, d = .85) => tile(m, x, y, w, h, [Math.sin(yaw) * d, .03, Math.cos(yaw) * d], [0, -.01, 0], .42, CAB);
    lab(10, 4, 'The head alone: the five expressions (person 0)', 'hd');
    ['neutral', 'grin', 'grit', 'alarm', 'wonder'].forEach((ex, i) => { at(hm(0, ex), 10 + i * 160, 26, 150, 150, .3); lab(14 + i * 160, 178, ex) });
    lab(10, 200, 'The roster, three-quarter', 'hd');
    CREW_PEOPLE.forEach((p, k) => at(hm(k, 'neutral'), 10 + k * 158, 222, 150, 150, .45));
    lab(10, 384, 'The roster in profile and from behind', 'hd');
    CREW_PEOPLE.forEach((p, k) => { at(hm(k, 'neutral'), 10 + k * 158, 406, 150, 150, 1.45); at(hm(k, 'neutral'), 10 + k * 158, 560, 150, 150, 2.8) });
    document.title += ' (ready)'; return;
  }
  if (view === 'helmets') {
    cv.width = 1280; cv.height = 800; cv.style.width = cv.width + 'px';
    lab(10, 4, 'Every launch suit\'s helmet round the head (school·generation; people cycle)', 'hd');
    for (let sc = 0; sc < 6; sc++)for (let g = 0; g < 3; g++) { const i = sc * 3 + g, m = mesh(crewFigure(suitOf(sc, g), 'stand', i % CREW_PEOPLE.length)); tile(m, 10 + (i % 6) * 210, 26 + (i / 6 | 0) * 256, 200, 230, [Math.sin(.45) * 1.3, HCy + .05, Math.cos(.45) * 1.3], [0, HCy - .1, 0], .42, CAB); lab(14 + (i % 6) * 210, 258 + (i / 6 | 0) * 256, `${sc}·${g}`) }
    document.title += ' (ready)'; return;
  }
  cv.width = 1280; cv.height = 800; cv.style.width = cv.width + 'px';
  const EXN = ['neutral', 'grin', 'grit', 'alarm', 'wonder'], cape = suitOf(1, 2);
  lab(10, 4, 'Flight portraits: person 0 in Steppe\'s late suit (an open faceplate)', 'hd');
  const exM = EXN.map(ex => mesh(crewFigure(cape, 'stand', 0, ex)));
  exM.forEach((m, i) => { portrait(m, 10 + i * 255, 26, 245, 245); lab(14 + i * 255, 274, EXN[i]) });
  lab(10, 296, 'The roster: eight people, neutral (skin, hair, nose, brows, moustache)', 'hd');
  const roM = CREW_PEOPLE.map((p, k) => mesh(crewFigure(cape, 'stand', k)));
  roM.forEach((m, k) => portrait(m, 10 + k * 158, 318, 152, 152));
  lab(10, 480, 'At 48 px, true size: the five, then the roster; below, the same ×3 (pixels kept)', 'hd');
  const small = [...exM, ...roM], X48 = i => 10 + i * 54 + (i >= 5 ? 14 : 0);
  small.forEach((m, i) => portrait(m, X48(i), 502, 48, 48));
  // the ×3 enlargement of the 48 px row
  const z = document.getElementById('z'); z.width = cv.width; z.height = cv.height; z.style.width = cv.width + 'px'; const c2 = z.getContext('2d'); c2.imageSmoothingEnabled = false;
  small.slice(0, 5).forEach((_, i) => c2.drawImage(cv, X48(i), 502, 48, 48, 10 + i * 152, 560, 144, 144));
  document.title += ' (ready)';
}
main().catch(e => { document.title += ' ERROR';
  if (location.protocol === 'file:') { document.getElementById('bar').textContent = 'This page reads the game\'s app/gl.js, which a browser won\'t do from file://. Serve the launchpad folder instead: python -m http.server 8780 (in explorations/launchpad), then open http://localhost:8780/mockups/crew-studio/'; return } document.getElementById('bar').textContent = 'ERROR ' + (e.stack || e); console.error(e) });
</script></body></html>
