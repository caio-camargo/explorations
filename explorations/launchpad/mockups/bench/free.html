<title>Payload bench: free attachment</title>
<!-- Launchpad mock-up (vehicle session, 2026-11-13, D47 points 1 and 2 → PROBES § 6.4, QUEUE Q605). The bench as its own
     builder: a frame to pick and stretch, a part on any face, edge or corner at a tilt in 15° steps, symmetry off by
     default, each part's view cone while it is held with what blocks it, and a declared attitude that shows the ground,
     the sun and the direction of travel. Never loaded by the game; numbers are illustrative. index.html beside it is the
     2026-10-13 bench (skins, stowed and deployed, the fairing): none of that is here.
     ?n=3|4|6|8 &w=<m> &h=<m> &top=<0.3..1> &att=ground|sun|spin &th=<0..1> &demo=block|empty &sel=<i> &all=1 &tab=checks|part|frame

<script>
const Q=new URLSearchParams(location.search),$=s=>document.querySelector(s),D=Math.PI/180,V=(x,y,z)=>new THREE.Vector3(x||0,y||0,z||0),YUP=V(0,1,0);

const ST={bus:{n:num('n',6),w:num('w',.9),h:num('h',.8),top:num('top',1)},att:Q.get('att')||'ground',sym:1,th:num('th',.08),ps:0,play:false,
  items:[],held:null,sel:null,tab:Q.get('tab')||'checks',open:null,hl:null,all:Q.get('all')==='1',az:num('az',38),el:num('el',14),dist:num('dist',0)};
if(!ST.dist)ST.dist=6.4+Math.max(ST.bus.w,ST.bus.h)*1.6;
// a part: mass kg; what it must see (need) inside a cone (half-angle, degrees); ap = where it looks from, ch = where its
// mass sits, both along its own axis; fr = the room its foot takes. Its sentence follows UI.md § 2.1 (14 words).
const PARTS={
 panel:{cat:'POWER',n:'Solar panel',m:6,need:'power',cone:60,ap:.07,ch:.05,fr:.3,does:'Fixed cells. Power only while they face the sun.'},
 batt:{cat:'POWER',n:'Battery',m:14,ch:.07,fr:.12,does:'Carries the craft through the shadow.'},
 camW:{cat:'SEE',n:'Wide camera',m:8,need:'ground',cone:30,ap:.18,ch:.08,fr:.08,does:'Clouds and coastlines. Forgiving about where it looks.'},
 camN:{cat:'SEE',n:'Narrow camera',m:22,need:'ground',cone:6,strict:1,ap:.44,ch:.2,fr:.1,does:'Sharp pictures, a small field. Needs a clear view of the ground.'},
 whip:{cat:'TALK',n:'Whip antenna',m:1,ch:.4,fr:.03,does:'Talks in every direction, slowly.'},
 dish:{cat:'TALK',n:'Dish',m:9,need:'home',cone:10,strict:1,ap:.3,ch:.15,fr:.12,does:'A fast link, only while it points home.'},
 rad:{cat:'COOL',n:'Radiator',m:5,need:'cold',cone:60,ap:.09,ch:.05,fr:.25,does:'Sheds heat to cold space. Sun or ground on it warms it.'},
 sunS:{cat:'POINT',n:'Sun sensor',m:.5,need:'sun',cone:60,ap:.06,ch:.02,fr:.05,does:'Finds the sun.'},
 hor:{cat:'POINT',n:'Horizon sensor',m:2,need:'ground',cone:45,ap:.09,ch:.03,fr:.06,does:'Finds the ground below.'},
 star:{cat:'POINT',n:'Star tracker',m:3,need:'dark',cone:25,ap:.21,ch:.1,fr:.05,does:'Reads the stars. The sun or the ground blinds it.'},
 thr:{cat:'MOVE',n:'Thruster',m:2,need:'plume',cone:20,ap:.12,ch:.04,fr:.04,does:'A small push. Its plume burns what it touches.'},
 kick:{cat:'MOVE',n:'Kick motor',m:30,need:'thrust',cone:15,ap:.57,ch:.25,fr:.22,does:'One big push. Aim it through the balance point.'},
};
const WANT={power:'the sun',ground:'the ground',home:'home',cold:'cold space',sun:'the sun',dark:'dark sky',plume:'a clear plume',thrust:'the balance point'};
// the widest low part of each one, and how high it sits: a tilted part stands on a bracket tall enough to clear the frame
const FOOT={panel:[.35,.044],batt:[.14,0],camW:[.07,0],camN:[.09,0],whip:[.01,0],dish:[.35,.26],rad:[.3,.043],sunS:[.05,0],hor:[.064,0],star:[.035,0],thr:[.035,0],kick:[.21,0]};
let uid=1;const item=(k,at,o)=>Object.assign({id:uid++,k,at,a:0,b:0,r:0,sym:1},o||{});
// ---------------------------------------------------------------- three
const cvs=$('#cv'),ren=new THREE.WebGLRenderer({canvas:cvs,antialias:true,alpha:true,preserveDrawingBuffer:true});ren.setClearColor(0x000000,0);
ren.outputEncoding=THREE.sRGBEncoding;ren.toneMapping=THREE.ACESFilmicToneMapping;ren.toneMappingExposure=.85;
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(32,1,.05,3000);
const sunL=new THREE.DirectionalLight('#fff4e4',2.4);scene.add(sunL);scene.add(new THREE.HemisphereLight('#5a6680','#222c3b',1.5));
const fillL=new THREE.DirectionalLight('#9fc0ff',.5);scene.add(fillL);
function cvTex(w,h,f,rep=[1,1],srgb=true){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(...rep);if(srgb)t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t}
const crinkle=cvTex(256,256,(g,w,h)=>{const d=g.createImageData(w,h);for(let i=0;i<w*h;i++){const x=i%w,y=i/w|0,v=128+60*Math.sin(x*.21+Math.sin(y*.13)*3)*Math.sin(y*.17+Math.sin(x*.09)*2)+40*(Math.random()-.5);d.data.set([v,v,v,255],i*4)}g.putImageData(d,0,0)},[2,2],false);
const cellT=cvTex(128,128,(g,w,h)=>{g.fillStyle='#9aa2ab';g.fillRect(0,0,w,h);for(let i=0;i<4;i++)for(let j=0;j<4;j++){g.fillStyle=`hsl(225,55%,${14+Math.random()*6}%)`;g.fillRect(i*32+2,j*32+2,28,28)}},[2,2]);
const std=o=>new THREE.MeshStandardMaterial(o),basic=(c,o)=>new THREE.MeshBasicMaterial(Object.assign({color:c,transparent:true,depthWrite:false},o||{}));
const M={strut:std({color:'#c9ccd0',metalness:.45,roughness:.35}),dark:std({color:'#3c3f44',metalness:.5,roughness:.5}),white:std({color:'#efeee9',roughness:.6}),
  whiteD:std({color:'#efeee9',roughness:.6,side:THREE.DoubleSide}),lens:std({color:'#0a0f1a',metalness:.9,roughness:.05}),cells:std({map:cellT,metalness:.35,roughness:.35}),
  gold:std({color:'#c98a1e',metalness:.75,roughness:.3,bumpMap:crinkle,bumpScale:.004}),silver:std({color:'#dfe3e7',metalness:.5,roughness:.28,bumpMap:crinkle,bumpScale:.004}),
  alu:std({color:'#f2f2f2',metalness:.6,roughness:.18}),solid:std({color:'#2e2a26',roughness:.8}),
  tBad:basic('#ff6b5b',{opacity:.45}),thrustR:basic('#fff6d0',{depthTest:false,opacity:.95}),missR:basic('#ff6b5b',{depthTest:false,opacity:1}),brass:std({color:'#b08a3c',metalness:.8,roughness:.35}),
  wSel:basic('#7fd0ff',{wireframe:true,opacity:.22}),wBad:basic('#ff6b5b',{wireframe:true,opacity:.8}),
  cone:{ok:basic('#7fd0ff',{opacity:.13,side:THREE.DoubleSide}),warn:basic('#ffb84a',{opacity:.16,side:THREE.DoubleSide}),bad:basic('#ff6b5b',{opacity:.16,side:THREE.DoubleSide})},
  slice:basic('#ff6b5b',{opacity:.38,side:THREE.DoubleSide}),
  rim:{ok:new THREE.LineBasicMaterial({color:'#7fd0ff'}),warn:new THREE.LineBasicMaterial({color:'#ffb84a'}),bad:new THREE.LineBasicMaterial({color:'#ff6b5b'})},
  ray:new THREE.LineBasicMaterial({color:'#ff6b5b',transparent:true,opacity:.75}),pts:new THREE.PointsMaterial({color:'#ff6b5b',size:5,sizeAttenuation:false,depthTest:false}),
  snap:new THREE.LineBasicMaterial({color:'#7fd0ff',depthTest:false}),axis:new THREE.LineDashedMaterial({color:'#4a6480',dashSize:.06,gapSize:.06}),
  
  com:basic('#ffd21e',{depthTest:false,opacity:1}),comK:basic('#111',{depthTest:false,opacity:1}),
  tg:new THREE.LineDashedMaterial({color:'#6fc3ea',dashSize:.05,gapSize:.04}),ts:new THREE.LineDashedMaterial({color:'#ffd35a',dashSize:.05,gapSize:.04})};
const mk=(g,m,p,r)=>{const x=new THREE.Mesh(g,m);if(p)x.position.set(...p);if(r)x.rotation.set(...r);return x};
const cyl=(r,h,m,p,rot,seg=24,r2=r)=>mk(new THREE.CylinderGeometry(r2,r,h,seg),m,p,rot);
const box=(w,h,d,m,p,rot)=>mk(new THREE.BoxGeometry(w,h,d),m,p,rot);
function rod(A,B,r,m){const d=B.clone().sub(A),x=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),8),m);x.position.copy(A).add(B).multiplyScalar(.5);x.quaternion.setFromUnitVectors(YUP,d.normalize());return x}
function dishG(Dm,depth){const pts=[];for(let i=0;i<=16;i++){const r=Dm/2*i/16;pts.push(new THREE.Vector2(r,depth*(r/(Dm/2))**2))}return new THREE.LatheGeometry(pts,40)}
const line=(pts,mat)=>{const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),mat);if(mat.isLineDashedMaterial)l.computeLineDistances();return l};
// every part is built with +Y as the way it looks (or pushes), standing on its foot at the origin
const BUILD={
 panel:g=>{g.add(box(.5,.012,.7,M.cells,[0,.062,0]));g.add(box(.5,.012,.7,M.white,[0,.05,0]));g.add(cyl(.015,.05,M.strut,[0,.025,0],null,8))},
 batt:g=>g.add(box(.22,.14,.18,M.silver,[0,.07,0])),
 camW:g=>{g.add(cyl(.07,.16,M.dark,[0,.08,0]));g.add(cyl(.05,.012,M.lens,[0,.166,0]))},
 camN:g=>{g.add(cyl(.09,.42,M.white,[0,.21,0]));g.add(cyl(.07,.012,M.lens,[0,.426,0]))},
 whip:g=>g.add(rod(V(),V(0,.9,0),.008,M.alu)),
 dish:g=>{g.add(cyl(.02,.14,M.strut,[0,.07,0],null,8));g.add(mk(dishG(.7,.12),M.whiteD,[0,.14,0]));g.add(rod(V(0,.14,0),V(0,.36,0),.008,M.strut))},
 rad:g=>{g.add(box(.42,.014,.5,M.white,[0,.05,0]));for(let i=-2;i<=2;i++)g.add(box(.006,.03,.5,M.white,[i*.09,.07,0]));g.add(cyl(.015,.05,M.strut,[0,.025,0],null,8))},
 sunS:g=>{g.add(box(.07,.04,.07,M.dark,[0,.02,0]));g.add(cyl(.018,.01,M.lens,[0,.045,0]))},
 hor:g=>{g.add(box(.09,.07,.09,M.dark,[0,.035,0]));g.add(cyl(.03,.012,M.lens,[0,.076,0]))},
 star:g=>{g.add(cyl(.035,.1,M.dark,[0,.05,0]));g.add(cyl(.035,.1,M.dark,[0,.15,0],null,24,.06))},
 thr:g=>{g.add(box(.05,.04,.05,M.strut,[0,.02,0]));g.add(cyl(.014,.07,M.dark,[0,.075,0],null,16,.04))},
 kick:g=>{g.add(cyl(.21,.06,M.strut,[0,.03,0]));g.add(cyl(.2,.36,M.solid,[0,.24,0]));g.add(cyl(.07,.14,M.dark,[0,.49,0],null,20,.14))},
};
// ---------------------------------------------------------------- the frame: a prism of N sides, straight or tapered
let FR;
function mkFrame(){const b=ST.bus,N=b.n,R0=b.w/2,R1=R0*b.top,H=b.h,bot=[],top=[],m=k=>((k%N)+N)%N,F={},E={},C={};
  for(let k=0;k<N;k++){const a=(k-.5)/N*2*Math.PI;bot.push(V(Math.cos(a)*R0,-H/2,Math.sin(a)*R0));top.push(V(Math.cos(a)*R1,H/2,Math.sin(a)*R1))}
  for(let k=0;k<N;k++){const k1=m(k+1),n=V().crossVectors(top[k].clone().sub(bot[k]),bot[k1].clone().sub(bot[k])).normalize();
    F['s'+k]={id:'s'+k,k,n,c:['cb'+k,'cb'+k1,'ct'+k1,'ct'+k],e:['v'+k,'v'+k1,'t'+k,'b'+k]};
    E['v'+k]={a:bot[k],b:top[k],f:['s'+m(k-1),'s'+k]};E['t'+k]={a:top[k],b:top[k1],f:['s'+k,'top']};E['b'+k]={a:bot[k],b:bot[k1],f:['s'+k,'bot']};
    C['cb'+k]={p:bot[k],f:['s'+m(k-1),'s'+k,'bot']};C['ct'+k]={p:top[k],f:['s'+m(k-1),'s'+k,'top']}}
  F.top={id:'top',n:V(0,1,0),c:top.map((_,k)=>'ct'+k),e:top.map((_,k)=>'t'+k)};F.bot={id:'bot',n:V(0,-1,0),c:bot.map((_,k)=>'cb'+k),e:bot.map((_,k)=>'b'+k)};
  FR={N,R0,R1,H,bot,top,F,E,C}}
const sumN=fs=>{const n=V();fs.forEach(f=>n.add(FR.F[f].n));return n.normalize()};
// where a part sits: {f, s, t} on a face, {e, t} along an edge, {c} on a corner. Returns the foot, the way out, a side.
function resolve(at){const f=FR;let p,n,u;
  if(at.c){const c=f.C[at.c];p=c.p.clone();n=sumN(c.f);u=V().crossVectors(YUP,n)}
  else if(at.e){const e=f.E[at.e];p=e.a.clone().lerp(e.b,at.t);n=sumN(e.f);u=e.b.clone().sub(e.a)}
  else if(at.f==='top'||at.f==='bot'){const R=at.f==='top'?f.R1:f.R0;p=V(at.s*R,at.f==='top'?f.H/2:-f.H/2,at.t*R);n=f.F[at.f].n.clone();u=V(1,0,0)}
  else{const F=f.F[at.f],k=F.k,k1=(k+1)%f.N,A=f.bot[k].clone().lerp(f.top[k],at.t),B=f.bot[k1].clone().lerp(f.top[k1],at.t);p=A.lerp(B,at.s);n=F.n.clone();u=f.bot[k1].clone().sub(f.bot[k])}
  u.addScaledVector(n,-u.dot(n));if(u.lengthSq()<1e-8){u.set(1,0,0);u.addScaledVector(n,-u.dot(n))}u.normalize();return{p,n,u}}
const qAx=(x,y,z,deg)=>new THREE.Quaternion().setFromAxisAngle(V(x,y,z),deg*D);
function quat(pl,it){const z=V().crossVectors(pl.u,pl.n),q=new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(pl.u,pl.n,z));
  return q.multiply(qAx(0,1,0,it.r)).multiply(qAx(1,0,0,it.b)).multiply(qAx(0,0,1,it.a))}
// a point the mouse hit on a face → where the part sits; near an edge or a corner it snaps there (Shift: no snapping)

  let h='<div class="cat">FRAME</div><div class="pi" data-p="bus">'+['','','','triangle','square','','hexagon','','octagon'][b.n]+' · '+b.w.toFixed(1)+' × '+b.h.toFixed(1)+' m</div>';
  for(const[c,list]of Object.entries(cats)){h+=`<div class="cat">${c}</div>`;for(const[id,p]of list)h+=`<div class="pi${ST.held&&ST.held.k===id?' on':''}" data-p="${id}">${p.n}</div>`}
  if(ST.held)h+='<div class="pi bin" data-p="bin" title="Remove the part in hand · Delete">✕ Remove</div>';
  $('#pal').innerHTML=h;
  document.querySelectorAll('.pi').forEach(e=>{const id=e.dataset.p;e.onclick=()=>{if(id==='bin'){remove();return}if(id==='bus'){drop();ST.sel=null;ST.tab='frame';renderAll();return}
      drop();ST.held=item(id,null,{sym:ST.sym,isNew:true});ST.sel=null;ST.tab='part';renderAll()};
    e.onmouseenter=()=>{if(id==='bus'||id==='bin')return;const p=PARTS[id],t=$('#tip');t.innerHTML=`<b>${p.n}</b><br>${p.does}<br><span class="small">${p.m} kg${p.need?' · wants '+WANT[p.need]:''}</span>`;t.style.top=(e.getBoundingClientRect().top)+'px';t.style.display='block'};
    e.onmouseleave=()=>$('#tip').style.display='none'})}
function renderBody(){document.querySelectorAll('#tabs div').forEach(d=>d.classList.toggle('on',d.dataset.t===ST.tab));const B=$('#body');
  if(ST.tab==='checks'){const R=rows(),bad=R.filter(r=>r.s==='bad').length,warn=R.filter(r=>r.s==='warn').length;
    B.innerHTML=(R.length?`<div class="verdict ${bad?'bad':warn?'warn':'ok'}"><span>${bad?bad+' TO FIX':warn?warn+' TO WATCH':'ALL CLEAR'}</span><span>${R.filter(r=>r.s==='ok').length} of ${R.length} ok</span></div>`:'<div class="small">No parts yet.</div>')+
    R.map((r,i)=>`<div class="row${ST.open===r.t?' open':''}" data-i="${i}"><div class="rh"><span class="dot ${r.s}"></span><div class="rt"><div class="t">${r.t}</div><div class="v">${r.v}${r.fix?` <span class="fix">${r.fix}</span>`:''}</div></div></div>
      <div class="more">${r.L.map(I=>`<div><span class="dot ${I.ev.st}"></span><span>${PARTS[I.it.k].n}: ${I.ev.line}</span></div>`).join('')}</div></div>`).join('');
    B.querySelectorAll('.row').forEach(e=>{const r=R[+e.dataset.i];e.onclick=()=>{ST.open=ST.open===r.t?null:r.t;renderBody()};e.onmouseenter=()=>{ST.hl=r.ks;decorate()};e.onmouseleave=()=>{ST.hl=null;decorate()}})}
  else if(ST.tab==='part'){const it=ST.held||ST.sel;if(!it){B.innerHTML='<div class="small">No part chosen.</div>';return}
    const P=PARTS[it.k],I=INST.find(x=>x.it===it&&x.j===0),ev=I&&I.ev,N=FR.N,bt=(k,d,l,tip)=>`<button data-k="${k}" data-d="${d}" title="${tip}">${l}</button>`;
    B.innerHTML=`<div style="font-weight:bold;color:var(--acc)">${P.n}</div><div class="v" style="margin:4px 0 6px">${P.does}</div>
      <div class="small">${P.m} kg · on ${sitsOn(it.at)}</div>
      ${ev?`<div class="stat"><span class="dot ${ev.st}"></span><span>${ev.line[0].toUpperCase()+ev.line.slice(1)}. <span class="fix">${ev.fix}</span></span></div>`:''}
      ${ST.held&&ST.held.clash?'<div class="stat"><span class="dot bad"></span><span>No room here.</span></div>':''}
      <div class="opt"><div class="l">TILT · ${it.a}° across, ${it.b}° along</div>${bt('a',-15,'◄ A','Tilt left · A')}${bt('a',15,'D ►','Tilt right · D')}${bt('b',-15,'▲ W','Tilt up · W')}${bt('b',15,'S ▼','Tilt down · S')}</div>
      <div class="opt"><div class="l">TURN · ${it.r}°</div>${bt('r',-15,'⟲ Q','Turn about its own axis · Q')}${bt('r',15,'E ⟳','Turn about its own axis · E')}<button data-k="x" title="Stand it straight again · X">straight · X</button></div>
      <div class="opt"><div class="l">COPIES</div><button data-sym="1" class="${it.sym===1?'on':''}">one</button><button data-sym="2" class="${it.sym===2?'on':''}" ${N%2?'disabled':''}>2</button><button data-sym="${N}" class="${it.sym===N?'on':''}">${N}</button></div>
      <button class="tb" id="rm" title="Remove it · Delete">remove</button>`;
    B.querySelectorAll('[data-k]').forEach(e=>e.onclick=()=>tilt(e.dataset.k,+e.dataset.d));
    B.querySelectorAll('[data-sym]').forEach(e=>e.onclick=()=>{it.sym=+e.dataset.sym;rebuild()});$('#rm').onclick=()=>remove()}
  else{const b=ST.bus;B.innerHTML=`<div style="font-weight:bold;color:var(--acc)">The frame</div><div class="small">${MC.bm} kg. Parts keep their places as it changes.</div>
      <div class="opt"><div class="l">SHAPE</div>${[3,4,6,8].map(n=>`<button data-n="${n}" class="${b.n===n?'on':''}">${n===3?'triangle':n===4?'square':n===6?'hexagon':'octagon'}</button>`).join('')}</div>
      <div class="opt"><div class="l">WIDTH · <span id="wv">${b.w.toFixed(1)} m</span></div><input type="range" min="0.3" max="3" step="0.1" value="${b.w}" id="wR"></div>
      <div class="opt"><div class="l">HEIGHT · <span id="hv">${b.h.toFixed(1)} m</span></div><input type="range" min="0.2" max="3" step="0.1" value="${b.h}" id="hR"></div>
      <div class="opt"><div class="l">TOP · <span id="tv">${b.top===1?'straight':'tapered to '+pct(b.top)}</span></div><input type="range" min="0.3" max="1" step="0.05" value="${b.top}" id="tR"> <button id="str" class="${b.top===1?'on':''}">straight</button></div>`;
    B.querySelectorAll('[data-n]').forEach(e=>e.onclick=()=>{ST.bus.n=+e.dataset.n;reframe();renderAll()});
    const sl=(id,k,lab,f)=>{const el=$(id);el.oninput=()=>{ST.bus[k]=+el.value;$(lab).textContent=f(ST.bus[k]);reframe();rebuildLite()};el.onchange=()=>renderAll()};
    sl('#wR','w','#wv',v=>v.toFixed(1)+' m');sl('#hR','h','#hv',v=>v.toFixed(1)+' m');sl('#tR','top','#tv',v=>v===1?'straight':'tapered to '+pct(v));
    $('#str').onclick=()=>{ST.bus.top=1;reframe();renderAll()}}}
let lite=false;function rebuildLite(){lite=true;rebuild();lite=false}   // while a slider moves, leave the panel's own controls alone
const _rb=renderBody;renderBody=function(){if(lite&&ST.tab==='frame')return;_rb()};
function reframe(){mkFrame();ST.items.forEach(fixAt);if(ST.held)fixAt(ST.held);if(ST.sym>1&&(ST.sym!==2||FR.N%2))ST.sym=1}
function topBar(){$('#mass').textContent=MC.m+' kg';$('#com').textContent=MC.off<2?'on axis':MC.off.toFixed(1)+' cm off';
  document.querySelectorAll('#attSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===ST.att));
  document.querySelectorAll('#symSeg button').forEach(b=>{const v=symN(b.dataset.v);b.classList.toggle('on',v===ST.sym&&!(b.dataset.v==='2'&&FR.N===2));if(b.dataset.v==='2')b.disabled=FR.N%2===1});
  $('#all').classList.toggle('on',ST.all);$('#play').classList.toggle('on',ST.play);$('#play').textContent=ST.play?'❚❚':'▶';
  $('#hint').textContent=ST.held?'Click to place. Right-click removes.':ST.items.length?'':'Pick a part.';$('#hint').style.display=$('#hint').textContent&&!Q.get('still')?'block':'none'}
function renderAll(){renderPal();rebuild()}
let msgT=0;function say(t){const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(msgT);msgT=setTimeout(()=>m.style.display='none',1600)}
// ---------------------------------------------------------------- hands: pick up, tilt, put down
function drop(){const h=ST.held;if(!h)return;ST.held=null;if(h.back){Object.assign(h,h.back);delete h.back;delete h.stick;delete h.grab;delete h.clash;ST.items.push(h)}}   // put a held part back where it was (a new one just goes)
function remove(){if(ST.held)ST.held=null;else if(ST.sel){ST.items=ST.items.filter(i=>i!==ST.sel);ST.sel=null}ST.tab='checks';renderAll()}
function tilt(k,d){const it=ST.held||ST.sel;if(!it)return;if(k==='x'){it.a=it.b=it.r=0}else if(k==='r')it.r=((it.r+d)%360+360)%360;else it[k]=Math.max(-90,Math.min(90,it[k]+d));rebuild()}
document.querySelectorAll('#tabs div').forEach(d=>d.onclick=()=>{ST.tab=d.dataset.t;renderBody()});
document.querySelectorAll('#attSeg button').forEach(b=>b.onclick=()=>{ST.att=b.dataset.v;rebuild()});
document.querySelectorAll('#symSeg button').forEach(b=>b.onclick=()=>{ST.sym=symN(b.dataset.v);if(ST.held&&ST.held.isNew)ST.held.sym=ST.sym;rebuild()});
$('#all').onclick=()=>{ST.all=!ST.all;decorate();topBar()};$('#clr').onclick=()=>{ST.items=[];ST.held=ST.sel=null;ST.tab='checks';renderAll()};
$('#th').value=ST.th;$('#th').oninput=()=>{ST.th=+$('#th').value;decorate()};$('#play').onclick=()=>{ST.play=!ST.play;topBar()};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.target.type!=='range')return;const k=e.key.toLowerCase(),T={a:['a',-15],d:['a',15],w:['b',-15],s:['b',15],q:['r',-15],e:['r',15],x:['x',0]}[k];
  if(T){tilt(...T);e.preventDefault()}else if(k==='escape'){if(ST.held){const h=ST.held;drop();ST.sel=h.back===undefined&&ST.items.includes(h)?h:null}else ST.sel=null;if(!ST.sel)ST.tab='checks';renderAll()}
  else if(k==='delete'||k==='backspace'){remove();e.preventDefault()}});
const ND=new THREE.Vector2();let down=null,moved=0;
function hit(e,g){const r=cvs.getBoundingClientRect();ND.set((e.clientX+(g?g[0]:0)-r.left)/r.width*2-1,-(e.clientY+(g?g[1]:0)-r.top)/r.height*2+1);RC.setFromCamera(ND,cam);RC.near=0;RC.far=Infinity;return RC}
cvs.onpointerdown=e=>{down=[e.clientX,e.clientY];moved=0;try{cvs.setPointerCapture(e.pointerId)}catch(_){}};
cvs.onpointermove=e=>{if(down){const dx=e.clientX-down[0],dy=e.clientY-down[1];moved+=Math.abs(dx)+Math.abs(dy);if(moved>4){ST.az+=dx*.4;ST.el=Math.max(-85,Math.min(85,ST.el+dy*.3));setCam()}down=[e.clientX,e.clientY];return}
  const h=ST.held;if(!h)return;if(h.stick){if(Math.hypot(e.clientX-h.stick[0],e.clientY-h.stick[1])<7)return;h.stick=null}
  const x=hit(e,h.grab).intersectObjects(FACES,false)[0];if(!x)return;h.at=toAt(x.point,x.object.userData.face,e.shiftKey);rebuild()};
cvs.onpointerup=e=>{const was=down;down=null;if(!was||moved>4)return;if(e.button===2)return;const h=ST.held;
  if(h){if(!h.at){return}if(h.clash){say('No room here.');return}delete h.back;delete h.stick;delete h.grab;delete h.isNew;ST.items.push(h);ST.held=null;ST.sel=h;ST.tab='part';renderAll();return}
  const x=hit(e).intersectObjects(SOLID,false)[0],I=x&&x.object.userData.inst;
  if(I){const it=I.it;ST.items=ST.items.filter(i=>i!==it);it.back={at:Object.assign({},it.at),a:it.a,b:it.b,r:it.r,sym:it.sym};it.stick=[e.clientX,e.clientY];{const r=cvs.getBoundingClientRect(),fp=(I.j===0?I.foot:x.point).clone().project(cam);it.grab=[(fp.x+1)/2*r.width+r.left-e.clientX,(1-fp.y)/2*r.height+r.top-e.clientY]}ST.held=it;ST.sel=null;ST.tab='part'}
  else{ST.sel=null;ST.tab=x?'frame':'checks'}renderAll()};
cvs.oncontextmenu=e=>{e.preventDefault();if(ST.held){ST.held=null;ST.tab='checks';renderAll();return}const x=hit(e).intersectObjects(SOLID,false)[0],I=x&&x.object.userData.inst;if(I){ST.items=ST.items.filter(i=>i!==I.it);if(ST.sel===I.it)ST.sel=null;renderAll()}};
cvs.onwheel=e=>{e.preventDefault();ST.dist=Math.max(2.5,Math.min(16,ST.dist*(e.deltaY>0?1.1:.91)));setCam()};
// ---------------------------------------------------------------- view
let W=1280,H=800;
function setCam(){const a=ST.az*D,e=ST.el*D,s=ST.dist;cam.aspect=W/H;cam.position.set(s*Math.cos(e)*Math.cos(a),s*Math.sin(e),s*Math.cos(e)*Math.sin(a));cam.lookAt(0,0,0);
  cam.setViewOffset(W,H,(342-212)/2,0,W,H);cam.updateProjectionMatrix();cam.updateMatrixWorld(true)}   // centre the craft between the panes
function size(){W=Math.max(1100,innerWidth);H=innerHeight;ren.setPixelRatio(Math.min(2,devicePixelRatio||1));ren.setSize(W,H,false);setCam()}
addEventListener('resize',size);
let last=0;function tick(t){const dt=Math.min(.1,(t-last)/1000);last=t;if(ST.play){ST.th=(ST.th+dt/24)%1;ST.ps=(ST.ps+dt/5)%1;$('#th').value=ST.th;decorate()}drawEnv();ren.render(scene,cam);requestAnimationFrame(tick)}
// ---------------------------------------------------------------- a first craft to change (?demo=empty for none)
mkFrame();
const demo=Q.get('demo');
if(demo==='block')ST.items=[item('camW',{f:'bot',s:.55,t:0}),item('kick',{f:'bot',s:0,t:0}),item('panel',{f:'top',s:0,t:0}),item('rad',{f:'s3',s:.5,t:.35}),item('panel',{e:'t3',t:.5},{b:-45}),item('thr',{e:'v0',t:.5},{b:60})];
else if(demo!=='empty')ST.items=[item('camW',{f:'bot',s:.45,t:0}),item('batt',{f:'bot',s:-.3,t:0}),item('hor',{f:'bot',s:0,t:.5}),item('panel',{f:'top',s:0,t:0}),item('whip',{c:'ct0'})];
ST.items.forEach(fixAt);if(Q.get('sel')!==null||demo==='block')ST.sel=ST.items[+Q.get('sel')||0]||null;if(ST.sel&&!Q.get('tab'))ST.tab='part';
size();renderAll();requestAnimationFrame(tick);
</script>
</body></html>
