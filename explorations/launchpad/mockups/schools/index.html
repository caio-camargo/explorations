<!-- Launchpad mock-up for POWERS.md's hardware schools. Round 1 (QUEUE Q89): Cape and Steppe, approved (W21). Round 2

     side by side (the same parts and outline: only surface, finish, paint, bells, fin edges and roundel differ), each school's
     two signature designs, and each school's pad. The Orbiter's outline is the game's own (its parts' profiles, exported
     from the sim on 2026-10-09). A standalone page: never loaded by index.html. Each view compiles its own small shader

<style>
  :root { --bg: #0e1116; --fg: #e7e9ee; --dim: #9aa3b2; --acc: #f2b84b; }

  canvas { display: block; width: 100vw; height: 100vh; }
  #bar { position: fixed; top: 8px; left: 8px; right: 8px; display: flex; gap: 5px; flex-wrap: wrap; align-items: center;
    background: rgba(14, 17, 22, .78); padding: 6px 8px; border-radius: 6px; }
  #bar button { background: #1b2029; color: var(--fg); border: 1px solid #333b48; border-radius: 4px; padding: 3px 8px; cursor: pointer; }
  #bar button.on { border-color: var(--acc); color: var(--acc); }
  #bar .lab { color: var(--dim); margin: 0 2px 0 6px; }
  #cap { position: fixed; left: 12px; bottom: 10px; right: 12px; color: #fff; text-shadow: 0 1px 3px #000; }
  body.still #bar { display: none; }
</style>

// the generated part of a view's shader: its rockets, the design tables, the font, and the outlines it uses
function fsFor(key, vi) {
  const V = VIEWS[key], used = [...new Set(V.rk.map(r => r.d))], f = n => (+n).toFixed(4);
  const v2 = ([a, b]) => `vec2(${f(a)},${f(b)})`, v4 = a => `vec4(${a.map(f).join(',')})`, N = DES.length;
  let s = `#define VIEW ${vi}\n#define NI ${V.rk.length}\n`;
  s += `const vec4 IO[NI]=vec4[NI](${V.rk.map(r => v4([...r.o, r.th])).join(',')});\nconst float IPS[NI]=float[NI](${V.rk.map(r => f(r.ps)).join(',')});\n`;
  s += `const ivec2 ID[NI]=ivec2[NI](${V.rk.map(r => `ivec2(${r.d},${r.s})`).join(',')});\n`;
  s += `const vec4 DI[${N}]=vec4[${N}](${DES.map(d => v4(d.di)).join(',')});\n`;
  s += `const vec4 CV[${N * 3}]=vec4[${N * 3}](${DES.flatMap(d => [0, 1, 2].map(i => v4(d.cv[i] || [0, 0, 0, 0]))).join(',')});\n`;
  s += `const vec4 FN[${N}]=vec4[${N}](${DES.map(d => v4(d.fn || [0, 0, 0, 0])).join(',')});\nconst vec2 FN2[${N}]=vec2[${N}](${DES.map(d => v2(d.fn2 || [0, 0])).join(',')});\n`;
  s += `const vec2 BR[${N}]=vec2[${N}](${DES.map(d => v2([d.di[3], d.br])).join(',')});\n`;
  s += `const int FONT[${GLYPHS.length}]=int[${GLYPHS.length}](${GLYPHS.map(g => parseInt(FONT[g], 2)).join(',')});\n`;
  const codes = STRS.flatMap(t => [...t].map(c => GLYPHS.indexOf(c))), offs = []; let o = 0; for (const t of STRS) { offs.push(o); o += t.length; }
  s += `const int STR[${codes.length}]=int[${codes.length}](${codes.join(',')});const int SOFF[${STRS.length}]=int[${STRS.length}](${offs.join(',')});const int SLEN[${STRS.length}]=int[${STRS.length}](${STRS.map(t => t.length).join(',')});\n`;
  for (const d of used) { const P = DES[d].prof;
    s += `const vec2 P${d}[${P.length}]=vec2[${P.length}](${P.map(v2).join(',')});
float pf${d}(vec3 p){vec2 q=vec2(length(p.xz),p.y);float d=1e9;bool ins=false;
 for(int i=ZERO;i<${P.length - 1};i++){vec2 a=P${d}[i],b=P${d}[i+1],ba=b-a,pa=q-a;float h=clamp(dot(pa,ba)/max(dot(ba,ba),1e-9),0.,1.);d=min(d,length(pa-ba*h));
  if(q.y>=a.y&&q.y<b.y){float r=mix(a.x,b.x,(q.y-a.y)/(b.y-a.y));if(q.x<r)ins=true;}}
 d=min(d,max(abs(q.y-P${d}[0].y),q.x-P${d}[0].x));return ins?-d:d;}
#define D${d} 1\n`; }
  s += `float prof(vec3 p,int d){${used.map(d => `if(d==${d})return pf${d}(p);`).join('')}return 1e9;}\n`;
  return FS.replace('//@GEN', s);
}

vec3 toR(vec3 p,int i){vec3 q=p-IO[i].xyz;float th=IO[i].w,ps=IPS[i];vec3 u=vec3(cos(ps),0.,sin(ps)),ax=cos(th)*vec3(0.,1.,0.)+sin(th)*u,xl=cos(th)*u-sin(th)*vec3(0.,1.,0.),zl=vec3(-sin(ps),0.,cos(ps));
