<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Floor</title>
<style>
  :root { --bg: #0b0b0e; --fg: #8a8a96; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { display: grid; place-items: center; font: 11px/1.4 ui-monospace, Consolas, monospace; color: var(--fg); }
  canvas { display: block; max-width: calc(100vw - 32px); max-height: calc(100vh - 56px); aspect-ratio: 240 / 216; width: auto; height: auto; }
  #hud { position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; opacity: .55; user-select: none; }
  #hud.rec { color: #d44; opacity: 1; }
</style>
</head>
<body>
<canvas id="c" width="720" height="648"></canvas>
<div id="hud">[G] glitch: lo-fi · [space] pause · [R] record 10s webm · [S] new seed</div>
<script>
// Low-res internal buffer, upscaled soft — the "bad webcam" look comes from resolution first.
const W = 240, H = 216;
const out = document.getElementById('c'), octx = out.getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
const ctx = buf.getContext('2d', { willReadFrequently: true });
const sky = document.createElement('canvas'); sky.width = W; sky.height = H;
const sctx = sky.getContext('2d');
const skyImg = sctx.createImageData(W, H);

let seed = Date.now() % 100000;
function rng() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

// ---- tileable cloud texture: periodic value-noise fbm + speckle, lavender→periwinkle ----
const TW = 256;
let tex;
function buildTexture() {
  const f = new Float32Array(TW * TW);
  for (const [p, w] of [[4, .5], [8, .25], [16, .14], [32, .07], [64, .04]]) {
    const g = new Float32Array(p * p).map(() => rng());
    const cell = TW / p;
    for (let y = 0; y < TW; y++) for (let x = 0; x < TW; x++) {
      const gx = x / cell, gy = y / cell, ix = gx | 0, iy = gy | 0;
      let fx = gx - ix, fy = gy - iy; fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
      const a = g[iy * p + ix], b = g[iy * p + (ix + 1) % p];
      const c = g[((iy + 1) % p) * p + ix], d = g[((iy + 1) % p) * p + (ix + 1) % p];
      f[y * TW + x] += w * ((a + (b - a) * fx) * (1 - fy) + (c + (d - c) * fx) * fy);
    }
  }
  tex = new Uint8ClampedArray(TW * TW * 3);
  for (let i = 0; i < TW * TW; i++) {
    let n = Math.min(1, Math.max(0, (f[i] - .34) * 2.3)) + (rng() - .5) * .22; // speckle
    n = Math.min(1, Math.max(0, n));
    tex[i * 3]     = 238 - n * 128;
    tex[i * 3 + 1] = 236 - n * 116;
    tex[i * 3 + 2] = 246 - n * 44;
  }
}
function sample(u, v) {
  const i = ((((v | 0) % TW) + TW) % TW) * TW + ((((u | 0) % TW) + TW) % TW);
  return i * 3;
}

// ---- room geometry (one-point perspective) ----
const vx = W * .5, vy = H * .34;           // vanishing point / eye height
const bx0 = W * .17, bx1 = W * .83;       // back wall
const by0 = H * .03, by1 = H * .55;
const hw = (bx1 - bx0) / 2, D = by1 - vy;
const wx0 = W * .34, wx1 = W * .66, wy0 = by0 + 7, wy1 = H * .33; // window

function renderSkyLayer(t) {
  const d = skyImg.data; d.fill(0);
  const floorScroll = t * 22, winScroll = t * 6;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const o = (y * W + x) * 4;
      let s, shade = 1;
      if (y > by1) {                          // floor: the sky, lying down
        const dy = y - vy, X = (x - vx) * D / dy;
        if (X < -hw - .5 || X > hw + .5) continue;
        const Z = dy / D;                     // 1 at back wall, grows toward viewer
        s = sample(X * 1.3 + floorScroll, Z * 70);
        shade = .86 + .14 * Math.min(1, (Z - 1) * 1.5);
      } else if (x >= wx0 && x < wx1 && y >= wy0 && y < wy1) { // window: the sky, standing up
        s = sample(x * .7 - winScroll, y * .7 + 90);
        shade = 1.04;
      } else continue;
      d[o] = tex[s] * shade; d[o + 1] = tex[s + 1] * shade; d[o + 2] = tex[s + 2] * shade; d[o + 3] = 255;
    }
  }
  sctx.putImageData(skyImg, 0, 0);
}

function poly(pts, fill) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (const p of pts.slice(1)) ctx.lineTo(p[0], p[1]);
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
}
const edgeX = bx => vx + (bx - vx) * (H - vy) / D; // where a floor corner line meets the bottom

function drawRoom(t) {
  // ceiling sliver
  poly([[0, 0], [W, 0], [bx1, by0], [bx0, by0]], '#e4e3ea');
  // walls
  let g = ctx.createLinearGradient(0, 0, bx0, 0); g.addColorStop(0, '#a9a8b4'); g.addColorStop(1, '#c9c8d2');
  poly([[0, 0], [bx0, by0], [bx0, by1], [edgeX(bx0), H], [-200, H]], g);
  g = ctx.createLinearGradient(bx1, 0, W, 0); g.addColorStop(0, '#d6d5de'); g.addColorStop(1, '#ecebf1');
  poly([[W, 0], [bx1, by0], [bx1, by1], [edgeX(bx1), H], [W + 200, H]], g);
  g = ctx.createLinearGradient(0, by0, 0, by1); g.addColorStop(0, '#d9d8e0'); g.addColorStop(1, '#c4c3cc');
  poly([[bx0, by0], [bx1, by0], [bx1, by1], [bx0, by1]], g);
  // the sky layer (floor + window view)
  ctx.drawImage(sky, 0, 0);
  // window frame
  ctx.strokeStyle = '#f1f0f5'; ctx.lineWidth = 2; ctx.strokeRect(wx0 - 1, wy0 - 1, wx1 - wx0 + 2, wy1 - wy0 + 2);
  ctx.fillStyle = '#b8b7c2'; ctx.fillRect(wx0 - 2, wy1 + 1, wx1 - wx0 + 4, 2);
  // baseboards along the floor edges
  ctx.strokeStyle = '#eeedf3'; ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(edgeX(bx0), H); ctx.lineTo(bx0, by1); ctx.lineTo(bx1, by1); ctx.lineTo(edgeX(bx1), H);
  ctx.stroke();
  // corner seams
  ctx.strokeStyle = 'rgba(120,118,135,.35)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(bx0, by0); ctx.lineTo(bx0, by1); ctx.moveTo(bx1, by0); ctx.lineTo(bx1, by1); ctx.stroke();
}

function drawCurtain(t) {
  // sheer curtain: vertical strips, folds travel slowly, hem sways toward the viewer's left
  const cx0 = W * .30, cx1 = W * .60, top = wy0 - 3, strips = 44;
  const sw = (cx1 - cx0) / strips;
  for (let i = 0; i < strips; i++) {
    const x = cx0 + i * sw;
    const fold = Math.sin(i * .55 + t * .5 + Math.sin(i * .17 + t * .21) * 2);
    const sway = Math.sin(t * .35 + i * .05) * 5 + Math.sin(t * 1.3 + i * .4) * .8;
    const hem = by1 + 3 + Math.sin(i * .9 + t * .6) * 2.5;
    const L = 212 + fold * 22, a = .9 - Math.max(0, -fold) * .12;
    ctx.fillStyle = `rgba(${L},${L - 2},${L + 8},${a})`;
    ctx.beginPath();
    ctx.moveTo(x, top); ctx.lineTo(x + sw + .6, top);
    ctx.lineTo(x + sw + .6 + sway, hem); ctx.lineTo(x + sway, hem);
    ctx.fill();
  }
  ctx.fillStyle = '#9d9ca8'; ctx.fillRect(W * .27, top - 2, W * .46, 2); // rod
}

function drawOrb(t) {
  const cx = W * .48 + Math.sin(t * .23) * 5;
  const cy = H * .63 + Math.sin(t * .52) * H * .085 + Math.sin(t * 1.7) * 1.2;
  const r = H * .135;
  ctx.fillStyle = '#040406';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
}

// ---- glitch post-process, all at low res ----
const LEVELS = ['clean', 'lo-fi', 'broken'];
const q = v => Math.min(255, Math.max(0, v)) & 0xf8;
let level = 1, prev = null, burst = 0;
function postfx(t) {
  const img = ctx.getImageData(0, 0, W, H), d = img.data;
  const src = new Uint8ClampedArray(d);
  const heavy = level === 2 || burst > 0;
  // chroma bleed: red pulled left, blue pushed right
  const cs = level === 0 ? 0 : heavy ? 3 : 1;
  if (cs) for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const o = (y * W + x) * 4;
    d[o] = src[(y * W + Math.min(W - 1, x + cs)) * 4];
    d[o + 2] = src[(y * W + Math.max(0, x - cs)) * 4 + 2];
  }
  if (level > 0) {
    // datamosh: some 8x8 blocks keep last frame's pixels, dragged sideways
    if (prev && (heavy || rng() < .35)) {
      const n = heavy ? 60 : 8;
      for (let k = 0; k < n; k++) {
        const bx = (rng() * (W / 8) | 0) * 8, by = (rng() * (H / 8) | 0) * 8, mv = (rng() * 5 | 0) - 2;
        for (let y = by; y < by + 8; y++) for (let x = bx; x < bx + 8; x++) {
          const sx = Math.min(W - 1, Math.max(0, x + mv)), o = (y * W + x) * 4, p = (y * W + sx) * 4;
          d[o] = prev[p]; d[o + 1] = prev[p + 1]; d[o + 2] = prev[p + 2];
        }
      }
    }
    // macroblocking: a few blocks flattened to their average (low-bitrate look)
    const nb = heavy ? 30 : 4;
    for (let k = 0; k < nb; k++) {
      const s = rng() < .7 ? 8 : 16;
      const bx = (rng() * (W / s) | 0) * s, by = (rng() * (H / s) | 0) * s;
      let r = 0, g = 0, b = 0, c = 0;
      for (let y = by; y < Math.min(H, by + s); y++) for (let x = bx; x < bx + s; x++) { const o = (y * W + x) * 4; r += d[o]; g += d[o + 1]; b += d[o + 2]; c++; }
      for (let y = by; y < Math.min(H, by + s); y++) for (let x = bx; x < bx + s; x++) { const o = (y * W + x) * 4; d[o] = r / c; d[o + 1] = g / c; d[o + 2] = b / c; }
    }
    // horizontal tear
    if (heavy || rng() < .04) {
      const y0 = rng() * H | 0, h = 2 + rng() * (heavy ? 18 : 6) | 0, sh = (rng() * 24 - 12) | 0;
      const band = new Uint8ClampedArray(d.subarray(y0 * W * 4, Math.min(H, y0 + h) * W * 4));
      for (let y = 0; y < h && y0 + y < H; y++) for (let x = 0; x < W; x++) {
        const sx = ((x - sh) % W + W) % W, o = ((y0 + y) * W + x) * 4, p = (y * W + sx) * 4;
        d[o] = band[p]; d[o + 1] = band[p + 1]; d[o + 2] = band[p + 2];
      }
    }
  }
  // grain + 5-bit colour
  const gr = level === 0 ? 6 : 14;
  for (let i = 0; i < d.length; i += 4) {
    const n = (rng() - .5) * gr;
    // clamp BEFORE masking: out-of-range values wrap (-3 & 0xf8 = 248, 260 & 0xf8 = 0) → yellow specks
    d[i] = q(d[i] + n); d[i + 1] = q(d[i + 1] + n); d[i + 2] = q(d[i + 2] + n);
  }
  ctx.putImageData(img, 0, 0);
  prev = d.slice();
}

// ---- loop: 12 fps, stuttery on purpose ----
let t = 0, last = performance.now(), acc = 0, paused = false;
const STEP = 1 / 12;
function frame(now) {
  acc += Math.min(.25, (now - last) / 1000); last = now;
  if (!paused && acc >= STEP) {
    const dt = acc; acc = 0;
    // occasional dropped frame: time moves, picture doesn't
    if (level === 0 || rng() > .06) {
      t += dt;
      if (level > 0 && burst <= 0 && rng() < .012) burst = 3 + rng() * 8 | 0;
      renderSkyLayer(t); drawRoom(t); drawCurtain(t); drawOrb(t); postfx(t);
      if (burst > 0) burst--;
      octx.imageSmoothingEnabled = true;
      octx.drawImage(buf, 0, 0, out.width, out.height);
      const v = octx.createRadialGradient(out.width / 2, out.height / 2, out.width * .3, out.width / 2, out.height / 2, out.width * .75);
      v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(10,8,20,.45)');
      octx.fillStyle = v; octx.fillRect(0, 0, out.width, out.height);
    } else t += dt;
  }
  requestAnimationFrame(frame);
}

// ---- controls ----
const hud = document.getElementById('hud');
const hudText = () => `[G] glitch: ${LEVELS[level]} · [space] pause · [R] record 10s webm · [S] new seed`;
let recorder = null;
function record() {
  if (recorder) { recorder.stop(); return; }
  const mime = ['video/webm;codecs=vp9', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  const chunks = [];
  recorder = new MediaRecorder(out.captureStream(30), { mimeType: mime, videoBitsPerSecond: 6e6 });
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
    a.download = `sky-floor-${Date.now()}.webm`; a.click();
    recorder = null; hud.classList.remove('rec'); hud.textContent = hudText();
  };
  recorder.start(); hud.classList.add('rec'); hud.textContent = '● recording — R to stop early';
  setTimeout(() => recorder && recorder.stop(), 10000);
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'g') { level = (level + 1) % 3; hud.textContent = hudText(); }
  else if (k === ' ') { paused = !paused; e.preventDefault(); }
  else if (k === 'r') record();
  else if (k === 's') { seed = Date.now() % 100000; buildTexture(); }
});

buildTexture();
requestAnimationFrame(frame);
</script>
</body>
</html>
