<script>
const A = window.ASSETS, W = A.W, H = A.H;
const out = document.getElementById('c'), octx = out.getContext('2d');
out.width = W * 1.5; out.height = H * 1.5;
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
const ctx = buf.getContext('2d', { willReadFrequently: true });

let seed = 12345;
function rng() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

function load(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; }); }

let bgPx, panelImg, warped;
const P = A.panel, C = A.circle, R = A.rect;

// ---- the photo breathes: a coarse displacement grid, bilinear per pixel, nearest sample ----
const G = 24, GW = Math.ceil(W / G) + 2, GH = Math.ceil(H / G) + 2;
const gdx = new Float32Array(GW * GH), gdy = new Float32Array(GW * GH);
function warpPhoto(t) {
  const gust = 1.6 + 3.2 * Math.pow(Math.max(0, Math.sin(t * .31)), 3);
  for (let j = 0; j < GH; j++) for (let i = 0; i < GW; i++) {
    const k = j * GW + i;
    gdx[k] = gust * Math.sin(j * .55 + t * 1.1 + Math.sin(i * .31 + t * .4) * 1.5);
    gdy[k] = gust * .6 * Math.sin(i * .47 - t * .8 + Math.cos(j * .23 + t * .27));
  }
  const s = bgPx, d = warped.data;
  for (let y = 0; y < H; y++) {
    const gy = y / G, j = gy | 0, fy = gy - j;
    for (let x = 0; x < W; x++) {
      const o = (y * W + x) * 4;
      const gx = x / G, i = gx | 0, fx = gx - i, k = j * GW + i;
      const dx = (gdx[k] * (1 - fx) + gdx[k + 1] * fx) * (1 - fy) + (gdx[k + GW] * (1 - fx) + gdx[k + GW + 1] * fx) * fy;
      const dy = (gdy[k] * (1 - fx) + gdy[k + 1] * fx) * (1 - fy) + (gdy[k + GW] * (1 - fx) + gdy[k + GW + 1] * fx) * fy;
      const sx = Math.min(W - 1, Math.max(0, x + dx | 0)), sy = Math.min(H - 1, Math.max(0, y + dy | 0));
      const p = (sy * W + sx) * 4;
      d[o] = s[p]; d[o + 1] = s[p + 1]; d[o + 2] = s[p + 2]; d[o + 3] = 255;
    }
  }
  ctx.putImageData(warped, 0, 0);
}

// ---- the white panel is a strip of film sliding past ----
let panelX = 0;
function drawPanel(t, dt) {
  panelX = (panelX + dt * 34 + (rng() < .02 ? rng() * 120 : 0)) % P.w; // occasional skip
  ctx.save(); ctx.beginPath(); ctx.rect(P.x, P.y, P.w, P.h); ctx.clip();
  ctx.drawImage(panelImg, P.x - panelX, P.y); ctx.drawImage(panelImg, P.x - panelX + P.w, P.y);
  if (rng() < .08) { ctx.fillStyle = `rgba(255,255,255,${.3 + rng() * .5})`; ctx.fillRect(P.x, P.y, P.w, P.h); } // overexposure flicker
  ctx.restore();
}

// ---- the rectangle is a cut-out someone keeps re-placing (stop-motion) ----
const rect = { x: R.x, y: R.y, hold: 3 };
function stepRect(dt) {
  rect.hold -= dt;
  if (rect.hold <= 0) {
    rect.x = P.x + 8 + rng() * (P.w - R.w - 16);
    rect.y = R.y + (rng() - .5) * 14;
    rect.hold = 1.5 + rng() * 3.5;
  }
  const jx = rng() < .15 ? (rng() - .5) * 3 : 0, jy = rng() < .15 ? (rng() - .5) * 3 : 0; // hand-placed judder
  ctx.fillStyle = '#030303';
  ctx.fillRect(rect.x + jx | 0, rect.y + jy | 0, R.w, R.h);
}

// ---- the circle drifts, lazily, never quite leaving home ----
function drawCircle(t) {
  const cx = C.x + Math.sin(t * .21) * 26 + Math.sin(t * .67) * 5;
  const cy = C.y + Math.sin(t * .43 + 1) * 18;
  ctx.fillStyle = '#030303';
  ctx.beginPath(); ctx.arc(cx, cy, C.r, 0, Math.PI * 2); ctx.fill();
}

// ---- glitch post-process (same pipeline as sky-floor) ----
const LEVELS = ['clean', 'lo-fi', 'broken'];
const q = v => Math.min(255, Math.max(0, v)) & 0xf8;
let level = 1, prev = null, burst = 0;
function postfx() {
  const img = ctx.getImageData(0, 0, W, H), d = img.data;
  const src = new Uint8ClampedArray(d);
  const heavy = level === 2 || burst > 0;
  const cs = level === 0 ? 0 : heavy ? 4 : 2;
  if (cs) for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const o = (y * W + x) * 4;
    d[o] = src[(y * W + Math.min(W - 1, x + cs)) * 4];
    d[o + 2] = src[(y * W + Math.max(0, x - cs)) * 4 + 2];
  }
  if (level > 0) {
    if (prev && (heavy || rng() < .35)) {           // datamosh: stale blocks dragged sideways
      const n = heavy ? 140 : 18;
      for (let k = 0; k < n; k++) {
        const bx = (rng() * (W / 8) | 0) * 8, by = (rng() * (H / 8) | 0) * 8, mv = (rng() * 7 | 0) - 3;
        for (let y = by; y < Math.min(H, by + 8); y++) for (let x = bx; x < Math.min(W, bx + 8); x++) {
          const sx = Math.min(W - 1, Math.max(0, x + mv)), o = (y * W + x) * 4, p = (y * W + sx) * 4;
          d[o] = prev[p]; d[o + 1] = prev[p + 1]; d[o + 2] = prev[p + 2];
        }
      }
    }
    const nb = heavy ? 60 : 8;                       // macroblocking
    for (let k = 0; k < nb; k++) {
      const s = rng() < .7 ? 8 : 16;
      const bx = (rng() * (W / s) | 0) * s, by = (rng() * (H / s) | 0) * s;
      let r = 0, g = 0, b = 0, c = 0;
      for (let y = by; y < Math.min(H, by + s); y++) for (let x = bx; x < Math.min(W, bx + s); x++) { const o = (y * W + x) * 4; r += d[o]; g += d[o + 1]; b += d[o + 2]; c++; }
      for (let y = by; y < Math.min(H, by + s); y++) for (let x = bx; x < Math.min(W, bx + s); x++) { const o = (y * W + x) * 4; d[o] = r / c; d[o + 1] = g / c; d[o + 2] = b / c; }
    }
    if (heavy || rng() < .05) {                      // horizontal tear
      const y0 = rng() * H | 0, h = 3 + rng() * (heavy ? 40 : 12) | 0, sh = (rng() * 60 - 30) | 0;
      const band = new Uint8ClampedArray(d.subarray(y0 * W * 4, Math.min(H, y0 + h) * W * 4));
      for (let y = 0; y < h && y0 + y < H; y++) for (let x = 0; x < W; x++) {
        const sx = ((x - sh) % W + W) % W, o = ((y0 + y) * W + x) * 4, p = (y * W + sx) * 4;
        d[o] = band[p]; d[o + 1] = band[p + 1]; d[o + 2] = band[p + 2];
      }
    }
  }
  const gr = level === 0 ? 6 : 16;
  for (let i = 0; i < d.length; i += 4) {
    const n = (rng() - .5) * gr;
    d[i] = q(d[i] + n); d[i + 1] = q(d[i + 1] + n); d[i + 2] = q(d[i + 2] + n);
  }
  ctx.putImageData(img, 0, 0);
  prev = d.slice();
}

// ---- loop: 12 fps with dropped frames ----
let t = 0, last = performance.now(), acc = 0, paused = false;
const STEP = 1 / 12;
function frame(now) {
  acc += Math.min(.25, (now - last) / 1000); last = now;
  if (!paused && acc >= STEP) {
    const dt = acc; acc = 0; t += dt;
    if (level === 0 || rng() > .06) {
      if (level > 0 && burst <= 0 && rng() < .012) burst = 3 + rng() * 8 | 0;
      warpPhoto(t); drawPanel(t, dt); stepRect(dt); drawCircle(t); postfx();
      if (burst > 0) burst--;
      octx.imageSmoothingEnabled = true;
      octx.drawImage(buf, 0, 0, out.width, out.height);
    }
  }
  requestAnimationFrame(frame);
}

// ---- controls ----
const hud = document.getElementById('hud');
const hudText = () => `[G] glitch: ${LEVELS[level]} · [space] pause · [R] record 10s webm`;
hud.textContent = hudText();
let recorder = null;
function record() {
  if (recorder) { recorder.stop(); return; }
  const mime = ['video/webm;codecs=vp9', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  const chunks = [];
  recorder = new MediaRecorder(out.captureStream(30), { mimeType: mime, videoBitsPerSecond: 8e6 });
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
    a.download = `danya-collage-${Date.now()}.webm`; a.click();
    recorder = null; hud.classList.remove('rec'); hud.textContent = hudText();
  };
  recorder.start(); hud.classList.add('rec'); hud.textContent = '● recording — R to stop early';
  setTimeout(() => recorder && recorder.stop(), 10000);
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'g') { level = (level + 1) % 3; hud.textContent = hudText(); }
  else if (k === ' ') { paused = !paused; e.preventDefault(); }
  else if (k === 'r') record();
});

Promise.all([load(A.bg), load(A.panelImg)]).then(([bg, pi]) => {
  ctx.drawImage(bg, 0, 0);
  bgPx = ctx.getImageData(0, 0, W, H).data;
  warped = ctx.createImageData(W, H);
  panelImg = pi;
  requestAnimationFrame(frame);
});
</script>
</body>
