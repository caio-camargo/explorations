<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Night Storm</title>
<style>
  :root { --bg: #000; --fg: #555a7a; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { display: grid; place-items: center; font: 11px/1.4 ui-monospace, Consolas, monospace; color: var(--fg); }
  /* 320x200 shown at 4:3 — VGA pixels were 20% taller than wide */
  canvas { display: block; aspect-ratio: 4 / 3; width: min(calc(100vw - 32px), calc((100vh - 40px) * 4 / 3)); height: auto;
           image-rendering: pixelated; cursor: none; }
  #hud { position: fixed; bottom: 6px; left: 0; right: 0; text-align: center; user-select: none; }
  #hud.rec { color: #d44; }
</style>
</head>
<body>
<canvas id="c" width="1600" height="1200"></canvas>
<div id="hud">click a verb, then something in the scene · [L] lightning · [space] pause · [R] record 10s</div>

const out = document.getElementById('c'), octx = out.getContext('2d');

let room = 'out';                                              // 'out' = the storm, 'in' = the keeper's room
const MX = 60, MY = 26;                                        // moon
const ridge = Array.from({ length: W }, (_, x) => {
  const m = tS(x * .7, 3) * .8 + tS(x * 2.2, 40) * .2, taper = x < 160 ? 1 : Math.max(0, (205 - x) / 45);
  return x < 205 ? Math.round(HZ - 3 - m * 26 * taper) : HZ;
});
// rock strata: tilted bedding planes; within each bed the face bulges out going down, then
// snaps back — that sawtooth is what reads as ledges (lit tops, shadow lines under them)
const bed = (x, y) => {
  const s = (y + tS(x * 1.3, 5) * 10 + tS(x * .6, y * .6 + 30) * 6 + x * .12) / (5 + tS(x * .5, 60) * 4), f = s - Math.floor(s);
  return (f < .8 ? f / .8 : 1 - (f - .8) / .2) * (.3 + tS(x * 2, y * .7) * .9);   // weathered beds fade out

const cliffTop = Array.from({ length: W }, (_, x) => x >= 250 && x <= 286 ? 63 : 62 + tS(x * 2, 11) * 5);
const cliffLeft = Array.from({ length: SH }, (_, y) => 236 - (y - 62) * .34 - tS(y * 3, 23) * 4 - bed(230, y) * 3);
const hillTop = Array.from({ length: W }, (_, x) => x < 150
  ? 108 + (x / 148) ** 2 * 40 + tS(x * 2, 31) * 4 - Math.max(0, 1 - Math.abs(x - 116) / 13) * 6 * (.7 + tS(x * 6, 3) * .3)
  : 999);
const hillRight = Array.from({ length: SH }, (_, y) => { let r = -1; for (let x = 0; x < 150; x++) if (hillTop[x] <= y) r = x; return r; });

// ---------- static layer: foreground relief, lit per pixel once at startup ----------
// Each static pixel stores a ramp key + a shade float; the per-frame pass only dithers it,
// so it follows the painted/dithered toggle for free.
const KEYS = ['MOUNT', 'ROCK', 'EARTH', 'GRASS', 'MOSS'];
const stZ = new Uint8Array(W * SH);                 // boulder pixels: the y of the boulder's base (depth)
const stK = new Int8Array(W * SH).fill(-1), stV = new Float32Array(W * SH), stI = new Uint8Array(W * SH);
const put = (x, y, key, v, id) => { if (x >= 0 && x < W && y >= 0 && y < SH) { const i = y * W + x; stK[i] = KEYS.indexOf(key); stV[i] = v; stI[i] = id; } };
const LN = Math.hypot(-.55, -.6, .58), Lx = -.55 / LN, Ly = -.6 / LN, Lz = .58 / LN;   // moonlight: upper left, toward us
function lit(h, x, y, k) {                           // n·L from a heightfield's finite differences

    const nx = (x - cx) / rx, ny = (y - cy) / ry, d2 = nx * nx + ny * ny;

{

      px(ox + rx * 2, oy + ry * 2, c2); px(ox + rx * 2 + 1, oy + ry * 2, c2); px(ox + rx * 2, oy + ry * 2 + 1, c2); px(ox + rx * 2 + 1, oy + ry * 2 + 1, c2);
    }));
  }
  if (say) {
    if (t > say.until) say = null;
    else {                                                                    // above my head, kept on screen
      const head = Math.round(me.y) - Math.round((room === 'out' ? 20 : 34) * meScale()) - 3;
      const y0 = Math.max(2, head - say.lines.length * 9);
      say.lines.forEach((l, i) => {
        const w = textW(l), x0 = Math.min(W - 2 - w, Math.max(2, Math.round(me.x) - (w >> 1)));
        text(l, x0, y0 + i * 9, TALK, BLACK);
      });
    }
  }
  if (mx >= 0) {                                                               // crosshair cursor
    const cc = CURSOR[(t * 12 | 0) % 4];
    for (let k = 2; k <= 4; k++) { px(mx - k, my, cc); px(mx + k, my, cc); px(mx, my - k, cc); px(mx, my + k, cc); }
  }
}

// ---------- loop ----------
let paused = false, last = performance.now(), acc = 0;
const STEP = 1 / 15;
function frame(now) {
  acc += Math.min(.25, (now - last) / 1000); last = now;
  if (acc >= STEP) {
    const step = !paused; acc = 0;
    if (step) { t += STEP; if (t > nextStrike) strike(); updateMe(); }
    const flash = step ? (flashSeq.length ? flashSeq.shift() : 0) : 0;
    if (!flashSeq.length && !flash) bolt = null; else bolt = true;
    const ba = t * .7;                                               // ~9 s per turn
    BEAM.c = Math.cos(ba); BEAM.s = Math.sin(ba); BEAM.face = Math.max(0, BEAM.s) ** 6;
    if (room === 'out') {
      drawScene(flash);
      drawRain(step);
      drawBeam();                                                    // after rain: drops glitter in the beam
    } else drawInside(flash);
    drawUI();
    // facing us, the lamp briefly warms the whole scene (UI excluded)
    const wk = room === 'out' ? BEAM.face * .13 : 0, P0 = PALS[room === 'out' ? flash : 0];   // indoors the flash comes only THROUGH the window
    const P = wk < .005 ? P0 : P0.map((c, i) => uiSet.has(i) ? c : c.map((v, j) => v + (WARM[j] - v) * wk)), d = img.data;
    for (let i = 0; i < W * H; i++) { const c = P[idx[i]]; d[i * 4] = c[0]; d[i * 4 + 1] = c[1]; d[i * 4 + 2] = c[2]; d[i * 4 + 3] = 255; }
    lctx.putImageData(img, 0, 0);
    present();
  }
  requestAnimationFrame(frame);
}

// ---------- presentation: raw pixels, or a CRT ----------
// CRT: blur horizontally only (the beam smeared along the scanline, not across it), then
// nearest-scale each source row to 6 output rows and darken the bottom of each, plus glow.
const mid = document.createElement('canvas'); mid.width = out.width; mid.height = H;
const mctx = mid.getContext('2d');
const scan = document.createElement('canvas'); scan.width = 1; scan.height = 6;
{ const s = scan.getContext('2d'); ['#ffffff', '#ffffff', '#f2f2f2', '#d6d6d6', '#8e8e8e', '#c4c4c4'].forEach((c, i) => { s.fillStyle = c; s.fillRect(0, i, 1, 1); }); }
const scanPat = octx.createPattern(scan, 'repeat');
let crt = false;
function present() {
  octx.globalCompositeOperation = 'source-over'; octx.globalAlpha = 1; octx.filter = 'none';
  if (!crt) { octx.imageSmoothingEnabled = false; octx.drawImage(lo, 0, 0, out.width, out.height); return; }   // 5x wide, 6x tall
  mctx.imageSmoothingEnabled = true; mctx.drawImage(lo, 0, 0, mid.width, H);
  octx.imageSmoothingEnabled = false; octx.drawImage(mid, 0, 0, out.width, out.height);
  octx.globalCompositeOperation = 'multiply'; octx.fillStyle = scanPat; octx.fillRect(0, 0, out.width, out.height);
  octx.globalCompositeOperation = 'lighter'; octx.globalAlpha = .28; octx.filter = 'blur(7px)';
  octx.drawImage(lo, 0, 0, out.width, out.height);
  octx.globalCompositeOperation = 'source-over'; octx.globalAlpha = 1; octx.filter = 'none';
  const v = octx.createRadialGradient(800, 600, 450, 800, 600, 1050);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)');
  octx.fillStyle = v; octx.fillRect(0, 0, out.width, out.height);
}

function aim(e) {
  const r = out.getBoundingClientRect();
  mx = Math.floor((e.clientX - r.left) / r.width * W); my = Math.floor((e.clientY - r.top) / r.height * H);
}
out.addEventListener('mousemove', aim);
out.addEventListener('mouseleave', () => { mx = my = -1; });
out.addEventListener('click', e => {
  aim(e);
  if (my >= SH) {
    const v = verbAt(mx, my);
    if (v) { verb = v; held = null; return; }
    const it = invAt(mx, my);
    if (!it) return;
    if (held && held !== it) { act('Use', ITEM_ID[it], held); held = null; verb = 'Walk to'; }
    else if (verb === 'Use' && !held) held = it;                      // "Use paperclip with ..."
    else { act(held ? 'Use' : verb, ITEM_ID[it]); held = null; verb = 'Walk to'; }
  }
  else if (my >= 0) {
    const id = idb[my * W + mx], v = verb, item = held;
    verb = 'Walk to'; held = null;
    if (id === ID.me) act(v, id, item);                             // no need to walk to myself
    else if (room === 'in') {
      const pend = v !== 'Walk to' || item || LINES[`Walk to|${id}`] || SPECIAL[`Walk to|${id}`] ? { verb: v, id, item, fx: mx } : null;
      goTo({ hill: WP[id] ? nearestWalk(...toScr(WP[id])) : nearestWalk(mx, my) }, pend);
    } else {
      const pend = v !== 'Walk to' || item || LINES[`Walk to|${id}`] || id === ID.door ? { verb: v, id, item, fx: mx } : null;
      if (v === 'Use' && id === ID.bridge)                           // "Use bridge" = cross to the other side
        goTo({ k: me.mode === 'path' && me.k > K_BRIDGE + (K_CLIFF - K_BRIDGE) / 2 ? K_BRIDGE - 1 : K_CLIFF }, null);
      else if (id === ID.door || id === ID.lighthouse) goTo({ k: K_DOOR }, pend);
      else if (ROUTE.has(id)) goTo({ k: nearestK(mx, my) }, pend);
      else goTo({ hill: nearestWalk(mx, my) }, pend);
    }
  }
});

const hud = document.getElementById('hud');
const hudText = () => `${room === 'in' ? 'the keeper\'s room' : 'outside'} · [V] ${painted ? `painted (${NCOL(RL)} colours)` : `dithered (${NCOL(RS)} colours)`} · [C] CRT ${crt ? 'on' : 'off'} · [L] lightning · [space] pause · [R] record`;
let HUD = hud.textContent = hudText();
let recorder = null;
function record() {
  if (recorder) { recorder.stop(); return; }
  const mime = ['video/webm;codecs=vp9', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m)), chunks = [];
  recorder = new MediaRecorder(out.captureStream(30), { mimeType: mime, videoBitsPerSecond: 8e6 });
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' })); a.download = `night-storm-${Date.now()}.webm`; a.click();
    recorder = null; hud.classList.remove('rec'); hud.textContent = HUD;
  };
  recorder.start(); hud.classList.add('rec'); hud.textContent = '● recording — R to stop early';
  setTimeout(() => recorder && recorder.stop(), 10000);
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'l') strike();
  else if (k === ' ') { paused = !paused; e.preventDefault(); }
  else if (k === 'r') record();
  else if (k === 'v') { painted = !painted; R = painted ? RL : RS; }
  else if (k === 'c') crt = !crt;
  if ((k === 'v' || k === 'c') && !recorder) HUD = hud.textContent = hudText();
});
enterRoom('in', [-.3, 4.3]);                                    // the story starts at home
setTimeout(() => say_("Another dark and stormy night at the lighthouse."), 600);
requestAnimationFrame(frame);
</script>
